[package]
name = "qol-guest-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Guest-side desktop-session control runner for disposable qol development environments"

[[bin]]
name = "qol-guest-runner"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
qol-dev-guest.workspace = true
qol-headless.workspace = true
serde_json.workspace = true
workspace-hack.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
qol-platform.workspace = true
qol-process.workspace = true
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.8"

[lints]
workspace = true
