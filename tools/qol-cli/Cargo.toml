[package]
name = "qol"
version = "0.1.0"
edition = "2021"
description = "qol-tray dev orchestrator (replaces make)"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["KMRH47"]

[[bin]]
name = "qol"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml.workspace = true
ratatui = "0.30"
ansi-to-tui = "8.0"

[dev-dependencies]
tempfile = "3.8"
