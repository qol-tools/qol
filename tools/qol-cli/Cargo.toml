[package]
name = "qol"
version = "0.1.0"
edition = "2021"
description = "qol-tray dev orchestrator (replaces make)"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["KMRH47"]

[[bin]]
name = "qol"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6.0"
qol-config.workspace = true
qol-apps.workspace = true
qol-conventions.workspace = true
qol-dev-build.workspace = true
qol-fs.workspace = true
qol-process.workspace = true
qol-workspace.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml.workspace = true
toml_edit.workspace = true
ratatui = { version = "0.30", default-features = false, features = [
  "crossterm",
  "layout-cache",
  "underline-color",
] }
ansi-to-tui = "8.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.8"
