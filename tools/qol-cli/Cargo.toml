[package]
name = "qol"
version = "0.1.0"
edition = "2021"
description = "qol-tray dev orchestrator (replaces make)"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["KMRH47"]

[[bin]]
name = "qol"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6.0"
qol-config.workspace = true
qol-apps.workspace = true
qol-artifact.workspace = true
qol-build-identity.workspace = true
qol-conventions.workspace = true
qol-dev-build.workspace = true
qol-dev-env.workspace = true
qol-dev-guest.workspace = true
qol-dev-orchestrator.workspace = true
qol-fs.workspace = true
qol-headless.workspace = true
qol-terminal-sessions.workspace = true
qol-host-fixes.workspace = true
qol-plugin-api.workspace = true
qol-process.workspace = true
qol-runtime.workspace = true
qol-profile-sync.workspace = true
qol-workspace.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shell-words = "1.1"
tempfile = "3.8"
toml.workspace = true
toml_edit.workspace = true
ratatui = { version = "0.30", default-features = false, features = [
  "crossterm",
  "layout-cache",
  "underline-color",
] }
ansi-to-tui = "8.0"

[target.'cfg(target_os = "linux")'.dependencies]
# Git sync (libgit2 bindings; vendored so the host needs no system git)
# vendored-openssl is Linux-only: on macOS libgit2 uses SecureTransport for HTTPS,
# so vendored OpenSSL there would compile for nothing.
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Git sync: HTTPS runs on libgit2's SecureTransport backend here, no vendored OpenSSL
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
