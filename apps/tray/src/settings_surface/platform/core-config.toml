schema_version = 1
title = "qol"
description = "Core qol settings."

[section.appearance]
label = "Appearance"
description = "How qol looks on this computer."

[field.native_theme]
type = "select"
label = "Theme"
description = "The colors of every qol window."
section = "appearance"
default = "bone"
card_description = "Colors for qol windows."
options = ["bone", "slate"]

[field.native_theme.option_labels]
bone = "Bone"
slate = "Slate"

[field.native_theme.option_pictures]
bone = "desktop-theme:bone"
slate = "desktop-theme:slate"

[field.accent]
type = "select"
label = "Accent"
description = "The color that marks focus and selection."
section = "appearance"
default = "amber"
card_description = "The color of focus and selection."
options = ["amber", "green", "cyan", "magenta", "blue", "violet"]

[field.accent.option_labels]
amber = "Amber"
green = "Green"
cyan = "Cyan"
magenta = "Magenta"
blue = "Blue"
violet = "Violet"

[field.accent.option_pictures]
amber = "swatch:amber"
green = "swatch:green"
cyan = "swatch:cyan"
magenta = "swatch:magenta"
blue = "swatch:blue"
violet = "swatch:violet"

[field.animations]
type = "select"
label = "Animations"
description = "Motion in every qol window, spinners included."
section = "appearance"
default = "system"
card_description = "Motion in qol windows."
options = ["system", "on", "off"]

[field.animations.option_labels]
system = "Follow system"
on = "Always on"
off = "Off"

[field.animations.option_pictures]
system = "letters:sys"
on = "letters:on"
off = "letters:off"

[section.host]
label = "When qol stops"
description = "What qol leaves on this computer."

[field.residency]
type = "boolean"
label = "Keep settings in place"
description = "Your qol settings stay applied after qol stops."
section = "host"
default = false

[section.testing]
label = "Testing"
description = "Builds of changes that are not released yet."
platforms = ["linux", "macos"]

[field.try_pull_request_builds]
type = "boolean"
label = "Try pull request builds"
description = "Lists the builds of open qol pull requests on the Updates page, to install one before it is released. They are test builds, not signed releases. Needs a GitHub sign-in on Profiles."
section = "testing"
platforms = ["linux", "macos"]
default = false
