schema_version = 1
title = "qol"
description = "Core qol settings."

[section.appearance]
label = "Appearance"
description = "How qol looks on this machine."

[field.native_theme]
type = "select"
label = "Desktop theme"
description = "The colors of every qol window."
section = "appearance"
default = "bone"
card_description = "Colours for qol windows."
options = ["bone", "slate"]

[field.native_theme.option_labels]
bone = "Bone"
slate = "Slate"

[field.native_theme.option_pictures]
bone = "desktop-theme:bone"
slate = "desktop-theme:slate"

[field.accent]
type = "select"
label = "Accent"
description = "The color that marks focus and selection."
section = "appearance"
default = "amber"
card_description = "The colour of focus and selection."
options = ["amber", "green", "cyan", "magenta", "blue", "violet"]

[field.accent.option_labels]
amber = "Amber"
green = "Green"
cyan = "Cyan"
magenta = "Magenta"
blue = "Blue"
violet = "Violet"

[field.accent.option_pictures]
amber = "swatch:amber"
green = "swatch:green"
cyan = "swatch:cyan"
magenta = "swatch:magenta"
blue = "swatch:blue"
violet = "swatch:violet"

[section.host]
label = "This computer"
description = "What qol is allowed to change on this computer."

[field.profile]
type = "select"
label = "Profile"
description = "Pick which saved settings this computer uses."
section = "host"
query = "profiles"
lookup_label = "profiles"
default = "default"
card_description = "The profile this device loads."

[field.residency]
type = "boolean"
label = "Keep settings in place when qol is closed"
description = "Your qol settings stay applied even when qol is not running."
section = "host"
default = false
