msrv = "1.95.0"
disallowed-methods = [
    { path = "reqwest::RequestBuilder::send", reason = "send through connection_health::SendObserved::send_observed so the connection health signal sees every request" },
]
await-holding-invalid-types = [
    { path = "qol_sync::MutexGuard", reason = "drop the guard before the await; held across it, the lock blocks every thread that needs it until the task resumes" },
]
