name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_linux_deb:
    name: Build Linux .deb
    if: ${{ github.event.created == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-all-crates: true

      - name: Install cargo-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Build Debian package
        run: cargo deb

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          echo "Built artifacts:"
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error

  build_macos:
    name: Build macOS bundle (${{ matrix.name_suffix }})
    if: ${{ github.event.created == true }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: qol-tray-macos-aarch64
            name_suffix: Apple Silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: qol-tray-macos-x86_64
            name_suffix: Intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-all-crates: true

      - name: Build macOS binaries
        run: cargo build --release --target ${{ matrix.target }} --bin qol-tray --bin qol-tray-install

      - name: Prepare artifact
        shell: bash
        run: |
          BUNDLE="${{ matrix.artifact_name }}"
          mkdir -p "$BUNDLE"
          cp target/${{ matrix.target }}/release/qol-tray "$BUNDLE/qol-tray"
          cp target/${{ matrix.target }}/release/qol-tray-install "$BUNDLE/qol-tray-install"
          chmod +x "$BUNDLE/qol-tray" "$BUNDLE/qol-tray-install"
          cat > "$BUNDLE/install.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          DIR="$(cd "$(dirname "$0")" && pwd)"
          "$DIR/qol-tray-install" --source "$DIR/qol-tray"
          EOF
          chmod +x "$BUNDLE/install.sh"
          cat > "$BUNDLE/README.txt" <<'EOF'
          Run ./install.sh from this folder.
          EOF
          tar -czf "${BUNDLE}.tar.gz" "$BUNDLE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: ${{ github.event.created == true }}
    needs: [build_linux_deb, build_macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          if [[ ! "$VERSION" =~ ^v ]]; then
            VERSION="v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Validate tag format
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag '${VERSION}'. Expected semver format like v1.6.0."
            exit 1
          fi

      - name: Ensure release tag is new
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}"
          STATUS="$(curl -sS -o /tmp/release_check.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API}")"

          if [[ "${STATUS}" == "200" ]]; then
            echo "Release for tag ${VERSION} already exists; refusing to update."
            cat /tmp/release_check.json
            exit 1
          fi

          if [[ "${STATUS}" != "404" ]]; then
            echo "Unexpected GitHub API status ${STATUS} while checking ${VERSION}."
            cat /tmp/release_check.json
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: QoL Tray ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/**/*
          fail_on_unmatched_files: true
          allow_updates: false
          draft: false
          prerelease: false
