name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    if: github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '(ci)') || contains(github.event.head_commit.message, 'ci,') || contains(github.event.head_commit.message, ', ci')
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout qol-tray
        uses: actions/checkout@v4
        with:
          path: qol-tray

      - name: Checkout qol-config
        uses: actions/checkout@v4
        with:
          repository: qol-tools/qol-config
          path: qol-config

      - name: Resolve sibling ref
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          if [ -n "$HEAD_REF" ]; then
            printf 'SIBLING_REF=%s\n' "$HEAD_REF" >> "$GITHUB_ENV"
          else
            printf 'SIBLING_REF=%s\n' "$REF_NAME" >> "$GITHUB_ENV"
          fi

      - name: Checkout qol-migrations at matching ref
        uses: actions/checkout@v4
        with:
          repository: qol-tools/qol-migrations
          ref: ${{ env.SIBLING_REF }}
          path: qol-migrations

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: qol-tray

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Build
        working-directory: qol-tray
        run: cargo build

      - name: Test
        working-directory: qol-tray
        run: cargo test
