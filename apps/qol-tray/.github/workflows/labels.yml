name: Auto-label
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO_FULL: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Apply tray-host label
        run: gh pr edit "$PR_NUMBER" --repo "$REPO_FULL" --add-label tray-host
