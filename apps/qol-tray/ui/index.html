<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QoL Tray</title>
    <link rel="icon" href="data:,">
    <style>html.qol-bootstrapping-dive #app{visibility:hidden!important}</style>
    <script>
        try {
            var authFragmentKey = window.__QOL_AUTH_FRAGMENT_KEY__ || 'qol_token';
            var rawHash = location.hash.replace(/^#/, '');
            var queryStart = rawHash.indexOf('?');
            var hashRoute = queryStart >= 0 ? rawHash.slice(0, queryStart) : rawHash;
            var hashParams = new URLSearchParams(queryStart >= 0 ? rawHash.slice(queryStart + 1) : '');
            var fragmentToken = hashParams.get(authFragmentKey);
            if (fragmentToken && /^[A-Za-z0-9_-]{43}$/.test(fragmentToken)) {
                sessionStorage.setItem('qol:http-token', fragmentToken);
                hashParams.delete(authFragmentKey);
                var remaining = hashParams.toString();
                history.replaceState(null, '', location.pathname + location.search + '#' + hashRoute + (remaining ? '?' + remaining : ''));
            }
            var httpToken = sessionStorage.getItem('qol:http-token');
            if (httpToken) {
                document.cookie = authFragmentKey + '=' + httpToken + '; SameSite=Strict; Path=/';
                window.__QOL_HTTP_TOKEN__ = httpToken;
            }
        } catch (e) {}
    </script>
    <script>window.__QOL_BOOT__ = null; /* QOL_BOOT_INJECT */</script>
    <script>window.__QOL_AUTH_FRAGMENT_KEY__ = null; /* QOL_AUTH_FRAGMENT_KEY_INJECT */</script>
    <script>
        try {
            if (localStorage.getItem('qoltray.activePlugin')) {
                document.documentElement.classList.add('qol-bootstrapping-dive');
            }
        } catch (e) {}
        try {
            var boot = window.__QOL_BOOT__;
            if (boot && boot.accent) {
                var palette = boot.accent.palette || [];
                var chosen = null;
                for (var i = 0; i < palette.length; i++) {
                    if (palette[i].key === boot.accent.defaultKey) { chosen = palette[i]; break; }
                }
                if (chosen) {
                    document.documentElement.style.setProperty('--accent-rgb', chosen.rgb);
                    document.documentElement.style.setProperty('--accent-hover', chosen.hover);
                }
            }
            if (boot && boot.theme && boot.theme.defaultKey) {
                document.documentElement.setAttribute('data-qol-theme', boot.theme.defaultKey);
                var themes = boot.theme.themes || [];
                for (var j = 0; j < themes.length; j++) {
                    if (themes[j].key === boot.theme.defaultKey && themes[j].identityKey) {
                        document.documentElement.setAttribute('data-qol-identity', themes[j].identityKey);
                        break;
                    }
                }
            }
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "preact": "./lib/preact.module.js",
            "preact/hooks": "./lib/hooks.module.js",
            "htm": "./lib/htm.module.js"
        }
    }
    </script>
</head>
<body>
    <script>if(sessionStorage.getItem('qol:dissolve-pending'))document.body.classList.add('dissolve-pending')</script>
    <div id="app"></div>
    <script type="module" src="main.js"></script>
</body>
</html>
