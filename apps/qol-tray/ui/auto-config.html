<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plugin Settings</title>
<link rel="stylesheet" href="/styles/auto-config-page.css">
</head>
<body>
<main class="panel" id="root">
    <div class="loading-msg">Loading configuration...</div>
</main>

<script>
const PLUGIN_ID = new URLSearchParams(window.location.search).get('plugin')
    || window.location.pathname.split('/').filter(Boolean).pop();
const CONFIG_URL = `/api/plugins/${PLUGIN_ID}/config`;

const KNOWN_MODS = ['ctrl', 'shift', 'alt', 'cmd', 'ralt', 'altgr'];

let config = null;
let configStructure = null;

// --- Heuristics ---

function prettyLabel(key) {
    return key
        .replace(/_/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase());
}

function isModArray(key, value) {
    if (!Array.isArray(value)) return false;
    if (value.length === 0) return key.endsWith('_mods') || key === 'from_mods' || key === 'to_mods';
    return value.every(v => typeof v === 'string' && KNOWN_MODS.includes(v));
}

function isStringArray(value) {
    return Array.isArray(value) && value.every(v => typeof v === 'string');
}

function isObjectArray(value) {
    return Array.isArray(value) && value.length > 0 && typeof value[0] === 'object' && value[0] !== null && !Array.isArray(value[0]);
}

function isEmptyObjectArray(key, value) {
    return Array.isArray(value) && value.length === 0 && key.endsWith('_rules');
}

function isHexColor(value) {
    return typeof value === 'string' && /^[0-9a-f]{6}$/i.test(value);
}

function isColorField(key, value) {
    return isHexColor(value) || (typeof value === 'string' && (key.endsWith('_color') || key.includes('color')));
}

function isPlainObject(value) {
    return typeof value === 'object' && value !== null && !Array.isArray(value);
}

// --- Rendering ---

function renderConfig(container, obj, path = '') {
    for (const [key, value] of Object.entries(obj)) {
        const fullPath = path ? `${path}.${key}` : key;

        if (typeof value === 'boolean') {
            container.appendChild(renderBoolean(key, fullPath));
        } else if (typeof value === 'number') {
            container.appendChild(renderNumber(key, value, fullPath));
        } else if (isColorField(key, value)) {
            container.appendChild(renderColor(key, fullPath));
        } else if (typeof value === 'string') {
            container.appendChild(renderString(key, fullPath));
        } else if (isModArray(key, value)) {
            // mod arrays are rendered inline within rule rows, not standalone
            container.appendChild(renderModArrayStandalone(key, fullPath));
        } else if (isStringArray(value)) {
            container.appendChild(renderStringList(key, fullPath));
        } else if (isObjectArray(value) || isEmptyObjectArray(key, value)) {
            container.appendChild(renderObjectArray(key, value, fullPath));
        } else if (isPlainObject(value)) {
            container.appendChild(renderSection(key, value, fullPath));
        }
    }
}

function getVal(path) {
    const parts = path.split('.');
    let obj = config;
    for (const p of parts) obj = obj?.[p];
    return obj;
}

function setVal(path, value) {
    const parts = path.split('.');
    let obj = config;
    for (let i = 0; i < parts.length - 1; i++) {
        if (obj[parts[i]] === undefined) obj[parts[i]] = {};
        obj = obj[parts[i]];
    }
    obj[parts[parts.length - 1]] = value;
}

function renderBoolean(key, path) {
    const div = document.createElement('div');
    div.className = 'field-group toggle-row';
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = getVal(path);
    cb.addEventListener('change', () => setVal(path, cb.checked));
    const strong = document.createElement('strong');
    strong.textContent = prettyLabel(key);
    label.append(cb, strong);
    div.appendChild(label);
    return div;
}

function renderNumber(key, value, path) {
    const div = document.createElement('div');
    div.className = 'field-group';

    const label = document.createElement('div');
    label.className = 'field-label';
    label.textContent = prettyLabel(key);
    div.appendChild(label);

    const isFloat = !Number.isInteger(value);
    const row = document.createElement('div');
    row.className = 'slider-row';

    if (isFloat && value >= 0 && value <= 1) {
        // Render as slider 0-1
        const slider = document.createElement('input');
        slider.type = 'range';
        slider.min = '0';
        slider.max = '1';
        slider.step = '0.01';
        slider.value = getVal(path);
        const valSpan = document.createElement('span');
        valSpan.className = 'slider-val';
        valSpan.textContent = Number(getVal(path)).toFixed(2);
        slider.addEventListener('input', () => {
            const v = parseFloat(slider.value);
            setVal(path, v);
            valSpan.textContent = v.toFixed(2);
        });
        row.append(slider, valSpan);
    } else {
        const input = document.createElement('input');
        input.type = 'number';
        input.className = 'number-input';
        input.value = getVal(path);
        if (isFloat) input.step = 'any';
        input.addEventListener('change', () => {
            const v = isFloat ? parseFloat(input.value) : parseInt(input.value, 10);
            if (!isNaN(v)) setVal(path, v);
        });
        row.appendChild(input);
    }

    div.appendChild(row);
    return div;
}

function renderString(key, path) {
    const div = document.createElement('div');
    div.className = 'field-group';
    const label = document.createElement('div');
    label.className = 'field-label';
    label.textContent = prettyLabel(key);
    div.appendChild(label);
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'text-input';
    input.value = getVal(path);
    input.addEventListener('input', () => setVal(path, input.value));
    div.appendChild(input);
    return div;
}

function renderColor(key, path) {
    const div = document.createElement('div');
    div.className = 'field-group';
    const label = document.createElement('div');
    label.className = 'field-label';
    label.textContent = prettyLabel(key);
    div.appendChild(label);

    const row = document.createElement('div');
    row.className = 'color-row';

    const swatch = document.createElement('input');
    swatch.type = 'color';
    swatch.className = 'color-swatch';
    swatch.value = '#' + (getVal(path) || '000000');

    const hex = document.createElement('input');
    hex.type = 'text';
    hex.className = 'color-hex';
    hex.value = getVal(path) || '';

    swatch.addEventListener('input', () => {
        const v = swatch.value.replace('#', '');
        hex.value = v;
        setVal(path, v);
    });
    hex.addEventListener('input', () => {
        const v = hex.value.replace('#', '');
        if (/^[0-9a-f]{6}$/i.test(v)) {
            swatch.value = '#' + v;
            setVal(path, v);
        }
    });

    row.append(swatch, hex);
    div.appendChild(row);
    return div;
}

function renderModArrayStandalone(key, path) {
    const div = document.createElement('div');
    div.className = 'field-group';
    const label = document.createElement('div');
    label.className = 'field-label';
    label.textContent = prettyLabel(key);
    div.appendChild(label);
    div.appendChild(createModToggles(path, getVal(path) || []));
    return div;
}

function createModToggles(path, activeMods) {
    const row = document.createElement('div');
    row.className = 'mod-toggles';
    row.dataset.path = path;

    for (const mod of KNOWN_MODS) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'mod-chip' + (activeMods.includes(mod) ? ' active' : '');
        chip.textContent = mod;
        chip.dataset.mod = mod;
        chip.addEventListener('click', () => {
            chip.classList.toggle('active');
            const active = Array.from(row.querySelectorAll('.mod-chip.active')).map(b => b.dataset.mod);
            setVal(path, active);
        });
        row.appendChild(chip);
    }
    return row;
}

function renderModChipsStatic(mods) {
    return mods.map(m => `<span class="mod-chip-static">${m}</span>`).join(' ');
}

function renderStringList(key, path) {
    const div = document.createElement('div');
    div.className = 'field-group';
    const label = document.createElement('div');
    label.className = 'field-label';
    label.textContent = prettyLabel(key);
    div.appendChild(label);

    const isApps = key === 'excluded_apps' || key.endsWith('_apps') || key.endsWith('_bundles');

    const listEl = document.createElement('div');
    listEl.className = 'string-list';
    div.appendChild(listEl);

    const addRow = document.createElement('div');
    addRow.className = 'add-row';
    const addInput = document.createElement('input');
    addInput.type = 'text';
    addInput.className = 'text-input';
    addInput.placeholder = 'Add item...';
    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'btn-add';
    addBtn.textContent = '+ Add';
    addRow.append(addInput, addBtn);
    div.appendChild(addRow);

    function render() {
        const arr = getVal(path) || [];
        if (arr.length === 0) {
            listEl.innerHTML = '<div class="empty-state">No items.</div>';
            return;
        }
        listEl.innerHTML = arr.map((item, i) => {
            const iconHtml = isApps
                ? `<img class="app-icon" src="/api/icon/${encodeURIComponent(item)}" width="20" height="20" onerror="this.style.display='none'">`
                : '';
            return `<div class="string-item">${iconHtml}<span>${escHtml(item)}</span><button class="btn-remove" data-idx="${i}">&times;</button></div>`;
        }).join('');

        listEl.querySelectorAll('.btn-remove').forEach(btn => {
            btn.addEventListener('click', () => {
                const arr = getVal(path);
                arr.splice(parseInt(btn.dataset.idx), 1);
                render();
            });
        });
    }

    function addItem() {
        const v = addInput.value.trim();
        if (!v) return;
        const arr = getVal(path);
        if (arr.includes(v)) return;
        arr.push(v);
        addInput.value = '';
        render();
    }

    addBtn.addEventListener('click', addItem);
    addInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addItem(); } });

    render();
    return div;
}

function renderSection(key, value, path) {
    const card = document.createElement('section');
    card.className = 'card';
    const h2 = document.createElement('h2');
    h2.textContent = prettyLabel(key);
    card.appendChild(h2);
    renderConfig(card, value, path);
    return card;
}

// --- Object array (rule lists) ---

function inferFieldType(key, value) {
    if (typeof value === 'boolean') return 'boolean';
    if (typeof value === 'number') return 'number';
    if (isModArray(key, value)) return 'mods';
    if (typeof value === 'string') return 'string';
    if (isStringArray(value)) return 'string-array';
    return 'unknown';
}

function getObjectArraySchema(arr) {
    // Infer field schema from all items in the array
    const fields = new Map();
    for (const item of arr) {
        for (const [k, v] of Object.entries(item)) {
            if (!fields.has(k)) {
                fields.set(k, inferFieldType(k, v));
            }
        }
    }
    return fields;
}

function renderRuleRow(item, index, path, rerenderFn) {
    const row = document.createElement('div');
    row.className = 'rule-row';

    // Smart display: group mods and keys into a readable format
    const fromMods = item.from_mods;
    const toMods = item.to_mods;
    const hasMods = fromMods || toMods;

    if (hasMods) {
        // Render as: from_mods [key(s)] → to_mods [key(s)]
        const fromSide = document.createElement('div');
        fromSide.className = 'rule-side';
        if (fromMods) fromSide.innerHTML = renderModChipsStatic(fromMods);
        if (item.keys) fromSide.innerHTML += ' ' + item.keys.map(k => `<span class="key-chip">${escHtml(k)}</span>`).join(' ');
        if (item.from_key) fromSide.innerHTML += ` <span class="key-label">${escHtml(item.from_key)}</span>`;
        if (item.button) fromSide.innerHTML += ` <span class="key-label">${escHtml(item.button)} click</span>`;
        row.appendChild(fromSide);

        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.innerHTML = '&rarr;';
        row.appendChild(arrow);

        const toSide = document.createElement('div');
        toSide.className = 'rule-side';
        if (toMods) toSide.innerHTML = renderModChipsStatic(toMods);
        if (item.to_key) toSide.innerHTML += ` <span class="key-label">${escHtml(item.to_key)}</span>`;
        else if (item.keys) toSide.innerHTML += ' <span class="key-label-hint">same key</span>';
        if (item.to_char) toSide.innerHTML += ` <span class="key-label char-output">${escHtml(item.to_char)}</span>`;
        row.appendChild(toSide);
    } else {
        // Generic: show all fields
        for (const [k, v] of Object.entries(item)) {
            if (k === 'global') continue;
            const span = document.createElement('span');
            span.className = 'key-label';
            span.textContent = `${k}: ${Array.isArray(v) ? v.join(', ') : v}`;
            row.appendChild(span);
        }
    }

    if (item.global) {
        const badge = document.createElement('span');
        badge.className = 'global-badge';
        badge.textContent = 'global';
        row.appendChild(badge);
    }

    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'btn-remove';
    removeBtn.innerHTML = '&times;';
    removeBtn.addEventListener('click', () => {
        getVal(path).splice(index, 1);
        rerenderFn();
    });
    row.appendChild(removeBtn);

    return row;
}

function renderObjectArray(key, value, path) {
    const card = document.createElement('section');
    card.className = 'card';
    const h2 = document.createElement('h2');
    h2.textContent = prettyLabel(key);
    card.appendChild(h2);

    const listEl = document.createElement('div');
    listEl.className = 'rules-list';
    card.appendChild(listEl);

    const schema = value.length > 0 ? getObjectArraySchema(value) : guessSchemaFromKey(key);

    // Add form
    const addRow = document.createElement('div');
    addRow.className = 'add-rule-row';
    card.appendChild(addRow);

    function rerender() {
        const arr = getVal(path) || [];
        listEl.innerHTML = '';
        if (arr.length === 0) {
            listEl.innerHTML = '<div class="empty-state">No items.</div>';
        } else {
            arr.forEach((item, i) => {
                listEl.appendChild(renderRuleRow(item, i, path, rerender));
            });
        }
    }

    buildAddForm(addRow, schema, path, rerender);
    rerender();
    return card;
}

function guessSchemaFromKey(key) {
    // When array is empty, guess based on key name
    const fields = new Map();
    if (key.includes('key_rule') || key.includes('char_rule')) {
        fields.set('from_mods', 'mods');
        if (key.includes('char')) {
            fields.set('from_key', 'string');
            fields.set('to_char', 'string');
        } else {
            fields.set('to_mods', 'mods');
            fields.set('keys', 'string-array');
        }
        fields.set('global', 'boolean');
    } else if (key.includes('mouse')) {
        fields.set('from_mods', 'mods');
        fields.set('button', 'string');
        fields.set('to_mods', 'mods');
        fields.set('global', 'boolean');
    } else if (key.includes('scroll')) {
        fields.set('from_mods', 'mods');
        fields.set('to_mods', 'mods');
        fields.set('global', 'boolean');
    } else {
        fields.set('value', 'string');
    }
    return fields;
}

function buildAddForm(container, schema, arrayPath, rerenderFn) {
    container.innerHTML = '';
    const inputs = {};

    for (const [fieldKey, fieldType] of schema) {
        if (fieldType === 'mods') {
            const side = document.createElement('div');
            side.className = 'rule-side';
            const label = document.createElement('span');
            label.className = 'field-label';
            label.textContent = prettyLabel(fieldKey);
            label.style.marginRight = '0.25rem';
            label.style.marginBottom = '0';
            side.appendChild(label);

            const toggles = document.createElement('div');
            toggles.className = 'mod-toggles';
            for (const mod of KNOWN_MODS) {
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'mod-chip';
                chip.textContent = mod;
                chip.dataset.mod = mod;
                chip.addEventListener('click', () => chip.classList.toggle('active'));
                toggles.appendChild(chip);
            }
            side.appendChild(toggles);
            container.appendChild(side);
            inputs[fieldKey] = { type: 'mods', el: toggles };

            // Add arrow after from_mods if to_mods follows
            if (fieldKey === 'from_mods') {
                const arrow = document.createElement('span');
                arrow.className = 'arrow';
                arrow.innerHTML = '&rarr;';
                container.appendChild(arrow);
            }
        } else if (fieldType === 'boolean') {
            const label = document.createElement('label');
            label.className = 'global-toggle';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            const span = document.createElement('span');
            span.textContent = prettyLabel(fieldKey);
            label.append(cb, span);
            container.appendChild(label);
            inputs[fieldKey] = { type: 'boolean', el: cb };
        } else if (fieldType === 'string-array') {
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'key-input keys-input';
            input.placeholder = `${prettyLabel(fieldKey)} (comma-separated)`;
            container.appendChild(input);
            inputs[fieldKey] = { type: 'string-array', el: input };
        } else {
            const input = document.createElement('input');
            input.type = fieldType === 'number' ? 'number' : 'text';
            input.className = 'key-input';
            input.placeholder = prettyLabel(fieldKey);
            container.appendChild(input);
            inputs[fieldKey] = { type: fieldType, el: input };
        }
    }

    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'btn-add';
    addBtn.textContent = '+ Add';
    addBtn.addEventListener('click', () => {
        const item = {};
        for (const [fieldKey, info] of Object.entries(inputs)) {
            if (info.type === 'mods') {
                item[fieldKey] = Array.from(info.el.querySelectorAll('.mod-chip.active')).map(b => b.dataset.mod);
            } else if (info.type === 'boolean') {
                item[fieldKey] = info.el.checked;
            } else if (info.type === 'string-array') {
                item[fieldKey] = info.el.value.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
            } else if (info.type === 'number') {
                item[fieldKey] = parseFloat(info.el.value) || 0;
            } else {
                item[fieldKey] = info.el.value.trim();
            }
        }

        // Don't add empty items
        const hasContent = Object.entries(item).some(([k, v]) => {
            if (k === 'global') return false;
            if (Array.isArray(v)) return v.length > 0;
            if (typeof v === 'string') return v.length > 0;
            return true;
        });
        if (!hasContent) return;

        let arr = getVal(arrayPath);
        if (!arr) {
            setVal(arrayPath, []);
            arr = getVal(arrayPath);
        }
        arr.push(item);

        // Reset form
        for (const info of Object.values(inputs)) {
            if (info.type === 'mods') {
                info.el.querySelectorAll('.mod-chip').forEach(c => c.classList.remove('active'));
            } else if (info.type === 'boolean') {
                info.el.checked = false;
            } else {
                info.el.value = '';
            }
        }

        rerenderFn();
    });
    container.appendChild(addBtn);
}

function escHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
}

// --- Save ---

function setStatus(text, isError = false) {
    const el = document.getElementById('save-status');
    if (el) {
        el.textContent = text;
        el.classList.toggle('error', isError);
    }
}

async function saveConfig() {
    const btn = document.getElementById('save-btn');
    if (btn) btn.disabled = true;
    setStatus('Saving...');

    try {
        const response = await fetch(CONFIG_URL, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(config, null, 2)
        });
        if (!response.ok) throw new Error(`Status ${response.status}`);
        setStatus('Saved');
        setTimeout(() => setStatus(''), 2000);
    } catch (e) {
        console.error('Save failed', e);
        setStatus('Failed to save', true);
        setTimeout(() => setStatus(''), 3000);
    } finally {
        if (btn) btn.disabled = false;
    }
}

// --- Init ---

async function init() {
    const root = document.getElementById('root');

    try {
        const res = await fetch(CONFIG_URL);
        if (!res.ok) {
            root.innerHTML = `<div class="hero"><h1>${prettyLabel(PLUGIN_ID)} Settings</h1></div>
                <div class="card"><p>No configuration found for this plugin.</p></div>`;
            return;
        }
        config = await res.json();
    } catch (e) {
        root.innerHTML = `<div class="hero"><h1>Error</h1></div>
            <div class="card"><p>Failed to load configuration: ${escHtml(e.message)}</p></div>`;
        return;
    }

    root.innerHTML = '';

    const hero = document.createElement('header');
    hero.className = 'hero';
    hero.innerHTML = `<h1>${escHtml(prettyLabel(PLUGIN_ID))} Settings</h1>`;
    root.appendChild(hero);

    renderConfig(root, config);

    const actions = document.createElement('footer');
    actions.className = 'actions';
    actions.innerHTML = `
        <button id="save-btn" class="save">Save Settings</button>
        <span id="save-status"></span>
    `;
    root.appendChild(actions);

    document.getElementById('save-btn').addEventListener('click', saveConfig);
    document.addEventListener('keydown', e => {
        if (e.key === 's' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            saveConfig();
        }
    });
}

init();
</script>
</body>
</html>
