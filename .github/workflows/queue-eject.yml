name: queue eject

on:
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions:
  contents: read

# Only queue runs serialize here. GitHub cancels a run waiting in a group when
# another joins it, so a pull request or push run, whose job is skipped, would
# otherwise cancel a waiting queue run's sweep.
concurrency:
  group: ${{ github.event.workflow_run.event == 'merge_group' && 'queue-eject' || format('queue-eject-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  sweep:
    name: Dequeue an entry that failed on its own
    if: github.event.workflow_run.event == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Dequeue the frontmost failure once the entry ahead passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/queue_eject.py
