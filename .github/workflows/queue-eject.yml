name: queue eject

on:
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: queue-eject
  cancel-in-progress: false

jobs:
  sweep:
    name: Dequeue an entry that failed on its own
    if: github.event.workflow_run.event == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Dequeue the frontmost failure once the entry ahead passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/queue_eject.py
