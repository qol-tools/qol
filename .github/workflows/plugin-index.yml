name: Publish plugin index

on:
  workflow_dispatch:

permissions: {}

# One build at a time. GitHub keeps only the newest pending run, and every run
# reads every tag in the registry, so skipped runs lose nothing.
concurrency:
  group: plugin-index
  cancel-in-progress: false

env:
  MINISIGN_VERSION: "0.12"
  MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
  PUBLIC_KEY: apps/tray/src/features/plugin_store/index/plugin-index.pub

jobs:
  # Versions the deployed index already lists are copied from it, never
  # re-read, so a listed version cannot change and only new tags cost requests.
  build:
    name: Build index
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: plugin-registry
          system-dependencies: "false"

      - name: Build registry tool
        run: cargo build --locked -p qol-plugin-registry

      - name: Build index
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
          INDEX_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/plugins/index.json
        run: |
          set -euo pipefail
          target/debug/qol-plugin-registry index \
            --registry "ghcr.io/${GITHUB_REPOSITORY_OWNER}/plugins" \
            --public-key "${PUBLIC_KEY}" \
            --previous-url "${INDEX_URL}" \
            --output index.json | tee -a "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-index
          path: index.json
          retention-days: 1
          if-no-files-found: error

  # The signing key lives only in this job, which compiles nothing and runs
  # only the pinned minisign binary.
  sign:
    name: Sign index
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: plugin-index
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: apps/tray/src/features/plugin_store/index

      - name: Install minisign
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/minisign.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/minisign-${MINISIGN_VERSION}-linux.tar.gz"
          echo "${MINISIGN_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" minisign-linux/x86_64/minisign
          sudo install -m 0755 "${RUNNER_TEMP}/minisign-linux/x86_64/minisign" /usr/local/bin/minisign
          minisign -v

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-index
          path: site/plugins

      - name: Sign index
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.PLUGIN_INDEX_MINISIGN_KEY }}
        run: |
          set -euo pipefail
          key="${RUNNER_TEMP}/plugin-index.key"
          trap 'rm -f "${key}"' EXIT
          (umask 077 && printf '%s\n' "${MINISIGN_SECRET_KEY}" > "${key}")
          minisign -S -s "${key}" -m site/plugins/index.json -x site/plugins/index.json.minisig -t "qol plugin index" < /dev/null

      - name: Verify with the key the tray ships
        run: minisign -V -p "${PUBLIC_KEY}" -m site/plugins/index.json -x site/plugins/index.json.minisig

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
