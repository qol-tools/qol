name: Publish plugin index

on:
  workflow_dispatch:

permissions: {}

# One build at a time. GitHub keeps only the newest pending run, and every run
# reads every tag in the registry, so skipped runs lose nothing.
concurrency:
  group: plugin-index
  cancel-in-progress: false

env:
  MINISIGN_VERSION: "0.12"
  MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
  PUBLIC_KEY: apps/tray/src/features/plugin_store/index/plugin-index.pub

jobs:
  # Versions the deployed index already lists are copied from it, never
  # re-read, so a listed version cannot change and only new tags cost requests.
  build:
    name: Build index
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=lld
      INDEX_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/plugins/index.signed.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: plugin-registry
          system-dependencies: "false"

      - name: Build registry tool
        run: cargo build --locked -p qol-plugin-registry

      # New host builds are listed only once gh attestation verify accepts
      # every file as built by the Versioning workflow of this repository.
      - name: Build index
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target/debug/qol-plugin-registry index \
            --registry "ghcr.io/${GITHUB_REPOSITORY_OWNER}/plugins" \
            --public-key "${PUBLIC_KEY}" \
            --previous-url "${INDEX_URL}" \
            --provenance-repo "${GITHUB_REPOSITORY}" \
            --provenance-workflow .github/workflows/qol-tray-host-publish.yml \
            --output index.json | tee -a "${GITHUB_STEP_SUMMARY}"

      # Every plugin release dispatches this workflow, and one run usually
      # picks up the tags of the releases after it, so most runs rebuild the
      # index already deployed. Only a different index is signed and deployed.
      - name: Compare with the deployed index
        id: compare
        run: |
          set -euo pipefail
          deployed="$(curl -fsSL "${INDEX_URL}" | jq -r .index | jq -S 'del(.serial)')" || deployed=""
          if [ "${deployed}" = "$(jq -S 'del(.serial)' index.json)" ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "The deployed index already matches, nothing to publish." | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-index
          path: index.json
          retention-days: 1
          if-no-files-found: error

  # The signing key lives only in this job, which compiles nothing and runs
  # only the pinned minisign binary. The environment only scopes the key, so
  # it records no deployment.
  sign:
    name: Sign index
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: plugin-index
      deployment: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: apps/tray/src/features/plugin_store/index

      - name: Install minisign
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/minisign.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/minisign-${MINISIGN_VERSION}-linux.tar.gz"
          echo "${MINISIGN_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" minisign-linux/x86_64/minisign
          sudo install -m 0755 "${RUNNER_TEMP}/minisign-linux/x86_64/minisign" /usr/local/bin/minisign
          minisign -v

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-index
          path: site/plugins

      - name: Sign index
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.PLUGIN_INDEX_MINISIGN_KEY }}
        run: |
          set -euo pipefail
          key="${RUNNER_TEMP}/plugin-index.key"
          trap 'rm -f "${key}"' EXIT
          (umask 077 && printf '%s\n' "${MINISIGN_SECRET_KEY}" > "${key}")
          minisign -S -s "${key}" -m site/plugins/index.json -x site/plugins/index.json.minisig -t "qol plugin index" < /dev/null

      - name: Verify with the key the tray ships
        run: minisign -V -p "${PUBLIC_KEY}" -m site/plugins/index.json -x site/plugins/index.json.minisig

      # Pages caches each file for ten minutes on its own, so right after a
      # deploy index.json and index.json.minisig can be served from different
      # deploys. One file holding both can never mismatch; the pair stays for
      # trays released before it.
      - name: Bundle the signature with the index
        run: |
          set -euo pipefail
          jq -n --rawfile index site/plugins/index.json --rawfile signature site/plugins/index.json.minisig \
            '{signature: $signature, index: $index}' > site/plugins/index.signed.json
          jq -j .index site/plugins/index.signed.json | cmp - site/plugins/index.json
          jq -j .signature site/plugins/index.signed.json | cmp - site/plugins/index.json.minisig

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-index-signed
          path: site/plugins/index.signed.json
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The registry copy has no CDN cache, so trays read it first. This job holds
  # no signing key; it pushes the file sign already signed and verified.
  registry:
    name: Publish index to the registry
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: plugin-registry
          system-dependencies: "false"

      # Built in its own step, which holds no token.
      - name: Build registry tool
        run: cargo build --locked -p qol-plugin-registry

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-index-signed

      - name: Push signed index
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          target/debug/qol-plugin-registry push-index \
            --registry "ghcr.io/${GITHUB_REPOSITORY_OWNER}/plugins" \
            --signed index.signed.json | tee -a "${GITHUB_STEP_SUMMARY}"
