name: Publish plugin index

on:
  workflow_dispatch:

permissions: {}

# One build at a time. GitHub keeps only the newest pending run, and every run
# rebuilds the whole index from the registry, so skipped runs lose nothing.
concurrency:
  group: plugin-index
  cancel-in-progress: false

env:
  MINISIGN_VERSION: "0.12"
  MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
  PUBLIC_KEY: apps/tray/src/features/plugin_store/index/plugin-index.pub

jobs:
  build:
    name: Build and sign index
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: plugin-index
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            apps/tray/src/features/plugin_store/index

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4

      - name: Install minisign
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/minisign.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/minisign-${MINISIGN_VERSION}-linux.tar.gz"
          echo "${MINISIGN_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" minisign-linux/x86_64/minisign
          sudo install -m 0755 "${RUNNER_TEMP}/minisign-linux/x86_64/minisign" /usr/local/bin/minisign
          minisign -v

      # Published versions may never change, so the build compares the registry
      # against the index users already trust. Only a missing index starts over.
      - name: Fetch the deployed index
        env:
          INDEX_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/plugins/index.json
        run: |
          set -euo pipefail
          mkdir -p previous
          status="$(curl -sS -o previous/index.json -w '%{http_code}' "${INDEX_URL}")"
          case "${status}" in
            200)
              curl -fsS -o previous/index.json.minisig "${INDEX_URL}.minisig"
              minisign -V -p "${PUBLIC_KEY}" -m previous/index.json -x previous/index.json.minisig
              ;;
            404)
              rm -f previous/index.json
              echo "No deployed index yet; this build starts the history." | tee -a "${GITHUB_STEP_SUMMARY}"
              ;;
            *)
              echo "::error::${INDEX_URL} answered ${status}"
              exit 1
              ;;
          esac

      - name: Build index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${GH_TOKEN}" | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          previous=()
          if [[ -f previous/index.json ]]; then
            previous=(--previous previous/index.json)
          fi
          python3 .github/scripts/plugin_index.py \
            --registry "ghcr.io/${GITHUB_REPOSITORY_OWNER}/plugins" \
            --output site/plugins/index.json "${previous[@]}" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Sign index
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.PLUGIN_INDEX_MINISIGN_KEY }}
        run: |
          set -euo pipefail
          key="${RUNNER_TEMP}/plugin-index.key"
          trap 'rm -f "${key}"' EXIT
          (umask 077 && printf '%s\n' "${MINISIGN_SECRET_KEY}" > "${key}")
          minisign -S -s "${key}" -m site/plugins/index.json -x site/plugins/index.json.minisig -t "qol plugin index" < /dev/null

      - name: Verify with the key the tray ships
        run: minisign -V -p "${PUBLIC_KEY}" -m site/plugins/index.json -x site/plugins/index.json.minisig

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
