name: Dependency gate

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - "**/Cargo.toml"
      - deny.toml
      - .github/workflows/cargo-deny.yml
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - "**/Cargo.toml"
      - deny.toml
      - .github/workflows/cargo-deny.yml
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-deny-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: advisories, bans and sources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny

      - name: Check the lockfile against deny.toml
        run: cargo deny --locked check advisories bans sources
