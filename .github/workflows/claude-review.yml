name: claude review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: 2.1.292
  CLAUDE_MODEL: claude-sonnet-5-5
  MARKETPLACES: |-
    https://github.com/qol-tools/qol-skills.git
    https://github.com/KMRH47/kmrh47-skills.git
  PLUGINS: |-
    qol-code-review@qol-skills
    qol-project@qol-skills
    qol-langs@qol-skills
    engineering-discipline@kmrh47-skills
    writing@kmrh47-skills

jobs:
  review:
    name: Review with qol-code-review
    # Push to main only refreshes the plugin seed cache, which every pull request can restore.
    if: >-
      github.event_name == 'push' ||
      (!github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !endsWith(github.actor, '[bot]'))
    # Job-level, so a run whose job is skipped (draft, bot) never cancels a running review.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve marketplace heads
        id: seed
        env:
          GH_TOKEN: ${{ secrets.KMRH47_SKILLS_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          heads=""
          while read -r url; do
            head="$(git ls-remote "$url" HEAD | cut -f1)"
            test -n "$head"
            heads="$heads $head"
          done <<< "$MARKETPLACES"
          hash="$(printf '%s %s %s' "$heads" "$CLAUDE_CODE_VERSION" "$PLUGINS" | sha256sum | cut -c1-8)"
          echo "key=claude-seed-$hash" >> "$GITHUB_OUTPUT"
          echo "dir=$HOME/.claude-seed" >> "$GITHUB_OUTPUT"

      - name: Restore plugin seed
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.claude-seed
          key: ${{ steps.seed.outputs.key }}
          lookup-only: ${{ github.event_name == 'push' }}

      - name: Install Claude Code
        if: github.event_name == 'pull_request' || steps.cache.outputs.cache-hit != 'true'
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Build plugin seed
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.KMRH47_SKILLS_TOKEN }}
          CLAUDE_CODE_PLUGIN_CACHE_DIR: ${{ steps.seed.outputs.dir }}
        run: |
          set -euo pipefail
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/seed-config"
          while read -r url; do claude plugin marketplace add "$url"; done <<< "$MARKETPLACES"
          while read -r plugin; do claude plugin install "$plugin"; done <<< "$PLUGINS"

      - name: Save plugin seed
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.claude-seed
          key: ${{ steps.seed.outputs.key }}

      - name: Run qol-code-review
        if: github.event_name == 'pull_request'
        # Below the job timeout, so a hung review fails instead of cancelling the post step.
        timeout-minutes: 50
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_PLUGIN_SEED_DIR: ${{ steps.seed.outputs.dir }}
          CLAUDE_CODE_SYNC_PLUGIN_INSTALL: "1"
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ env.CLAUDE_MODEL }}
          CLAUDE_CODE_SUBAGENT_MODEL_FORCE: "1"
          DISABLE_AUTOUPDATER: "1"
          SEED: ${{ steps.seed.outputs.dir }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/claude-review"
          # Inputs the model reads live in the checkout; .git/info/exclude keeps them out of the fix commit.
          ctx=".claude-review"
          mkdir -p "$work" "$ctx"
          echo "/$ctx/" >> .git/info/exclude
          skill="$(echo "$SEED"/cache/qol-skills/qol-code-review/*/skills/qol-code-review)"
          test -f "$skill/SKILL.md"
          cp -r "$skill/references" "$ctx/references"
          git diff HEAD^1 HEAD > "$ctx/pr.diff"
          node "$skill/scripts/shallow-wrappers.cjs" --root . --diff "$ctx/pr.diff" \
            --json "$ctx/shallow-wrappers.json" > "$ctx/shallow-wrappers.txt"
          jq -Rn '{enabledPlugins: ([inputs | select(length > 0) | {(.): true}] | add)}' \
            <<< "$PLUGINS" > "$work/settings.json"
          {
            echo "/qol-code-review:qol-code-review Review pull request #$PR_NUMBER of $GITHUB_REPOSITORY."
            echo
            echo "- Checkout: $PWD, the merge of the pull request into its base. Git history is not available."
            echo "- PR diff: $ctx/pr.diff"
            echo "- Shallow-wrapper detector output, already run on that diff: $ctx/shallow-wrappers.txt and $ctx/shallow-wrappers.json"
            echo "- Review checklists: $ctx/references/review-checklists.md"
            echo "- Title: $PR_TITLE"
            echo "- Description:"
            # Capped so the prompt stays under the kernel's per-argument limit.
            printf '%s\n' "${PR_BODY:0:20000}" | sed 's/^/  > /'
            echo
            cat .github/claude-review/prompt.md
          } > "$work/prompt.md"
          claude -p "$(cat "$work/prompt.md")" \
            --model "$CLAUDE_MODEL" \
            --effort medium \
            --settings "$work/settings.json" \
            --agents .github/claude-review/agents.json \
            --dangerously-skip-permissions \
            --disallowedTools Bash Edit Write NotebookEdit WebFetch WebSearch \
            --output-format json > "$work/result.json"
          jq -c '.permission_denials // []' "$work/result.json"
          # The workflow persists the review, so the model needs no shell.
          jq -r 'select(.subtype == "success" and .is_error != true) | .result // empty' "$work/result.json" > "$work/reply.md"
          if [ -s "$work/reply.md" ]; then
            verdict="$(grep -oE '"verdict": *"[a-z]+"' "$work/reply.md" | tail -n1 | grep -oE '[a-z]+"$' | tr -d '"' || true)"
            node "$skill/scripts/save-review.cjs" --verdict "${verdict:-unknown}" --slug pr --run-id review \
              --out-dir "$work/out" --in "$work/reply.md"
          fi

      - name: Post review comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SECRET_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SECRET_PAT: ${{ secrets.KMRH47_SKILLS_TOKEN }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/claude-review"
          review="$work/out/review/review.md"
          failed=""
          if [ ! -s "$review" ]; then
            echo "::warning::qol-code-review wrote no review.md, posting the final reply instead"
            review="$work/reply.md"
            mkdir -p "$work"
            jq -r 'select(.subtype == "success" and .is_error != true) | .result // empty' \
              "$work/result.json" > "$review" 2>/dev/null || true
          fi
          if [ ! -s "$review" ]; then
            failed=1
            printf 'The review of %s failed before it produced a result. See [the run](%s).\n' "$HEAD_SHA" "$RUN_URL" > "$review"
          fi
          for secret in "$SECRET_OAUTH" "$SECRET_PAT"; do
            if [ -n "$secret" ] && grep -qF -- "$secret" "$review"; then
              echo "::error::the review contains a secret and was not posted"
              exit 1
            fi
          done
          marker='<!-- qol-code-review -->'
          body="$work/comment.md"
          { echo "$marker"; echo "Reviewed head: $HEAD_SHA"; echo; cat "$review"; } > "$body"
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | tail -n1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@"$body" > /dev/null
          fi
          if [ -n "$failed" ]; then
            echo "::error::qol-code-review produced no review"
            exit 1
          fi

      - name: Fix review findings
        id: fix
        if: github.event_name == 'pull_request'
        timeout-minutes: 40
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_PLUGIN_SEED_DIR: ${{ steps.seed.outputs.dir }}
          CLAUDE_CODE_SYNC_PLUGIN_INSTALL: "1"
          DISABLE_AUTOUPDATER: "1"
          SEED: ${{ steps.seed.outputs.dir }}
          FIX_SUBJECT: "chore(review): address review findings"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/claude-review"
          out="$work/out/review"
          # One fix round per push: a head that is already the fix commit only gets reviewed.
          if [ "$(git log -1 --format=%s HEAD^2)" = "$FIX_SUBJECT" ]; then
            echo "Head is the review fix commit, skipping."
            exit 0
          fi
          verdict="$(jq -r '.status // empty' "$out/report.json" 2>/dev/null || true)"
          if [ "$verdict" != "conditional" ] && [ "$verdict" != "block" ]; then
            echo "Verdict is '${verdict:-missing}', nothing to fix."
            exit 0
          fi
          { cat "$out/review.md"; echo; cat .github/claude-review/fix-prompt.md; } > "$work/fix-prompt.md"
          claude -p "$(cat "$work/fix-prompt.md")" \
            --model "$CLAUDE_MODEL" \
            --effort medium \
            --settings "$work/settings.json" \
            --dangerously-skip-permissions \
            --disallowedTools Bash Agent NotebookEdit WebFetch WebSearch "Edit(/$GITHUB_WORKSPACE/.git/**)" \
            > "$work/fix-reply.md"
          cat "$work/fix-reply.md"
          # Staged so files the fix creates are part of the patch.
          git add -A
          git diff --cached > "$work/fix.patch"
          if [ -s "$work/fix.patch" ]; then
            echo "patch=$work/fix.patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Push review fixes
        if: steps.fix.outputs.patch != ''
        env:
          DEPLOY_KEY: ${{ secrets.VERSIONING_DEPLOY_KEY }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          FIX_SUBJECT: "chore(review): address review findings"
          PATCH: ${{ steps.fix.outputs.patch }}
        run: |
          set -euo pipefail
          # The review ran on the merge ref; the fix lands on the pull request head.
          git reset -q --hard
          git switch -q --detach HEAD^2
          git apply --index "$PATCH"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "$FIX_SUBJECT"
          key="$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          # The deploy key, unlike the workflow token, starts the tests and merge gate on the pushed fix.
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git push "git@github.com:$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$HEAD_REF"
          rm -f "$key"
