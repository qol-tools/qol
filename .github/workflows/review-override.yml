name: review override

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  override:
    name: Apply the review override
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review-override ') &&
      github.event.comment.user.login == 'KMRH47' &&
      github.triggering_actor == 'KMRH47'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Record the override and rerun the verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT: ${{ github.event.comment.body }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: python3 .github/scripts/review_gate.py override
