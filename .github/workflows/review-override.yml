name: review override

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  override:
    name: Apply the review override
    if: >-
      github.event.label.name == 'review-override' &&
      github.event.sender.login == 'KMRH47' &&
      github.triggering_actor == 'KMRH47'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Record the override and rerun the verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTOR: ${{ github.event.sender.login }}
        run: python3 .github/scripts/review_gate.py override
