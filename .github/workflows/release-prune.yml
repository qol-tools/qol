name: Prune old releases

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      keep:
        description: Releases to keep per component
        required: false
        default: "3"
        type: string
      dry_run:
        description: Print the plan without deleting
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Prune releases and tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ github.event.inputs.keep || '3' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          args=(--keep "${KEEP}")
          if [[ "${DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python3 .github/scripts/prune_releases.py "${args[@]}" | tee -a "${GITHUB_STEP_SUMMARY}"
