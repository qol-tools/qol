name: live test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A new push replaces the build a person would download, so an older run of the
# same pull request stops.
concurrency:
  group: live-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify the live test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      checks: write
      pull-requests: read
    outputs:
      needed: ${{ steps.classify.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Post whether the change needs a live test
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/live_test.py

  # A change a person must see working gets a Linux x86_64 and a macOS arm64
  # build of what it changes, made the way a release makes it, so the test
  # downloads it instead of compiling on the tester's machine. A change the
  # checks prove gets none.
  build:
    name: Build for the live test (${{ matrix.platform }})
    needs: classify
    if: needs.classify.outputs.needed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: live-test-build-linux-x86_64
          - platform: macos
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: live-test-build-macos-aarch64
    env:
      RUSTFLAGS: -D warnings ${{ matrix.platform == 'linux' && '-C link-arg=-fuse-ld=lld' || '' }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: plugin-release-${{ matrix.target }}
          targets: ${{ matrix.target }}
          save-cache: "false"

      - name: Plan what the live test needs built
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLATFORM: ${{ matrix.platform }}
        run: >
          python .github/scripts/live_test_build.py plan
          --platform "${PLATFORM}"
          --manifest "${RUNNER_TEMP}/live-test-build/manifest.json"

      - name: Export production artifact identity
        if: steps.plan.outputs.build == 'true'
        run: cargo run --locked --quiet -p qol-build-identity --bin qol-build-identity -- emit production >> "${GITHUB_ENV}"

      - name: Build the plugins
        if: steps.plan.outputs.plugin_tags != ''
        env:
          TAGS: ${{ steps.plan.outputs.plugin_tags }}
        run: |
          python .github/scripts/release_candidate.py build-plugins \
            --tags "${TAGS}" \
            --target "${TARGET}" \
            --report-dir "${RUNNER_TEMP}/live-test-reports" \
            --dist-dir "${RUNNER_TEMP}/live-test-build/plugins" \
            --github-output "${RUNNER_TEMP}/plugin-builds"
          failed=$(sed -n 's/^failed=//p' "${RUNNER_TEMP}/plugin-builds")
          if [ -n "${failed}" ]; then
            echo "::error::plugin builds failed: ${failed}"
            exit 1
          fi

      - name: Install cargo-deb
        if: matrix.platform == 'linux' && steps.plan.outputs.tray_tag != ''
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-deb

      - name: Build the tray
        if: matrix.platform == 'linux' && steps.plan.outputs.tray_tag != ''
        run: |
          python .github/scripts/release_candidate.py build \
            --kind qol-tray-linux \
            --report "${RUNNER_TEMP}/live-test-reports/qol-tray.json"
          mkdir -p "${RUNNER_TEMP}/live-test-build/tray"
          cp target/release/qol-tray target/debian/*.deb "${RUNNER_TEMP}/live-test-build/tray/"

      - name: Build the tray app
        if: matrix.platform == 'macos' && steps.plan.outputs.tray_tag != ''
        env:
          TRAY_TAG: ${{ steps.plan.outputs.tray_tag }}
        run: |
          cargo build --release --locked --target "${TARGET}" --bin qol-tray
          cargo run --quiet --locked -p qol-build-identity --bin qol-build-identity -- verify production
          python .github/scripts/macos_app_bundle.py \
            --binary "target/${TARGET}/release/qol-tray" \
            --version "${TRAY_TAG#qol-tray-v}" \
            --app "${RUNNER_TEMP}/QoL Tray.app"
          codesign --force --deep --sign - "${RUNNER_TEMP}/QoL Tray.app"
          codesign --verify --deep --strict "${RUNNER_TEMP}/QoL Tray.app"
          mkdir -p "${RUNNER_TEMP}/live-test-build/tray"
          tar -C "${RUNNER_TEMP}" -czf "${RUNNER_TEMP}/live-test-build/tray/qol-tray-macos-aarch64.tar.gz" "QoL Tray.app"

      - name: Upload the build
        if: steps.plan.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/live-test-build
          retention-days: 3
          if-no-files-found: error
