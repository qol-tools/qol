name: Backfill plugin registry

# Pushes plugin releases published before the registry existed, then rebuilds
# the index. Tags already in the registry are skipped, so reruns are safe.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: plugin-registry-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Push existing releases
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4

      - name: Push releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          printf '%s' "${GH_TOKEN}" | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          python3 .github/scripts/plugin_artifact.py \
            --registry "ghcr.io/${GITHUB_REPOSITORY_OWNER}/plugins" \
            --source "https://github.com/${GITHUB_REPOSITORY}" \
            backfill | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Dispatch the index build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run plugin-index.yml --ref main
