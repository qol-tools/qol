name: tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Every gate that needs no compiler runs here, so a failed lint or script
  # test skips the matrix instead of starting it. The review runs beside this
  # workflow: the queue admits a pull request only once both required checks
  # pass, so no job waits for the verdict.
  plan:
    name: Plan affected crates
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(plugins): bump plugin versions') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reused: ${{ steps.verdict.outputs.reused }}
      trusted: ${{ steps.trust.outputs.trusted }}
      ubuntu_clippy: ${{ steps.trust.outputs.ubuntu_clippy || steps.affected.outputs.ubuntu_clippy }}
      ubuntu_build: ${{ steps.trust.outputs.ubuntu_build || steps.affected.outputs.ubuntu_build }}
      ubuntu_test: ${{ steps.trust.outputs.ubuntu_test || steps.affected.outputs.ubuntu_test }}
      ubuntu_doctest: ${{ steps.trust.outputs.ubuntu_doctest || steps.affected.outputs.ubuntu_doctest }}
      ubuntu_skip: ${{ steps.trust.outputs.ubuntu_skip || steps.affected.outputs.ubuntu_skip }}
      tray_dev: ${{ steps.trust.outputs.tray_dev || steps.affected.outputs.tray_dev }}
      macos_clippy: ${{ steps.trust.outputs.macos_clippy || steps.affected.outputs.macos_clippy }}
      macos_build: ${{ steps.trust.outputs.macos_build || steps.affected.outputs.macos_build }}
      macos_test: ${{ steps.trust.outputs.macos_test || steps.affected.outputs.macos_test }}
      macos_doctest: ${{ steps.trust.outputs.macos_doctest || steps.affected.outputs.macos_doctest }}
      macos_skip: ${{ steps.trust.outputs.macos_skip || steps.affected.outputs.macos_skip }}
      windows_clippy: ${{ steps.trust.outputs.windows_clippy || steps.affected.outputs.windows_clippy }}
      windows_build: ${{ steps.trust.outputs.windows_build || steps.affected.outputs.windows_build }}
      windows_test: ${{ steps.trust.outputs.windows_test || steps.affected.outputs.windows_test }}
      windows_doctest: ${{ steps.trust.outputs.windows_doctest || steps.affected.outputs.windows_doctest }}
      windows_skip: ${{ steps.trust.outputs.windows_skip || steps.affected.outputs.windows_skip }}
      lint_skip: ${{ steps.trust.outputs.lint_skip || steps.affected.outputs.lint_skip }}
      registry_tool_skip: ${{ steps.trust.outputs.registry_tool_skip || steps.affected.outputs.registry_tool_skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Single source guard
        run: node .githooks/single-source-guard.mjs

      # The commit-msg gate derives its scope vocabulary from the workspace
      # layout, so a rename or a new family silently narrows what commits are
      # allowed. These run in seconds and keep the local hook honest.
      - name: Test commit-msg hook
        run: bash .githooks/commit-msg.test.sh

      # The merge queue squashes a pull request into one commit titled by the
      # pull request, and versioning reads that subject, so the queue refuses a
      # title the commit-msg gate would refuse. A pull request run only warns,
      # because editing the title does not rerun it.
      - name: Squash subject is conventional
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          TITLE: ${{ github.event.pull_request.title || github.event.merge_group.head_commit.message }}
        run: |
          subject="${TITLE%%$'\n'*}"
          printf '%s\n' "${subject% (#[0-9]*)}" > "$RUNNER_TEMP/subject"
          if ! .githooks/commit-msg "$RUNNER_TEMP/subject"; then
            level=warning
            [[ "$GITHUB_EVENT_NAME" == merge_group ]] && level=error
            echo "::${level}::the pull request title becomes the squash commit subject; retitle it as <type>(scope): summary"
            [[ "$level" == warning ]]
          fi

      - name: Test release scripts
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py'

      - name: Test repository inventory
        run: node --test verify/repository-inventory.test.mjs

      - name: Plugin manifest versions agree
        run: python3 .github/scripts/plugin_version.py --check-manifests

      # qac lint runs the qol-project edit-time hooks over the whole repository.
      # Rules about the code as it stands hold on every file. Rules about added
      # code compare each file with the base, so they judge only this change.
      # A push is exempt: a red main run would stop Versioning, and the queue
      # has already linted every pull request. A pull request run is a merge
      # commit, so its first parent is the base it was merged onto. The hooks
      # only act on files under a directory named qol-<something>, and a runner
      # checks this repository out as qol/qol, so the lint reads a worktree
      # named like a local clone.
      - name: qac lint
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          base="${BASE_SHA:-$(git rev-parse HEAD^1)}"
          git clone --quiet --depth 1 https://github.com/qol-tools/qol-skills "$RUNNER_TEMP/qol-skills"
          git worktree add --quiet --detach "$RUNNER_TEMP/qol-monorepo" HEAD
          node "$RUNNER_TEMP/qol-skills/plugins/qol-project/scripts/qac.mjs" lint "--cwd=$RUNNER_TEMP/qol-monorepo" "--base=$base" > "$RUNNER_TEMP/qac.json" || true
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            for (const f of r.findings) {
              const line = f.lines?.[0] ? `,line=${f.lines[0]}` : "";
              console.log(`::error file=${f.file}${line},title=${f.hook}::${f.summary}`);
            }
            console.log(`qac lint: ${r.files} files, ${r.findings.length} findings`);
            process.exit(r.findings.length ? 1 : 0);
          ' "$RUNNER_TEMP/qac.json"

      - name: Reuse a verdict this workflow already reached
        id: verdict
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/queue_verdict.py

      - name: Compute affected crates
        id: affected
        if: github.event_name != 'merge_group'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          QOL_AFFECTED_OUTPUT: ${{ runner.temp }}/affected.json
        run: python3 .github/scripts/affected_crates.py

      - name: Record what this run tests
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/queue_trust.py record "$PR_HEAD_SHA" "$(git rev-parse HEAD^1)" \
            "$RUNNER_TEMP/affected.json" "$RUNNER_TEMP/tested-base/tested-base.json"

      - name: Upload the tested base
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-base
          path: ${{ runner.temp }}/tested-base/tested-base.json
          retention-days: 7
          overwrite: true

      - name: Trust the pull request run
        id: trust
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/queue_trust.py

      - name: Pull request results cover this entry
        if: steps.trust.outputs.trusted == 'true'
        run: echo "nothing that landed since the pull request run reaches its crates"

  check:
    name: lint + test (${{ matrix.os }})
    needs: plan
    # A run that reuses a verdict has nothing left to lint or test. Release
    # binaries build in the release build job below, beside this one. The
    # version bump push skips the plan, and a skipped ancestor skips every
    # job below it unless the job tests plan's result itself.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.reused != 'true' && needs.plan.outputs.trusted != 'true' }}
    # RUSTFLAGS env overrides the repo's [target.*] rustflags, so the lld
    # link-arg must be restated here (ubuntu-only: -fuse-ld=lld is invalid on macOS).
    # Windows links with the toolchain's rust-lld in CI only; link.exe spent
    # most of the test compile linking 161 test binaries. Release builds in
    # plugin-version.yml keep link.exe, so they are the first link.exe link.
    env:
      RUSTFLAGS: -D warnings ${{ matrix.os == 'ubuntu-24.04' && '-C link-arg=-fuse-ld=lld' || matrix.os == 'windows-latest' && '-C linker=rust-lld -C target-feature=+crt-static' || '' }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 75 || 45 }}
    defaults:
      run:
        shell: bash
    # A failed queue entry goes back whatever the other runners find, so its
    # first failure stops them; a pull request keeps every OS result for one fix.
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        include:
          # Format, workspace-hack and lockfile gates cover the whole workspace
          # and run here once, also when only another runner has crates to test.
          - os: ubuntu-24.04
            clippy_args: ${{ needs.plan.outputs.ubuntu_clippy }}
            build_args: ${{ needs.plan.outputs.ubuntu_build }}
            test_args: ${{ needs.plan.outputs.ubuntu_test }}
            tray_dev: ${{ needs.plan.outputs.tray_dev }}
            doctest: ${{ needs.plan.outputs.ubuntu_doctest }}
            skip: ${{ needs.plan.outputs.ubuntu_skip }}
            lint_skip: ${{ needs.plan.outputs.lint_skip }}
          - os: macos-latest
            clippy_args: ${{ needs.plan.outputs.macos_clippy }}
            build_args: ${{ needs.plan.outputs.macos_build }}
            test_args: ${{ needs.plan.outputs.macos_test }}
            doctest: ${{ needs.plan.outputs.macos_doctest }}
            skip: ${{ needs.plan.outputs.macos_skip }}
          - os: windows-latest
            clippy_args: ${{ needs.plan.outputs.windows_clippy }}
            build_args: ${{ needs.plan.outputs.windows_build }}
            test_args: ${{ needs.plan.outputs.windows_test }}
            doctest: ${{ needs.plan.outputs.windows_doctest }}
            skip: ${{ needs.plan.outputs.windows_skip }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.skip != 'true' || (runner.os == 'Linux' && matrix.lint_skip != 'true')

      # A runner that only lints compiles nothing, so it neither restores the
      # build cache nor installs the system libraries.
      - uses: ./.github/actions/rust-setup
        if: matrix.skip != 'true' || (runner.os == 'Linux' && matrix.lint_skip != 'true')
        with:
          cache-key: ci-${{ matrix.os }}
          save-cache: "false"
          lookup-only: ${{ matrix.skip == 'true' }}
          components: rustfmt, clippy

      - name: Install cargo-hakari
        if: runner.os == 'Linux' && matrix.lint_skip != 'true'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-hakari

      - name: Install cargo-nextest
        if: matrix.skip != 'true'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-nextest@0.9.143

      # The workspace-hack crate pins every third-party dependency to the
      # workspace-wide feature union so package-scoped builds share artifacts
      # with workspace builds. Both checks exit non-zero when a manifest
      # changed without regenerating it.
      - name: Workspace-hack is current
        if: runner.os == 'Linux' && matrix.lint_skip != 'true'
        run: |
          cargo hakari generate --diff
          cargo hakari manage-deps --dry-run

      # A manifest can declare a dependency Cargo.lock does not record. Cargo
      # then rewrites the lockfile on every build, which dirties the tree
      # mid-build and fails the --locked release pipeline after merge.
      # `--no-deps` cannot stand in here: it skips resolution and exits 0
      # against a stale lockfile.
      - name: Lockfile is current
        if: runner.os == 'Linux' && matrix.lint_skip != 'true'
        run: |
          if error=$(cargo metadata --locked --format-version 1 2>&1 >/dev/null); then
            exit 0
          fi
          printf '%s\n' "$error" >&2
          echo "::error title=Stale Cargo.lock::Cargo.lock does not match the workspace manifests. Run 'cargo metadata', then commit the regenerated Cargo.lock."
          exit 1

      - name: Format
        if: runner.os == 'Linux' && matrix.lint_skip != 'true'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.skip != 'true'
        env:
          CLIPPY_ARGS: ${{ matrix.clippy_args }}
        run: cargo clippy --locked --keep-going $CLIPPY_ARGS -- -D warnings

      - name: Clippy qol-tray with the dev feature
        if: runner.os == 'Linux' && matrix.skip != 'true' && matrix.tray_dev == 'true'
        run: cargo clippy --locked --keep-going -p qol-tray --all-targets --features qol-tray/dev -- -D warnings

      # A pull request run builds no release binaries, so this check is its
      # proof that the release profile compiles. Only the build cache workflow
      # saves the cache, and it runs the same check, so this one starts warm.
      - name: Release profile check
        if: matrix.skip != 'true' && github.event_name == 'pull_request'
        env:
          BUILD_ARGS: ${{ matrix.build_args }}
          RUSTFLAGS: -D warnings ${{ matrix.os == 'ubuntu-24.04' && '-C link-arg=-fuse-ld=lld' || matrix.os == 'windows-latest' && '-C linker=rust-lld -C target-feature=+crt-static' || '' }}
        run: cargo check --release --locked $BUILD_ARGS

      - name: Test
        if: runner.os == 'Linux' && matrix.skip != 'true'
        env:
          TEST_ARGS: ${{ matrix.test_args }}
          DOCTEST: ${{ matrix.doctest }}
          TRAY_DEV: ${{ matrix.tray_dev }}
        run: |
          cgroup_mount=/sys/fs/cgroup
          [[ $(stat -fc '%T' "$cgroup_mount") == cgroup2fs ]] || {
            echo '::error::qol-process tests require unified cgroup v2'
            exit 1
          }
          cgroup_path=$(awk -F: '$1 == "0" { print $3; exit }' /proc/self/cgroup)
          [[ -n "$cgroup_path" ]] || {
            echo '::error::current cgroup v2 path is unavailable'
            exit 1
          }
          cgroup_origin="$cgroup_mount$cgroup_path"
          cgroup_root="$cgroup_origin/qol-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-$$"
          journal_root="$RUNNER_TEMP/qol-process-cgroups-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-$$"
          mkdir -m 700 "$journal_root"
          cleanup_cgroup() {
            status=$?
            trap - EXIT
            set +e
            printf '%s\n' "$$" | sudo tee "$cgroup_origin/cgroup.procs" >/dev/null
            restored=$?
            killed=0
            removed=0
            journal_removed=0
            if ((restored == 0)); then
              printf '1\n' | sudo tee "$cgroup_root/cgroup.kill" >/dev/null
              killed=$?
              if ((killed == 0)); then
                for _ in {1..100}; do
                  grep -q '^populated 0$' "$cgroup_root/cgroup.events" && break
                  sleep 0.05
                done
              fi
              while IFS= read -r cgroup; do
                sudo rmdir "$cgroup" || removed=1
              done < <(sudo find "$cgroup_root" -depth -type d -print)
              sudo test ! -d "$cgroup_root" || removed=1
              if ((killed == 0 && removed == 0)); then
                python3 .github/scripts/cleanup_cgroup_journal.py "$journal_root" "$cgroup_root" || journal_removed=1
              fi
            fi
            if ((status == 0 && (restored != 0 || killed != 0 || removed != 0 || journal_removed != 0))); then
              status=1
            fi
            exit "$status"
          }
          trap cleanup_cgroup EXIT
          sudo mkdir "$cgroup_root"
          sudo chown "$(id -u):$(id -g)" \
            "$cgroup_root" \
            "$cgroup_root/cgroup.procs" \
            "$cgroup_root/cgroup.subtree_control" \
            "$cgroup_root/cgroup.threads"
          printf '%s\n' "$$" | sudo tee "$cgroup_root/cgroup.procs" >/dev/null
          export QOL_PROCESS_CGROUP_ROOT="$cgroup_root"
          export QOL_PROCESS_CGROUP_JOURNAL_ROOT="$journal_root"
          cargo nextest run --locked $TEST_ARGS --no-fail-fast --retries 0 --no-tests=pass --ignore-default-filter
          if [ "$TRAY_DEV" = "true" ]; then
            cargo nextest run --locked -p qol-tray --features qol-tray/dev --no-fail-fast --retries 0 --no-tests=pass --ignore-default-filter
          fi
          if [ "$DOCTEST" = "true" ]; then
            cargo test --locked $TEST_ARGS --doc
          fi

      - name: Test
        if: runner.os != 'Linux' && matrix.skip != 'true'
        env:
          TEST_ARGS: ${{ matrix.test_args }}
          DOCTEST: ${{ matrix.doctest }}
        run: |
          cargo nextest run --locked $TEST_ARGS --no-fail-fast --retries 0 --no-tests=pass --ignore-default-filter
          if [ "$DOCTEST" = "true" ]; then
            cargo test --locked $TEST_ARGS --doc
          fi

  # Only the tail of the merge queue, the last entry GitHub is building, runs
  # the release build. Its queue commit holds every entry ahead of it, so the
  # build plans against main rather than the entry ahead, whose commit is this
  # run's merge_group base. queue_batch.py explains the rest of the batch.
  batch:
    name: batch role
    needs: plan
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      role: ${{ steps.role.outputs.role }}
      ubuntu_build: ${{ steps.affected.outputs.ubuntu_build }}
      ubuntu_skip: ${{ steps.affected.outputs.ubuntu_skip }}
      macos_build: ${{ steps.affected.outputs.macos_build }}
      macos_skip: ${{ steps.affected.outputs.macos_skip }}
      windows_build: ${{ steps.affected.outputs.windows_build }}
      windows_skip: ${{ steps.affected.outputs.windows_skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find this entry in the merge queue
        id: role
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/queue_batch.py role

      - name: Plan the batch release build against main
        id: affected
        if: steps.role.outputs.role == 'tail'
        env:
          TRUSTED: ${{ needs.plan.outputs.trusted }}
          AHEAD_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          head="$GITHUB_SHA"
          if [[ "$TRUSTED" == true ]]; then
            head="$AHEAD_SHA"
          fi
          BASE_SHA="$(git merge-base origin/main HEAD)" HEAD_SHA="$head" python3 .github/scripts/affected_crates.py

  # Pull requests only check the release profile. The queue's tail builds it
  # here in parallel with lint + test, so the build no longer waits behind
  # clippy and the tests. A push to main never runs it: the build cache
  # workflow already compiles the release build there, and a second job saving
  # the same cache key would drop one job's artifacts.
  release-build:
    name: release build (${{ matrix.os }})
    needs: [plan, batch]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.batch.result == 'success' && needs.batch.outputs.role == 'tail' &&
      !(needs.plan.outputs.trusted == 'true' && needs.batch.outputs.ubuntu_skip == 'true' &&
      needs.batch.outputs.macos_skip == 'true' && needs.batch.outputs.windows_skip == 'true') }}
    env:
      RUSTFLAGS: -D warnings ${{ matrix.os == 'ubuntu-24.04' && '-C link-arg=-fuse-ld=lld' || matrix.os == 'windows-latest' && '-C linker=rust-lld -C target-feature=+crt-static' || '' }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 75 || 45 }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            build_args: ${{ needs.batch.outputs.ubuntu_build }}
            skip: ${{ needs.batch.outputs.ubuntu_skip }}
          - os: macos-latest
            build_args: ${{ needs.batch.outputs.macos_build }}
            skip: ${{ needs.batch.outputs.macos_skip }}
          - os: windows-latest
            build_args: ${{ needs.batch.outputs.windows_build }}
            skip: ${{ needs.batch.outputs.windows_skip }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.skip != 'true'

      - uses: ./.github/actions/rust-setup
        if: matrix.skip != 'true'
        with:
          cache-key: ci-${{ matrix.os }}

      - name: Release profile build
        if: matrix.skip != 'true'
        env:
          BUILD_ARGS: ${{ matrix.build_args }}
        run: cargo build --release --locked $BUILD_ARGS

  # Every publish job builds the registry tool after merge, on a runner without
  # the Linux system libraries the jobs above install. Building it the same way
  # here fails a change that pulls a system library into the tool before it can
  # stop every release.
  registry-tool:
    name: registry tool build
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.reused != 'true' && needs.plan.outputs.trusted != 'true' && needs.plan.outputs.registry_tool_skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: plugin-registry
          system-dependencies: "false"

      - name: Build registry tool
        run: cargo build --locked -p qol-plugin-registry

  # A failed batch release build sends the whole batch back as one pull
  # request on a queue-batch/ branch and closes the originals. A batch of one,
  # or a batch whose tail already combines one, goes back as usual.
  batch-failure:
    name: Combine the failed batch
    needs: [batch, release-build]
    if: ${{ always() && github.event_name == 'merge_group' && needs.batch.outputs.role == 'tail' && needs.release-build.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
    outputs:
      combined: ${{ steps.combine.outputs.combined }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Open one pull request for the batch
        id: combine
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/queue_batch.py combine

  # The one check the merge queue ruleset requires. A skipped job reports no
  # status under its matrix name, so requiring the jobs themselves would leave
  # a pull request waiting on a check that never arrives. A push is exempt so a
  # skipped run stays skipped for Versioning. In the queue this job only judges
  # the entry's own jobs, and queue_batch.py posts the required merge gate
  # check once a batch release build covers the entry, so the job takes
  # another name there. It runs after the failure report, which needs the
  # entry still queued.
  gate:
    name: ${{ github.event_name == 'merge_group' && 'queue gate' || 'merge gate' }}
    needs: [plan, check, batch, release-build, registry-tool, batch-failure, queue-report]
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'merge_group'
        with:
          sparse-checkout: .github/scripts

      - name: Every job passed or was skipped
        id: verdict
        env:
          PLAN: ${{ needs.plan.result }}
          REUSED: ${{ needs.plan.outputs.reused }}
          TRUSTED: ${{ needs.plan.outputs.trusted }}
          CHECK: ${{ needs.check.result }}
          BATCH: ${{ needs.batch.result }}
          ROLE: ${{ needs.batch.outputs.role }}
          BUILD: ${{ needs.release-build.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        # A queue run that skipped its tests or release builds would land an
        # untested commit that Versioning then refuses to release.
        run: |
          echo "plan: $PLAN, all: $RESULTS"
          [ "$PLAN" = success ] || exit 1
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            [ "$BATCH" = success ] || exit 1
            [ "$ROLE" != tail ] || [ "$BUILD" = success ] || { [ "$TRUSTED" = true ] && [ "$BUILD" = skipped ]; } || exit 1
            [ "$REUSED" = true ] || [ "$TRUSTED" = true ] || [ "$CHECK" = success ] || exit 1
          fi
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac

      - name: Report the verdict to the merge queue
        if: ${{ always() && github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.verdict.outcome }}
          ROLE: ${{ needs.batch.outputs.role }}
        run: python3 .github/scripts/queue_batch.py gate

  # A push to main rebuilds every waiting queue group on a new ref, and the
  # concurrency group, keyed on the run id, never cancels the run on the old ref.
  # The run that replaces it cancels it, so its runners go to the run that counts.
  supersede:
    name: Cancel superseded queue runs
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Cancel older runs for this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: python3 .github/scripts/cancel_superseded_queue_runs.py

  # GitHub only marks a queue removal on the pull request timeline, so a failed
  # queue run says which jobs failed on the pull request itself and fails its head.
  queue-report:
    name: Report merge queue failure
    needs: [plan, check, batch, release-build, registry-tool, batch-failure]
    if: ${{ always() && github.event_name == 'merge_group' && contains(needs.*.result, 'failure') && needs.batch-failure.outputs.combined == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: python3 .github/scripts/queue_report.py
