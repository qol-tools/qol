name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan affected crates
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(plugins): bump plugin versions') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ubuntu_clippy: ${{ steps.affected.outputs.ubuntu_clippy }}
      ubuntu_build: ${{ steps.affected.outputs.ubuntu_build }}
      ubuntu_test: ${{ steps.affected.outputs.ubuntu_test }}
      ubuntu_doctest: ${{ steps.affected.outputs.ubuntu_doctest }}
      ubuntu_skip: ${{ steps.affected.outputs.ubuntu_skip }}
      macos_clippy: ${{ steps.affected.outputs.macos_clippy }}
      macos_build: ${{ steps.affected.outputs.macos_build }}
      macos_test: ${{ steps.affected.outputs.macos_test }}
      macos_doctest: ${{ steps.affected.outputs.macos_doctest }}
      macos_skip: ${{ steps.affected.outputs.macos_skip }}
      windows_process: ${{ steps.affected.outputs.windows_process }}
      windows_dev_build: ${{ steps.affected.outputs.windows_dev_build }}
      windows_qol: ${{ steps.affected.outputs.windows_qol }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Single source guard
        run: node .githooks/single-source-guard.mjs

      # The commit-msg gate derives its scope vocabulary from the workspace
      # layout, so a rename or a new family silently narrows what commits are
      # allowed. These run in seconds and keep the local hook honest.
      - name: Test commit-msg hook
        run: bash .githooks/commit-msg.test.sh

      - name: Test QoL Tray UI
        working-directory: apps/qol-tray/ui
        run: |
          mapfile -d '' tests < <(find . -type f -name '*.test.js' -print0)
          ((${#tests[@]})) || { echo "No UI tests found" >&2; exit 1; }
          node --test "${tests[@]}"

      - name: Test release scripts
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py'

      - name: Plugin manifest versions agree
        run: python3 .github/scripts/plugin_version.py --check-manifests

      - name: Compute affected crates
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/affected_crates.py

  check:
    name: lint + test (${{ matrix.os }})
    needs: plan
    # RUSTFLAGS env overrides the repo's [target.*] rustflags, so the lld
    # link-arg must be restated here (ubuntu-only: -fuse-ld=lld is invalid on macOS).
    env:
      RUSTFLAGS: -D warnings ${{ matrix.os == 'ubuntu-latest' && '-C link-arg=-fuse-ld=lld' || '' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            clippy_args: ${{ needs.plan.outputs.ubuntu_clippy }}
            build_args: ${{ needs.plan.outputs.ubuntu_build }}
            test_args: ${{ needs.plan.outputs.ubuntu_test }}
            doctest: ${{ needs.plan.outputs.ubuntu_doctest }}
            skip: ${{ needs.plan.outputs.ubuntu_skip }}
          - os: macos-latest
            clippy_args: ${{ needs.plan.outputs.macos_clippy }}
            build_args: ${{ needs.plan.outputs.macos_build }}
            test_args: ${{ needs.plan.outputs.macos_test }}
            doctest: ${{ needs.plan.outputs.macos_doctest }}
            skip: ${{ needs.plan.outputs.macos_skip }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.skip != 'true'

      - name: Free disk space
        if: runner.os == 'Linux' && matrix.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: ./.github/actions/rust-setup
        if: matrix.skip != 'true'
        with:
          cache-key: ci-${{ matrix.os }}
          components: rustfmt, clippy

      - name: Install cargo-hakari
        if: runner.os == 'Linux' && matrix.skip != 'true'
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-hakari

      - name: Install cargo-nextest
        if: matrix.skip != 'true'
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: cargo-nextest@0.9.143

      # The workspace-hack crate pins every third-party dependency to the
      # workspace-wide feature union so package-scoped builds share artifacts
      # with workspace builds. Both checks exit non-zero when a manifest
      # changed without regenerating it.
      - name: Workspace-hack is current
        if: runner.os == 'Linux' && matrix.skip != 'true'
        run: |
          cargo hakari generate --diff
          cargo hakari manage-deps --dry-run

      # A manifest can declare a dependency Cargo.lock does not record. Cargo
      # then rewrites the lockfile on every build, which dirties the tree
      # mid-build and fails the --locked release pipeline after merge.
      # `--no-deps` cannot stand in here: it skips resolution and exits 0
      # against a stale lockfile.
      - name: Lockfile is current
        if: runner.os == 'Linux' && matrix.skip != 'true'
        run: |
          if error=$(cargo metadata --locked --format-version 1 2>&1 >/dev/null); then
            exit 0
          fi
          printf '%s\n' "$error" >&2
          echo "::error title=Stale Cargo.lock::Cargo.lock does not match the workspace manifests. Run 'cargo metadata', then commit the regenerated Cargo.lock."
          exit 1

      - name: Format
        if: runner.os == 'Linux' && matrix.skip != 'true'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.skip != 'true'
        env:
          CLIPPY_ARGS: ${{ matrix.clippy_args }}
        run: cargo clippy --locked $CLIPPY_ARGS -- -D warnings

      - name: Release profile build
        if: matrix.skip != 'true'
        env:
          BUILD_ARGS: ${{ matrix.build_args }}
          RUSTFLAGS: -D warnings ${{ matrix.os == 'ubuntu-latest' && '-C link-arg=-fuse-ld=lld' || '' }}
        run: cargo build --release --locked $BUILD_ARGS

      - name: Test
        if: runner.os == 'Linux' && matrix.skip != 'true'
        env:
          TEST_ARGS: ${{ matrix.test_args }}
          DOCTEST: ${{ matrix.doctest }}
        run: |
          cgroup_mount=/sys/fs/cgroup
          [[ $(stat -fc '%T' "$cgroup_mount") == cgroup2fs ]] || {
            echo '::error::qol-process tests require unified cgroup v2'
            exit 1
          }
          cgroup_path=$(awk -F: '$1 == "0" { print $3; exit }' /proc/self/cgroup)
          [[ -n "$cgroup_path" ]] || {
            echo '::error::current cgroup v2 path is unavailable'
            exit 1
          }
          cgroup_origin="$cgroup_mount$cgroup_path"
          cgroup_root="$cgroup_origin/qol-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-$$"
          journal_root="$RUNNER_TEMP/qol-process-cgroups-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-$$"
          mkdir -m 700 "$journal_root"
          cleanup_cgroup() {
            status=$?
            trap - EXIT
            set +e
            printf '%s\n' "$$" | sudo tee "$cgroup_origin/cgroup.procs" >/dev/null
            restored=$?
            killed=0
            removed=0
            journal_removed=0
            if ((restored == 0)); then
              printf '1\n' | sudo tee "$cgroup_root/cgroup.kill" >/dev/null
              killed=$?
              if ((killed == 0)); then
                for _ in {1..100}; do
                  grep -q '^populated 0$' "$cgroup_root/cgroup.events" && break
                  sleep 0.05
                done
              fi
              while IFS= read -r cgroup; do
                sudo rmdir "$cgroup" || removed=1
              done < <(sudo find "$cgroup_root" -depth -type d -print)
              sudo test ! -d "$cgroup_root" || removed=1
              rm -f "$journal_root/registry.guard" || journal_removed=1
              rmdir "$journal_root" || journal_removed=1
            fi
            if ((status == 0 && (restored != 0 || killed != 0 || removed != 0 || journal_removed != 0))); then
              status=1
            fi
            exit "$status"
          }
          trap cleanup_cgroup EXIT
          sudo mkdir "$cgroup_root"
          sudo chown "$(id -u):$(id -g)" \
            "$cgroup_root" \
            "$cgroup_root/cgroup.procs" \
            "$cgroup_root/cgroup.subtree_control" \
            "$cgroup_root/cgroup.threads"
          printf '%s\n' "$$" | sudo tee "$cgroup_root/cgroup.procs" >/dev/null
          export QOL_PROCESS_CGROUP_ROOT="$cgroup_root"
          export QOL_PROCESS_CGROUP_JOURNAL_ROOT="$journal_root"
          cargo nextest run --locked $TEST_ARGS --no-fail-fast --retries 0 --no-tests=pass --ignore-default-filter
          if [ "$DOCTEST" = "true" ]; then
            cargo test --locked $TEST_ARGS --doc
          fi

      - name: Test
        if: runner.os == 'macOS' && matrix.skip != 'true'
        env:
          TEST_ARGS: ${{ matrix.test_args }}
          DOCTEST: ${{ matrix.doctest }}
        run: |
          cargo nextest run --locked $TEST_ARGS --no-fail-fast --retries 0 --no-tests=pass --ignore-default-filter
          if [ "$DOCTEST" = "true" ]; then
            cargo test --locked $TEST_ARGS --doc
          fi

  process-windows:
    name: sandbox lifecycle (windows)
    needs: plan
    if: >-
      ${{ fromJSON(needs.plan.outputs.windows_process || 'false') ||
      fromJSON(needs.plan.outputs.windows_dev_build || 'false') ||
      fromJSON(needs.plan.outputs.windows_qol || 'false') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: ci-windows-sandbox

      - name: Check production CLI
        if: ${{ fromJSON(needs.plan.outputs.windows_qol) }}
        run: cargo check --locked -p qol --bin qol --all-targets

      - name: Test development build crate
        if: ${{ fromJSON(needs.plan.outputs.windows_dev_build) }}
        run: cargo test --locked -p qol-dev-build --all-targets

      - name: Test process containment
        if: ${{ fromJSON(needs.plan.outputs.windows_process) }}
        run: cargo test --locked -p qol-process --all-targets
