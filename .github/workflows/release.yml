name: Release Plugin
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Plugin release tag, for example plugin-alt-tab-v0.14.0
        required: true
        type: string
  push:
    tags:
      - '*-v*.*.*'
      - '!qol-tray-v*.*.*'

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  setup:
    name: Resolve crate and platform matrix
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.resolve.outputs.package }}
      bin_name: ${{ steps.resolve.outputs.bin_name }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Resolve tag to crate
        id: resolve
        shell: bash
        run: |
          tag="${RELEASE_TAG}"
          if [[ ! "$tag" =~ ^([a-z0-9][a-z0-9-]*)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::tag '$tag' must match <plugin-id>-vX.Y.Z"
            exit 1
          fi
          plugin_id="${BASH_REMATCH[1]}"
          tag_version="${BASH_REMATCH[2]}"
          crate_dir="plugins/${plugin_id}"
          if [[ ! -f "$crate_dir/plugin.toml" ]]; then
            echo "::error::no plugin.toml at $crate_dir"
            exit 1
          fi
          manifest_id="$(python3 -c 'import sys,tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["plugin"]["id"])' "$crate_dir/plugin.toml")"
          if [[ "$manifest_id" != "${plugin_id}" ]]; then
            echo "::error::tag $tag expects manifest id ${plugin_id}, got $manifest_id"
            exit 1
          fi
          cargo_version="$(python3 -c 'import sys,tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["package"]["version"])' "$crate_dir/Cargo.toml")"
          plugin_version="$(python3 -c 'import sys,tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["plugin"]["version"])' "$crate_dir/plugin.toml")"
          if [[ "$cargo_version" != "$tag_version" || "$plugin_version" != "$tag_version" ]]; then
            echo "::error::tag $tag expects version $tag_version, got cargo=$cargo_version plugin=$plugin_version"
            exit 1
          fi
          python3 .github/scripts/plugin_matrix.py "$crate_dir" "$plugin_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxi-dev libxtst-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxdo-dev libvulkan-dev \
            libwayland-dev libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Build
        env:
          PACKAGE: ${{ needs.setup.outputs.package }}
          TARGET: ${{ matrix.target }}
        run: cargo build --release -p "$PACKAGE" --target "$TARGET"

      - name: Stage artifact
        env:
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ needs.setup.outputs.bin_name }}
          EXT: ${{ matrix.ext }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          cp "target/$TARGET/release/$BIN_NAME$EXT" "$ARTIFACT_NAME$EXT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}*
          retention-days: 90
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release_files
          find artifacts -type f -exec cp {} release_files/ \;

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${RELEASE_TAG}"
          {
            echo "### Plugin release"
            echo
            echo "- Tag: \`${tag}\`"
            echo "- Ref: \`${RELEASE_REF}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release_files/* --clobber
          else
            gh release create "$tag" --title "$tag" --generate-notes --latest=false release_files/*
          fi
