name: Release Plugin

on:
  push:
    tags:
      - 'plugin-*-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  setup:
    name: Resolve crate and platform matrix
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.resolve.outputs.package }}
      bin_name: ${{ steps.resolve.outputs.bin_name }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag to crate
        id: resolve
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^plugin-(.+)-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$tag' must match plugin-<id>-vX.Y.Z"
            exit 1
          fi
          plugin_id="${BASH_REMATCH[1]}"
          crate_dir="plugins/plugin-${plugin_id}"
          if [[ ! -f "$crate_dir/plugin.toml" ]]; then
            echo "::error::no plugin.toml at $crate_dir"
            exit 1
          fi
          python3 .github/scripts/plugin_matrix.py "$crate_dir" "$plugin_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxi-dev libxtst-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxdo-dev libvulkan-dev \
            libwayland-dev libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Build
        env:
          PACKAGE: ${{ needs.setup.outputs.package }}
          TARGET: ${{ matrix.target }}
        run: cargo build --release -p "$PACKAGE" --target "$TARGET"

      - name: Stage artifact
        env:
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ needs.setup.outputs.bin_name }}
          EXT: ${{ matrix.ext }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          cp "target/$TARGET/release/$BIN_NAME$EXT" "$ARTIFACT_NAME$EXT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}*
          retention-days: 90
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release_files
          find artifacts -type f -exec cp {} release_files/ \;

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release_files/* --clobber
          else
            gh release create "$tag" --title "$tag" --generate-notes release_files/*
          fi
