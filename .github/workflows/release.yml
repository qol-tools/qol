name: Release Plugin
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Plugin release tag, for example qol-alt-tab-v0.14.0
        required: true
        type: string
  push:
    tags:
      - '*-v*.*.*'
      - '!qol-tray-v*.*.*'

permissions:
  contents: read
  statuses: read
  actions: read

concurrency:
  group: plugin-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  setup:
    name: Verify exact release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_run: ${{ steps.verify.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Checkout release scripts from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted
          sparse-checkout: |
            .github/scripts
            libs/conventions/src
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify exact release candidate
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python trusted/.github/scripts/release_candidate.py verify \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "$(git rev-parse HEAD)" \
            --tag "${RELEASE_TAG}" \
            --report "${RUNNER_TEMP}/release-verification-report.json"

  attest:
    name: Attest release files
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Checkout release scripts from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted
          sparse-checkout: |
            .github/scripts
            libs/conventions/src
          persist-credentials: false

      - name: Download candidate files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.setup.outputs.candidate_run }}
          github-token: ${{ github.token }}
          pattern: dist-${{ env.RELEASE_TAG }}-*
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release_files
          find artifacts -type f -exec cp {} release_files/ \;

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Require every target
        run: |
          python trusted/.github/scripts/release_candidate.py require-release-files \
            --tag "${RELEASE_TAG}" \
            --files release_files \
            --report "${RUNNER_TEMP}/release-files-report.json"

      - name: Attest release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release_files/*

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release_files/*
          retention-days: 90
          if-no-files-found: error

  # Rerunnable: a tag that already holds this release is accepted, different
  # content is refused.
  registry:
    name: Publish registry artifact
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=lld
    steps:
      - name: Checkout the registry tool from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release_files

      - uses: ./trusted/.github/actions/rust-setup
        with:
          cache-key: plugin-registry
          system-dependencies: "false"
          workspace: trusted

      # Built in its own step, which holds no token.
      - name: Build registry tool
        working-directory: trusted
        run: cargo build --locked -p qol-plugin-registry

      - name: Push registry artifact
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          trusted/target/debug/qol-plugin-registry push \
            --registry "ghcr.io/${GITHUB_REPOSITORY_OWNER}/plugins" \
            --source "https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" --files release_files | tee -a "${GITHUB_STEP_SUMMARY}"

  index:
    name: Refresh plugin index
    needs: registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the index build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run plugin-index.yml --ref main
