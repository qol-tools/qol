name: Release Plugin
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Plugin release tag, for example qol-alt-tab-v0.14.0
        required: true
        type: string
  push:
    tags:
      - '*-v*.*.*'
      - '!qol-tray-v*.*.*'

permissions:
  contents: read
  statuses: read

concurrency:
  group: plugin-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  setup:
    name: Resolve crate and platform matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package: ${{ steps.resolve.outputs.package }}
      bin_name: ${{ steps.resolve.outputs.bin_name }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify exact release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/release_candidate.py verify \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "$(git rev-parse HEAD)" \
            --tag "${RELEASE_TAG}" \
            --report "${RUNNER_TEMP}/release-verification-report.json"

      - name: Resolve tag to crate
        id: resolve
        shell: bash
        run: |
          tag="${RELEASE_TAG}"
          if [[ ! "$tag" =~ ^([a-z0-9][a-z0-9-]*)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::tag '$tag' must match <plugin-id>-vX.Y.Z"
            exit 1
          fi
          plugin_id="${BASH_REMATCH[1]}"
          tag_version="${BASH_REMATCH[2]}"
          python3 .github/scripts/plugin_matrix.py . "$plugin_id" "$tag_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 75 || 45 }}
    # RUSTFLAGS env overrides the repo's [target.*] rustflags, so the lld
    # link-arg must be restated here (ubuntu-only: -fuse-ld=lld is invalid on macOS).
    # Warning parity with CI and the candidate jobs that gated this release.
    env:
      RUSTFLAGS: -D warnings ${{ matrix.os == 'ubuntu-latest' && '-C link-arg=-fuse-ld=lld' || matrix.os == 'windows-latest' && '-C link-arg=/Brepro -C target-feature=+crt-static' || '' }}
    # /Brepro drops the link timestamp from Windows binaries, so the release
    # probe sees an unchanged plugin as unchanged. The steps are bash, and a
    # Windows runner defaults to PowerShell.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: plugin-release-${{ matrix.target }}
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Export production artifact identity
        run: cargo run --quiet -p qol-build-identity --bin qol-build-identity -- emit production >> "${GITHUB_ENV}"

      - name: Build
        env:
          PACKAGE: ${{ needs.setup.outputs.package }}
          TARGET: ${{ matrix.target }}
        run: |
          python .github/scripts/release_candidate.py build \
            --kind plugin \
            --package "${PACKAGE}" \
            --target "${TARGET}" \
            --report "${RUNNER_TEMP}/release-build-report.json"

      - name: Stage artifact
        env:
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ needs.setup.outputs.bin_name }}
          EXT: ${{ matrix.ext }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          PACKAGE: ${{ needs.setup.outputs.package }}
        run: |
          cp "target/$TARGET/release/$BIN_NAME$EXT" "$ARTIFACT_NAME$EXT"
          if cargo tree -p "$PACKAGE" --target "$TARGET" -e normal --prefix none | grep -q '^qol-gpui v'; then
            cp libs/gpui/assets/fonts/OFL.txt IBM-Plex-OFL.txt
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}*
            IBM-Plex-OFL.txt
          retention-days: 90
          if-no-files-found: error

  # Rerunnable: a tag that already holds this release is accepted, different
  # content is refused.
  registry:
    name: Publish registry artifact
    needs: [setup, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release_files
          find artifacts -type f -exec cp {} release_files/ \;

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: plugin-registry
          system-dependencies: "false"

      # Built in its own step, which holds no token.
      - name: Build registry tool
        run: cargo build --locked -p qol-plugin-registry

      - name: Push registry artifact
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          target/debug/qol-plugin-registry push \
            --registry "ghcr.io/${GITHUB_REPOSITORY_OWNER}/plugins" \
            --source "https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" --files release_files | tee -a "${GITHUB_STEP_SUMMARY}"

  index:
    name: Refresh plugin index
    needs: registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the index build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run plugin-index.yml --ref main
