name: QoL Tray Release
run-name: Release QoL Tray ${{ inputs.tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: QoL Tray release tag, for example qol-tray-v3.17.0
        required: true
        type: string
  push:
    tags:
      - 'qol-tray-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  statuses: read

concurrency:
  group: qol-tray-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  gate:
    name: Verify exact release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_run: ${{ steps.verify.outputs.run_id }}
      published: ${{ steps.existing.outputs.published }}
    steps:
      # Tray releases are immutable, so a second run for a tag that is already
      # published, such as a rerun of Versioning's tag_and_dispatch, has
      # nothing to do and would only fail against it.
      - name: Check for a published release
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>"${RUNNER_TEMP}/release-view.log")"; then
            if [[ "${draft}" == "false" ]]; then
              echo "::notice::${RELEASE_TAG} is already published, so there is nothing to release"
              echo "published=true" >> "${GITHUB_OUTPUT}"
            fi
          elif ! grep -qFx 'release not found' "${RUNNER_TEMP}/release-view.log"; then
            cat "${RUNNER_TEMP}/release-view.log" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.existing.outputs.published != 'true'
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.existing.outputs.published != 'true'
        with:
          python-version: "3.12"

      - name: Verify exact release candidate
        id: verify
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/release_candidate.py verify \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "$(git rev-parse HEAD)" \
            --tag "${RELEASE_TAG}" \
            --report "${RUNNER_TEMP}/release-verification-report.json"

  release:
    name: Create GitHub Release
    needs: gate
    if: needs.gate.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download candidate files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.gate.outputs.candidate_run }}
          github-token: ${{ github.token }}
          pattern: dist-${{ env.RELEASE_TAG }}-*
          path: artifacts

      - name: Require every platform
        shell: bash
        run: |
          for platform in linux macos windows; do
            [[ -d "artifacts/dist-${RELEASE_TAG}-${platform}" ]] || {
              echo "::error::candidate run has no ${platform} files for ${RELEASE_TAG}"
              exit 1
            }
          done

      - name: Find previous tray release
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tags="$(gh release list --exclude-drafts --limit 200 --json tagName --jq '.[].tagName')"
          previous="$( { grep '^qol-tray-v' <<<"${tags}" || true; echo "${RELEASE_TAG}"; } \
            | sort -uV | grep -B1 -Fx "${RELEASE_TAG}" | grep -vFx "${RELEASE_TAG}" || true)"
          echo "tag=${previous}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Write user-facing release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          args=(-f tag_name="${RELEASE_TAG}")
          filter=(--root source)
          if [[ -n "${PREVIOUS_TAG}" ]]; then
            args+=(-f previous_tag_name="${PREVIOUS_TAG}")
            filter+=(--unit qol-tray --range "${PREVIOUS_TAG}..${RELEASE_TAG}")
          fi
          gh api "repos/${GH_REPO}/releases/generate-notes" "${args[@]}" --jq .body \
            | python3 source/.github/scripts/release_notes.py "${filter[@]}" > "${RUNNER_TEMP}/release-notes.md"

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: QoL Tray ${{ env.RELEASE_TAG }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: artifacts/**/*
          fail_on_unmatched_files: true
          draft: true
          prerelease: false
          make_latest: true

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${RELEASE_TAG}" --draft=false --latest=true
