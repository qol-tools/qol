name: QoL Tray Release
run-name: Release QoL Tray ${{ inputs.tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: QoL Tray release tag, for example qol-tray-v3.17.0
        required: true
        type: string
  push:
    tags:
      - 'qol-tray-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  statuses: read

concurrency:
  group: qol-tray-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  gate:
    name: Verify exact release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_run: ${{ steps.verify.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify exact release candidate
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/release_candidate.py verify \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "$(git rev-parse HEAD)" \
            --tag "${RELEASE_TAG}" \
            --report "${RUNNER_TEMP}/release-verification-report.json"

  release:
    name: Create GitHub Release
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download candidate files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.gate.outputs.candidate_run }}
          github-token: ${{ github.token }}
          pattern: dist-${{ env.RELEASE_TAG }}-*
          path: artifacts

      - name: Require every platform
        shell: bash
        run: |
          for platform in linux macos windows; do
            [[ -d "artifacts/dist-${RELEASE_TAG}-${platform}" ]] || {
              echo "::error::candidate run has no ${platform} files for ${RELEASE_TAG}"
              exit 1
            }
          done

      - name: Find previous tray release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          previous="$( { gh release list --exclude-drafts --limit 200 --json tagName --jq '.[].tagName' | grep '^qol-tray-v'; echo "${RELEASE_TAG}"; } \
            | sort -uV | grep -B1 -Fx "${RELEASE_TAG}" | grep -vFx "${RELEASE_TAG}" || true)"
          echo "tag=${previous}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          path: source

      - name: Write user-facing release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          args=(-f tag_name="${RELEASE_TAG}")
          [[ -n "${PREVIOUS_TAG}" ]] && args+=(-f previous_tag_name="${PREVIOUS_TAG}")
          gh api "repos/${GH_REPO}/releases/generate-notes" "${args[@]}" --jq .body \
            | python3 source/.github/scripts/release_notes.py > "${RUNNER_TEMP}/release-notes.md"

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: QoL Tray ${{ env.RELEASE_TAG }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: artifacts/**/*
          fail_on_unmatched_files: true
          draft: true
          prerelease: false
          make_latest: true

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${RELEASE_TAG}" --draft=false --latest=true
