name: QoL Tray Release
run-name: Release QoL Tray ${{ inputs.tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: QoL Tray release tag, for example qol-tray-v3.17.0
        required: true
        type: string
  push:
    tags:
      - 'qol-tray-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: qol-tray-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build_linux_deb:
    name: Build Linux .deb
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: qol-tray-linux

      - name: Export production artifact identity
        shell: bash
        run: cargo run --quiet -p qol-build-identity --bin qol-build-identity -- emit production >> "${GITHUB_ENV}"

      - name: Install cargo-deb
        uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # v2
        with:
          tool: cargo-deb

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxi-dev libxtst-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxdo-dev libvulkan-dev \
            libwayland-dev libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Build Debian package
        run: cargo deb -p qol-tray

      - name: Verify production source identity
        run: cargo run --quiet -p qol-build-identity --bin qol-build-identity -- verify production

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          ARCH=$(uname -m)
          BUNDLE="qol-tray-linux-${ARCH}"
          mkdir -p "${BUNDLE}"
          cp target/release/qol-tray "${BUNDLE}/"
          tar czf "${BUNDLE}.tar.gz" "${BUNDLE}"
          cp "${BUNDLE}.tar.gz" dist/
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-dist
          path: dist/*
          if-no-files-found: error

  build_macos:
    name: Build macOS release
    runs-on: macos-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: qol-tray-macos

      - name: Export production artifact identity
        shell: bash
        run: cargo run --quiet -p qol-build-identity --bin qol-build-identity -- emit production >> "${GITHUB_ENV}"

      - name: Build macOS binaries
        run: |
          cargo build --release --target aarch64-apple-darwin --bin qol-tray
          cargo build --release --target x86_64-apple-darwin --bin qol-tray

      - name: Verify production source identity
        run: cargo run --quiet -p qol-build-identity --bin qol-build-identity -- verify production

      - name: Assemble universal app bundle
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#qol-tray-v}"
          APP_DIR="${RUNNER_TEMP}/QoL Tray.app"
          CONTENTS_DIR="${APP_DIR}/Contents"
          MACOS_DIR="${CONTENTS_DIR}/MacOS"
          RESOURCES_DIR="${CONTENTS_DIR}/Resources"

          rm -rf "${APP_DIR}"
          mkdir -p "${MACOS_DIR}" "${RESOURCES_DIR}"

          lipo -create \
            target/aarch64-apple-darwin/release/qol-tray \
            target/x86_64-apple-darwin/release/qol-tray \
            -output "${MACOS_DIR}/qol-tray"

          chmod +x "${MACOS_DIR}/qol-tray"
          cp apps/qol-tray/assets/qol-tray.icns "${RESOURCES_DIR}/qol-tray.icns"

          cat > "${CONTENTS_DIR}/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>CFBundleIdentifier</key>
          <string>com.qol-tools.qol-tray</string>
          <key>CFBundleName</key>
          <string>QoL Tray</string>
          <key>CFBundleExecutable</key>
          <string>qol-tray</string>
          <key>CFBundleIconFile</key>
          <string>qol-tray</string>
          <key>CFBundleVersion</key>
          <string>${VERSION}</string>
          <key>CFBundleShortVersionString</key>
          <string>${VERSION}</string>
          <key>LSUIElement</key>
          <true/>
          <key>LSMinimumSystemVersion</key>
          <string>11.0</string>
          </dict>
          </plist>
          EOF

      - name: Ad-hoc codesign bundle
        shell: bash
        run: |
          APP_DIR="${RUNNER_TEMP}/QoL Tray.app"
          codesign --force --deep --sign - "${APP_DIR}"
          codesign --verify --deep --strict "${APP_DIR}"

      - name: Build updater archive
        shell: bash
        run: |
          APP_DIR="${RUNNER_TEMP}/QoL Tray.app"
          DIST_DIR="${RUNNER_TEMP}/dist"

          rm -rf "${DIST_DIR}"
          mkdir -p "${DIST_DIR}"

          tar -C "${RUNNER_TEMP}" -czf "${DIST_DIR}/qol-tray-macos-universal.tar.gz" "QoL Tray.app"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-dist
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build_linux_deb, build_macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: QoL Tray ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: artifacts/**/*
          fail_on_unmatched_files: true
          allow_updates: false
          draft: true
          prerelease: false

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${RELEASE_TAG}" --draft=false
