name: auto-merge ready

on:
  pull_request:
    types: [opened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  arm:
    name: Arm auto-merge
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      checks: write
    steps:
      # The claude review check of this head judged it against the old base,
      # and a check that already passed would let the queue take it. A pending
      # check of the same name holds it, and the reopen starts a review against
      # the new base whose verdict replaces that check.
      - name: Review again against the new base
        if: github.event.action == 'edited'
        env:
          GH_TOKEN: ${{ github.token }}
          REOPEN_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh api "repos/${REPO}/check-runs" -f name="claude review" -f head_sha="${HEAD_SHA}" -f status=in_progress \
            -f "output[title]=Reviewing again against ${BASE}" \
            -f "output[summary]=The base branch changed, so the review of this commit no longer counts. A review against ${BASE} replaces this check." > /dev/null
          if [ -z "$REOPEN_TOKEN" ]; then
            echo "::warning::AUTO_MERGE_TOKEN is not set, so no new review starts. Push a commit, or close and reopen the pull request, to review it against ${BASE}."
            exit 0
          fi
          GH_TOKEN="$REOPEN_TOKEN" gh pr close "$PR_URL"
          GH_TOKEN="$REOPEN_TOKEN" gh pr reopen "$PR_URL"

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::AUTO_MERGE_TOKEN is not set. Auto-merge armed by the workflow token never enters the merge queue, so this pull request was left for its session to arm."
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
