name: auto-merge ready

on:
  pull_request:
    types: [opened, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  arm:
    name: Arm auto-merge
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      checks: write
    steps:
      # The claude review check of this head judged it against the old base, and
      # one that passed would let the queue take it. A failed check of the same
      # name holds it, and only a reopen or a push reviews it against the new
      # base: a rerun reviews the old merge commit again. The failed job tells
      # the session watching the pull request, and the reopen run replaces it.
      - name: Hold the review of the old base
        if: github.event.action == 'edited'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OLD_BASE: ${{ github.event.changes.base.ref.from }}
          BASE: ${{ github.event.pull_request.base.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="${HEAD_SHA:0:7} was reviewed against ${OLD_BASE}, and the base is now ${BASE}. Close and reopen the pull request, or push a commit, to review it against ${BASE}."
          gh api "repos/${REPO}/check-runs" -f name="claude review" -f head_sha="${HEAD_SHA}" \
            -f status=completed -f conclusion=failure -f details_url="${RUN_URL}" \
            -f "output[title]=Review against ${BASE}" -f "output[summary]=${reason}" > /dev/null
          echo "::error::${reason}"
          exit 1

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::AUTO_MERGE_TOKEN is not set. Auto-merge armed by the workflow token never enters the merge queue, so this pull request was left for its session to arm."
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
