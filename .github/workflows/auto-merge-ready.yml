name: auto-merge ready

on:
  pull_request:
    types: [opened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  arm:
    name: Arm auto-merge
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::AUTO_MERGE_TOKEN is not set. Auto-merge armed by the workflow token never enters the merge queue, so this pull request was left for its session to arm."
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
