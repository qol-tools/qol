name: Versioning
run-name: ${{ inputs.plugin_id && format('Version plugin {0}', inputs.plugin_id) || 'Version changed release units' }}

on:
  workflow_dispatch:
    inputs:
      plugin_id:
        description: Optional plugin id, for example qol-alt-tab
        required: false
        type: string
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: >-
    ${{
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'))
      && 'plugin-version-main'
      || format('plugin-version-idle-{0}', github.run_id)
    }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare exact release candidate
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.conclusion == 'success')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      checks: read
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SOURCE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      superseded: ${{ steps.candidate.outputs.superseded }}
      tags: ${{ steps.version.outputs.tags }}
      plugin_matrix: ${{ steps.plan.outputs.plugin_matrix }}
      has_plugins: ${{ steps.plan.outputs.has_plugins }}
      has_qol_tray: ${{ steps.plan.outputs.has_qol_tray }}
      qol_tray_tag: ${{ steps.plan.outputs.qol_tray_tag }}
    steps:
      - name: Checkout successful source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          ssh-key: ${{ secrets.VERSIONING_DEPLOY_KEY }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch tags
        run: git fetch --tags --force origin

      - name: Verify successful source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ -n "${SOURCE_CI_RUN_ID}" ]]; then
            args+=(--run-id "${SOURCE_CI_RUN_ID}")
          fi
          python .github/scripts/release_candidate.py verify-source-ci \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${SOURCE_SHA}" \
            --root . \
            --report "${RUNNER_TEMP}/source-ci-report.json" \
            "${args[@]}"

      - name: Compute release versions
        id: version
        shell: bash
        env:
          PLUGIN_ID: ${{ inputs.plugin_id }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${PLUGIN_ID}" ]]; then
            args+=(--plugin-id "${PLUGIN_ID}")
          fi
          python .github/scripts/plugin_version.py \
            --apply \
            --tag-file "${RUNNER_TEMP}/release-tags.txt" \
            "${args[@]}"

      - name: Summarize release plan
        shell: bash
        env:
          SHOULD_RELEASE: ${{ steps.version.outputs.should_release }}
          RELEASE_SUMMARY: ${{ steps.version.outputs.summary }}
          RELEASE_TAGS: ${{ steps.version.outputs.tags }}
        run: |
          {
            echo "### Release plan"
            echo
            if [[ "${SHOULD_RELEASE}" == "true" ]]; then
              echo "${RELEASE_SUMMARY}" | tr ',' '\n' | sed 's/^/- /'
              echo
              echo "**Tags:** \`${RELEASE_TAGS}\`"
              exit 0
            fi
            echo "No releases required."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Commit version candidate
        id: candidate
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock plugins/*/Cargo.toml plugins/*/plugin.toml apps/tray/Cargo.toml
          if ! git diff --cached --quiet; then
            git commit -m "chore(plugins): bump plugin versions"
            if ! git push origin "HEAD:main"; then
              git fetch origin main
              if [[ "$(git rev-parse FETCH_HEAD)" != "${SOURCE_SHA}" ]]; then
                # A newer push advanced main while this run was versioning the
                # old head. That push's own CI -> Versioning chain covers the
                # same history, so end green and let it take over.
                echo "superseded=true" >> "${GITHUB_OUTPUT}"
                echo "::notice::main moved past ${SOURCE_SHA}; the newer push's versioning run takes over"
                exit 0
              fi
              exit 1
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Plan candidate builds
        id: plan
        if: >-
          ${{ steps.version.outputs.should_release == 'true' &&
          steps.candidate.outputs.superseded != 'true' }}
        env:
          RELEASE_TAGS: ${{ steps.version.outputs.tags }}
        run: |
          python .github/scripts/release_candidate.py plan \
            --tags "${RELEASE_TAGS}" \
            --report "${RUNNER_TEMP}/release-candidate-report.json"

      - name: Upload candidate plan
        if: >-
          ${{ steps.version.outputs.should_release == 'true' &&
          steps.candidate.outputs.superseded != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-plan-${{ steps.candidate.outputs.sha }}
          path: |
            ${{ runner.temp }}/source-ci-report.json
            ${{ runner.temp }}/release-candidate-report.json
          if-no-files-found: error

  plugin_candidate:
    name: Candidate ${{ matrix.tag }} (${{ matrix.target }})
    needs: prepare
    if: needs.prepare.outputs.has_plugins == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 75 || 45 }}
    permissions:
      contents: read
    # RUSTFLAGS env overrides the repo's [target.*] rustflags, so the lld
    # link-arg must be restated here (ubuntu-only: -fuse-ld=lld is invalid on macOS).
    # Warning parity with CI; a new lint failure blocks pre-tag.
    env:
      RUSTFLAGS: -D warnings ${{ matrix.os == 'ubuntu-latest' && '-C link-arg=-fuse-ld=lld' || matrix.os == 'windows-latest' && '-C link-arg=/Brepro -C target-feature=+crt-static' || '' }}
    # /Brepro drops the link timestamp from Windows binaries, so a rebuild of
    # the same commit gives the same bytes. The steps are bash, and a Windows
    # runner defaults to PowerShell.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.plugin_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: plugin-release-${{ matrix.target }}
          targets: ${{ matrix.target }}

      - name: Export production artifact identity
        run: cargo run --quiet -p qol-build-identity --bin qol-build-identity -- emit production >> "${GITHUB_ENV}"

      - name: Build exact plugin candidate
        run: >
          python .github/scripts/release_candidate.py build
          --kind plugin
          --package "${{ matrix.package }}"
          --target "${{ matrix.target }}"
          --report "${{ runner.temp }}/release-build-report.json"

      - name: Stage release files
        env:
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ matrix.bin_name }}
          EXT: ${{ matrix.ext }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          PACKAGE: ${{ matrix.package }}
        run: |
          cp "target/$TARGET/release/$BIN_NAME$EXT" "$ARTIFACT_NAME$EXT"
          if cargo tree -p "$PACKAGE" --target "$TARGET" -e normal --prefix none | grep -q '^qol-gpui v'; then
            cp libs/gpui/assets/fonts/OFL.txt IBM-Plex-OFL.txt
          fi

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.tag }}-${{ matrix.target }}
          path: |
            ${{ matrix.artifact_name }}*
            IBM-Plex-OFL.txt
          retention-days: 90
          if-no-files-found: error

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.tag }}-${{ matrix.target }}
          path: ${{ runner.temp }}/release-build-report.json
          if-no-files-found: error

  qol_tray_linux_candidate:
    name: Candidate qol-tray (linux)
    needs: prepare
    if: needs.prepare.outputs.has_qol_tray == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: qol-tray-linux

      - name: Export production artifact identity
        run: cargo run --quiet -p qol-build-identity --bin qol-build-identity -- emit production >> "${GITHUB_ENV}"

      - name: Install cargo-deb
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-deb

      - name: Build exact qol-tray candidate
        run: >
          python .github/scripts/release_candidate.py build
          --kind qol-tray-linux
          --report "${RUNNER_TEMP}/release-build-report.json"

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          ARCH=$(uname -m)
          BUNDLE="qol-tray-linux-${ARCH}"
          mkdir -p "${BUNDLE}"
          cp target/release/qol-tray "${BUNDLE}/"
          cp libs/gpui/assets/fonts/OFL.txt "${BUNDLE}/IBM-Plex-OFL.txt"
          tar czf "${BUNDLE}.tar.gz" "${BUNDLE}"
          cp "${BUNDLE}.tar.gz" dist/
          ls -lh dist/

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ needs.prepare.outputs.qol_tray_tag }}-linux
          path: dist/*
          retention-days: 90
          if-no-files-found: error

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ needs.prepare.outputs.qol_tray_tag }}-linux
          path: ${{ runner.temp }}/release-build-report.json
          if-no-files-found: error

  qol_tray_macos_candidate:
    name: Candidate qol-tray (macos)
    needs: prepare
    if: needs.prepare.outputs.has_qol_tray == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings
      RELEASE_TAG: ${{ needs.prepare.outputs.qol_tray_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: qol-tray-macos
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Export production artifact identity
        run: cargo run --quiet -p qol-build-identity --bin qol-build-identity -- emit production >> "${GITHUB_ENV}"

      - name: Build exact qol-tray candidate
        run: >
          python .github/scripts/release_candidate.py build
          --kind qol-tray-macos
          --report "${RUNNER_TEMP}/release-build-report.json"

      - name: Assemble universal app bundle
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#qol-tray-v}"
          APP_DIR="${RUNNER_TEMP}/QoL Tray.app"
          CONTENTS_DIR="${APP_DIR}/Contents"
          MACOS_DIR="${CONTENTS_DIR}/MacOS"
          RESOURCES_DIR="${CONTENTS_DIR}/Resources"

          rm -rf "${APP_DIR}"
          mkdir -p "${MACOS_DIR}" "${RESOURCES_DIR}"

          lipo -create \
            target/aarch64-apple-darwin/release/qol-tray \
            target/x86_64-apple-darwin/release/qol-tray \
            -output "${MACOS_DIR}/qol-tray"

          chmod +x "${MACOS_DIR}/qol-tray"
          cp apps/tray/assets/qol-tray.icns "${RESOURCES_DIR}/qol-tray.icns"
          cp libs/gpui/assets/fonts/OFL.txt "${RESOURCES_DIR}/IBM-Plex-OFL.txt"

          cat > "${CONTENTS_DIR}/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>CFBundleIdentifier</key>
          <string>com.qol-tools.qol-tray</string>
          <key>CFBundleName</key>
          <string>QoL Tray</string>
          <key>CFBundleExecutable</key>
          <string>qol-tray</string>
          <key>CFBundleIconFile</key>
          <string>qol-tray</string>
          <key>CFBundleVersion</key>
          <string>${VERSION}</string>
          <key>CFBundleShortVersionString</key>
          <string>${VERSION}</string>
          <key>LSUIElement</key>
          <true/>
          <key>LSMinimumSystemVersion</key>
          <string>11.0</string>
          <key>NSBluetoothAlwaysUsageDescription</key>
          <string>QoL Tray reconnects the Bluetooth devices you choose and lists nearby devices to pair.</string>
          <key>NSMicrophoneUsageDescription</key>
          <string>QoL Tray shows how loud your microphone is in the Sound settings.</string>
          </dict>
          </plist>
          EOF

      - name: Ad-hoc codesign bundle
        shell: bash
        run: |
          APP_DIR="${RUNNER_TEMP}/QoL Tray.app"
          codesign --force --deep --sign - "${APP_DIR}"
          codesign --verify --deep --strict "${APP_DIR}"

      - name: Build updater archive
        shell: bash
        run: |
          APP_DIR="${RUNNER_TEMP}/QoL Tray.app"
          DIST_DIR="${RUNNER_TEMP}/dist"

          rm -rf "${DIST_DIR}"
          mkdir -p "${DIST_DIR}"

          tar -C "${RUNNER_TEMP}" -czf "${DIST_DIR}/qol-tray-macos-universal.tar.gz" "QoL Tray.app"

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ needs.prepare.outputs.qol_tray_tag }}-macos
          path: ${{ runner.temp }}/dist/*
          retention-days: 90
          if-no-files-found: error

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ needs.prepare.outputs.qol_tray_tag }}-macos
          path: ${{ runner.temp }}/release-build-report.json
          if-no-files-found: error

  qol_tray_windows_candidate:
    name: Candidate qol-tray (windows)
    needs: prepare
    if: needs.prepare.outputs.has_qol_tray == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings -C link-arg=/Brepro -C target-feature=+crt-static
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: qol-tray-windows
          targets: x86_64-pc-windows-msvc

      - name: Export production artifact identity
        run: cargo run --quiet -p qol-build-identity --bin qol-build-identity -- emit production >> "${GITHUB_ENV}"

      - name: Build exact qol-tray candidate
        run: >
          python .github/scripts/release_candidate.py build
          --kind qol-tray-windows
          --report "${RUNNER_TEMP}/release-build-report.json"

      - name: Prepare artifacts
        run: |
          BUILT=target/x86_64-pc-windows-msvc/release
          BUNDLE=qol-tray-windows-x86_64
          mkdir -p dist "${BUNDLE}"
          cp "${BUILT}/qol-tray.exe" "dist/${BUNDLE}.exe"
          cp "${BUILT}/qol-tray.exe" "${BUILT}/qol-tray-install.exe" "${BUNDLE}/"
          cp libs/gpui/assets/fonts/OFL.txt "${BUNDLE}/IBM-Plex-OFL.txt"
          7z a -tzip "dist/${BUNDLE}.zip" "${BUNDLE}"
          ls -l dist/

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ needs.prepare.outputs.qol_tray_tag }}-windows
          path: dist/*
          retention-days: 90
          if-no-files-found: error

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ needs.prepare.outputs.qol_tray_tag }}-windows
          path: ${{ runner.temp }}/release-build-report.json
          if-no-files-found: error

  tag_and_dispatch:
    name: Attest, tag, and dispatch
    needs:
      - prepare
      - plugin_candidate
      - qol_tray_linux_candidate
      - qol_tray_macos_candidate
      - qol_tray_windows_candidate
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.prepare.outputs.should_release == 'true' &&
        needs.prepare.outputs.superseded != 'true' &&
        (needs.plugin_candidate.result == 'success' ||
         needs.plugin_candidate.result == 'skipped') &&
        (needs.qol_tray_linux_candidate.result == 'success' ||
         needs.qol_tray_linux_candidate.result == 'skipped') &&
        (needs.qol_tray_macos_candidate.result == 'success' ||
         needs.qol_tray_macos_candidate.result == 'skipped') &&
        (needs.qol_tray_windows_candidate.result == 'success' ||
         needs.qol_tray_windows_candidate.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
      statuses: write
    env:
      CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
      RELEASE_TAGS: ${{ needs.prepare.outputs.tags }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download candidate plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-plan-${{ needs.prepare.outputs.candidate_sha }}
          path: ${{ runner.temp }}/candidate-plan

      - name: Download candidate build reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-*
          path: ${{ runner.temp }}/candidate-builds

      - name: Attest exact release candidate
        run: |
          python .github/scripts/release_candidate.py attest \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${CANDIDATE_SHA}" \
            --tags "${RELEASE_TAGS}" \
            --target-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --plan "${RUNNER_TEMP}/candidate-plan/release-candidate-report.json" \
            --build-reports "${RUNNER_TEMP}/candidate-builds" \
            --report "${RUNNER_TEMP}/release-attestation-report.json"

      - name: Create immutable tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          read -r -a tags <<< "${RELEASE_TAGS}"
          new_tags=()
          for tag in "${tags[@]}"; do
            existing=$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)
            if [[ -n "${existing}" ]]; then
              [[ "${existing}" == "${CANDIDATE_SHA}" ]] || {
                echo "::error::tag ${tag} already points to ${existing}"
                exit 1
              }
              continue
            fi
            git tag "${tag}" "${CANDIDATE_SHA}"
            new_tags+=("${tag}")
          done
          ((${#new_tags[@]})) || exit 0
          git push --atomic origin "${new_tags[@]}"

      - name: Dispatch releases
        shell: bash
        run: |
          set -euo pipefail
          read -r -a tags <<< "${RELEASE_TAGS}"
          for tag in "${tags[@]}"; do
            if [[ "${tag}" == qol-tray-v* ]]; then
              gh workflow run qol-tray-release.yml --ref main -f tag="${tag}"
              continue
            fi
            gh workflow run release.yml --ref main -f tag="${tag}"
          done

      - name: Upload attestation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-attestation-${{ needs.prepare.outputs.candidate_sha }}
          path: ${{ runner.temp }}/release-attestation-report.json
          if-no-files-found: error

  # Each OS's tray build reaches the registry and the signed index as soon as
  # that build finishes, before the tags and the GitHub Release.

  qol_tray_linux_publish:
    name: Publish qol-tray (linux) to the plugin index
    needs:
      - prepare
      - qol_tray_linux_candidate
    if: >-
      ${{
        needs.prepare.outputs.should_release == 'true' &&
        needs.prepare.outputs.superseded != 'true' &&
        needs.prepare.outputs.qol_tray_tag != '' &&
        needs.qol_tray_linux_candidate.result == 'success'
      }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
      actions: write
    uses: ./.github/workflows/qol-tray-host-publish.yml
    with:
      os: linux
      tag: ${{ needs.prepare.outputs.qol_tray_tag }}
      revision: ${{ needs.prepare.outputs.candidate_sha }}
