name: qol CodeQL config

# Test code, research scripts and the one vendored crate nothing links are
# not shipped; the gpui and global-hotkey forks are patched into every binary.
paths-ignore:
  - "**/tests/**"
  - "**/tests.rs"
  - "vendor/ravif/**"
  - "vendor/gpui/examples/**"
  - "vendor/gpui/target/**"
  - "docs/**"

# These rules flag inline #[cfg(test)] modules, which a path filter cannot
# reach, plus zero-filled buffers and user ids. Every alert they raised on
# 2026-10-14 was a false positive.
query-filters:
  - exclude:
      id: rust/hard-coded-cryptographic-value
  - exclude:
      id: rust/cleartext-logging
