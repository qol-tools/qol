name: upload-next-dist
description: >-
  Uploads the next plugin's release files from the queue that
  release_candidate.py build-plugins wrote, as its dist-<tag>-<target>
  artifact. Does nothing once the queue is empty.

inputs:
  queue:
    description: Queue file written by release_candidate.py build-plugins
    required: true

runs:
  using: composite
  steps:
    - name: Take the next release files
      id: next
      shell: bash
      env:
        QUEUE: ${{ inputs.queue }}
      run: python .github/scripts/release_candidate.py next-dist --queue "${QUEUE}"

    - name: Upload release files
      if: steps.next.outputs.name != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.next.outputs.name }}
        path: ${{ steps.next.outputs.path }}
        retention-days: 90
        if-no-files-found: error
