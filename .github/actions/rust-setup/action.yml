name: rust-setup
description: >-
  Shared Rust toolchain, build cache, and Linux system dependency setup.
  Single source of truth for the setup trio; build commands and verify
  gates stay in the workflows and scripts.

inputs:
  cache-key:
    description: >-
      rust-cache shared-key; one namespace per build family and platform
      (see the qol-cicd skill's cache contract table)
    required: true
  targets:
    description: Comma-separated rustup targets to install (optional)
    required: false
    default: ""
  components:
    description: Comma-separated rustup components to install (optional)
    required: false
    default: ""
  compiler-cache:
    description: Restore a bounded compiler cache for CI library rebuilds
    required: false
    default: "false"

outputs:
  compiler-cache-key:
    description: Exact key used to restore the compiler cache
    value: ${{ steps.compiler-cache.outputs.cache-primary-key }}
  compiler-cache-hit:
    description: Whether that exact compiler cache already exists
    value: ${{ steps.compiler-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - name: Key the build cache on the Cargo profiles
      shell: bash
      run: echo "RUST_PROFILES_HASH=$(sed -n '/^\[profile/,$p' Cargo.toml | git hash-object --stdin)" >> "${GITHUB_ENV}"

    - name: Restore or save build cache
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true

    - name: Install compiler cache
      if: inputs.compiler-cache == 'true'
      uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73
      with:
        tool: sccache@0.17.0

    - name: Restore compiler cache
      id: compiler-cache
      if: inputs.compiler-cache == 'true'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ runner.temp }}/qol-compiler-cache
        key: qol-compiler-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: qol-compiler-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Enable compiler cache
      if: inputs.compiler-cache == 'true'
      shell: bash
      run: |
        echo 'RUSTC_WRAPPER=sccache' >> "${GITHUB_ENV}"
        echo "SCCACHE_DIR=${RUNNER_TEMP}/qol-compiler-cache" >> "${GITHUB_ENV}"
        echo 'SCCACHE_CACHE_SIZE=512M' >> "${GITHUB_ENV}"

    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config libx11-dev libxi-dev libxtst-dev libxcb1-dev \
          libxkbcommon-dev libxkbcommon-x11-dev libxdo-dev libvulkan-dev \
          libwayland-dev libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev
