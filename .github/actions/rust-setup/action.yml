name: rust-setup
description: >-
  Shared Rust toolchain, dependency cache, and system dependencies.
  Single source of truth for build setup; build commands and verify
  gates stay in the workflows and scripts.

inputs:
  cache-key:
    description: >-
      rust-cache shared-key; one namespace per build family and platform
      (see the qol-cicd skill's cache contract table)
    required: true
  targets:
    description: Comma-separated rustup targets to install (optional)
    required: false
    default: ""
  components:
    description: Comma-separated rustup components to install (optional)
    required: false
    default: ""
  system-dependencies:
    description: >-
      Install the Linux GUI libraries the workspace links against; "false"
      for jobs that build only a command-line tool
    required: false
    default: "true"

outputs:
  build-cache-hit:
    description: Whether the exact build cache key already exists, so this job saves no new entry
    value: ${{ steps.build-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # Runners now start with far more free disk than a workspace build needs,
    # and deleting the preinstalled SDKs took one to two minutes per job, so
    # it only runs on a runner that starts short of room.
    - name: Make room for the build
      if: runner.os == 'Linux'
      shell: bash
      run: |
        available=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
        echo "${available}G free"
        if ((available < 50)); then
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /
        fi

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - name: Key the build cache on the Cargo profiles
      shell: bash
      run: echo "RUST_PROFILES_HASH=$(sed -n '/^\[profile/,$p' Cargo.toml | git hash-object --stdin)" >> "${GITHUB_ENV}"

    - name: Restore or save build cache
      id: build-cache
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true

    - name: Install Linux system dependencies
      if: runner.os == 'Linux' && inputs.system-dependencies == 'true'
      shell: bash
      # A stalled Ubuntu mirror once hung apt-get update until the 45-minute job
      # timeout; bound each call and retry so a dead mirror fails in minutes.
      run: |
        apt_get() {
          sudo timeout "$1" apt-get -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "${@:2}"
        }
        for attempt in 1 2 3; do
          apt_get 120 update && break
          if [ "$attempt" = 3 ]; then exit 1; fi
        done
        apt_get 300 install -y --no-install-recommends \
          pkg-config libx11-dev libxi-dev libxtst-dev libxcb1-dev \
          libxkbcommon-dev libxkbcommon-x11-dev libxdo-dev libvulkan-dev \
          libwayland-dev libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev
