name: rust-setup
description: >-
  Shared Rust toolchain, dependency cache, and system dependencies.
  Single source of truth for build setup; build commands and verify
  gates stay in the workflows and scripts.

inputs:
  cache-key:
    description: >-
      rust-cache shared-key; one namespace per build family and platform
      (see the qol-cicd skill's cache contract table)
    required: true
  targets:
    description: Comma-separated rustup targets to install (optional)
    required: false
    default: ""
  components:
    description: Comma-separated rustup components to install (optional)
    required: false
    default: ""
  lookup-only:
    description: Check for an exact cache entry without downloading, saving, or preparing the build
    required: false
    default: "false"
  save-cache:
    description: Allow main-branch builds to save this cache namespace
    required: false
    default: "true"
  system-dependencies:
    description: >-
      Install the Linux GUI libraries the workspace links against; "false"
      for jobs that build only a command-line tool
    required: false
    default: "true"

  workspace:
    description: Directory holding the Cargo workspace to cache
    required: false
    default: "."

outputs:
  build-cache-hit:
    description: Whether the exact build cache key already exists
    value: ${{ steps.build-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # Runners now start with far more free disk than a workspace build needs,
    # and deleting the preinstalled SDKs took one to two minutes per job, so
    # it only runs on a runner that starts short of room.
    - name: Make room for the build
      if: runner.os == 'Linux' && inputs.lookup-only != 'true'
      shell: bash
      run: |
        available=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
        echo "${available}G free"
        if ((available < 50)); then
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /
        fi

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - name: Key the build cache on the Cargo profiles
      shell: bash
      working-directory: ${{ inputs.workspace }}
      run: echo "RUST_PROFILES_HASH=$(sed -n '/^\[profile/,$p' Cargo.toml | git hash-object --stdin)" >> "${GITHUB_ENV}"

    # Every job that saves only compiles, so a failed or cancelled one would
    # save an incomplete entry under a key no later run replaces. It saves
    # nothing instead, and the next main run saves the whole entry.
    # The pin names a release so Dependabot follows it. The toolchain above
    # floats, and a release older than Cargo's build directory layout prunes
    # most third-party artifacts before it saves: Rust 1.100 nested each
    # package's hash in a folder, and the March 2026 pin then dropped every
    # package with a hyphen in its name, so a workspace clippy recompiled 545
    # third-party crates where it had recompiled 43.
    - name: Restore or save build cache
      id: build-cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: ${{ inputs.workspace }}
        shared-key: ${{ inputs.cache-key }}-${{ env.ImageOS }}
        lookup-only: ${{ inputs.lookup-only }}
        save-if: ${{ github.ref == 'refs/heads/main' && inputs.save-cache == 'true' && inputs.lookup-only != 'true' }}

    # Every Linux job restores the newest saved set of package files and hands
    # it to apt, which checks each file against Ubuntu's signed lists before it
    # uses one, so a stale or altered file is downloaded again. The key never
    # exists: the restore key picks the newest entry under it.
    - name: Restore downloaded Linux system packages
      id: saved-packages
      if: runner.os == 'Linux' && inputs.system-dependencies == 'true' && inputs.lookup-only != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-archives
        key: apt-archives-${{ env.ImageOS }}-newest
        restore-keys: apt-archives-${{ env.ImageOS }}-

    - name: Install Linux system dependencies
      id: packages
      if: runner.os == 'Linux' && inputs.system-dependencies == 'true' && inputs.lookup-only != 'true'
      shell: bash
      env:
        RESTORED_KEY: ${{ steps.saved-packages.outputs.cache-matched-key }}
      # A stalled Ubuntu mirror once hung apt-get update until the 45-minute job
      # timeout; bound each call and retry so a dead mirror fails in minutes.
      # A slow mirror is not a dead one, and no timeout of apt's own ends it. On
      # 2026-11-18 GitHub ran 21 of 41 Linux jobs on AWS runners, whose list
      # names us-east-2.ec2.archive.ubuntu.com. It served these 26 MB at under
      # 150 kB/s, so the install ran out its five minutes up to three times on
      # that one mirror: 4 to 13 minutes of update and install, where every
      # Azure runner took 17 to 40 seconds. The outside mirror served the same
      # runner at 300 kB/s and the cache at 81 MB/s, so the package files come
      # from the cache and a mirror serves only the ones that changed. That
      # download is a call of its own, so its one-minute bound on the runner's
      # mirror only ever stops a download, never dpkg, before it moves to the
      # outside mirror. autoclean drops the files Ubuntu has replaced, so the
      # saved set does not grow.
      # The key names the files, so a set is saved once and the prune keeps the
      # newest. Main saves a changed set. Any other run saves only when it
      # restored nothing, into its own pull request's scope, which covers the
      # time before main has saved a first set.
      run: |
        packages=(
          pkg-config libx11-dev libxi-dev libxtst-dev libxcb1-dev
          libxkbcommon-dev libxkbcommon-x11-dev libxdo-dev libvulkan-dev
          libwayland-dev libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev
        )
        archives=/var/cache/apt/archives
        saved="$RUNNER_TEMP/apt-archives"
        apt_get() {
          sudo timeout "$1" apt-get -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "${@:2}"
        }
        use_outside_mirror() {
          local list=/etc/apt/apt-mirrors.txt
          if [ -f "$list" ]; then
            echo "https://mirrors.edge.kernel.org/ubuntu/" | sudo tee "$list" > /dev/null
          fi
        }
        download() {
          apt_get "$1" install -y --no-install-recommends --download-only "${packages[@]}"
        }
        mkdir -p "$saved"
        if compgen -G "$saved/*.deb" > /dev/null; then
          sudo cp "$saved"/*.deb "$archives"/
        fi
        for attempt in 1 2 3; do
          apt_get 120 update && break
          if [ "$attempt" = 3 ]; then exit 1; fi
          use_outside_mirror
        done
        if ! download 60; then
          use_outside_mirror
          for attempt in 1 2 3; do
            download 300 && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            apt_get 120 update || true
          done
        fi
        apt_get 60 autoclean || true
        rm -f "$saved"/*.deb
        if compgen -G "$archives/*.deb" > /dev/null; then
          cp "$archives"/*.deb "$saved"/
          key="apt-archives-$ImageOS-$(cd "$saved" && LC_ALL=C ls | sha256sum | cut -c1-8)"
          if [ "$key" != "$RESTORED_KEY" ] && { [ "$GITHUB_REF" = refs/heads/main ] || [ -z "$RESTORED_KEY" ]; }; then
            echo "save-key=$key" >> "$GITHUB_OUTPUT"
          fi
        fi
        for attempt in 1 2 3; do
          apt_get 300 install -y --no-install-recommends "${packages[@]}" && break
          if [ "$attempt" = 3 ]; then exit 1; fi
        done

    - name: Save downloaded Linux system packages
      if: steps.packages.outputs.save-key != ''
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-archives
        key: ${{ steps.packages.outputs.save-key }}
