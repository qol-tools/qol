d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/layoutcode string us
d-i keyboard-configuration/modelcode string pc105
d-i netcfg/get_hostname string qol-mint-builder
d-i netcfg/get_domain string local
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean false
d-i time/zone string Etc/UTC
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i passwd/user-fullname string QoL Image Builder
d-i passwd/username string qol-builder
d-i passwd/user-password-crypted password $6$qolsandbox$qZKiNch8PxuYKVfLVOk27vfXVzRZ2CAx.4iDYR6xV.F7KmDyQd/uPykfbxvJHTNzqdr8HN27l0s5qHplv/a.J0
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/vda
d-i pkgsel/upgrade select none
d-i popularity-contest/participate boolean false
ubiquity ubiquity/download_updates boolean false
ubiquity ubiquity/use_nonfree boolean false
ubiquity ubiquity/reboot boolean true
ubiquity ubiquity/success_command string mkdir -p /target/tmp/qol-provision; mount -o ro /dev/sr1 /target/tmp/qol-provision; chroot /target /bin/bash /tmp/qol-provision/linux-mint-cinnamon/provision.sh /tmp/qol-provision/qol-guest-runner; chroot /target /usr/sbin/userdel --remove qol-builder; umount /target/tmp/qol-provision; echo QOL_IMAGE_BUILD_COMPLETE >/dev/ttyS0
ubiquity ubiquity/automation_failure_command string echo QOL_IMAGE_BUILD_INTERACTION_REQUIRED >/dev/ttyS0
ubiquity ubiquity/failure_command string echo QOL_IMAGE_BUILD_FAILED >/dev/ttyS0
