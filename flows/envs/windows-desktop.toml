id = "windows/desktop"
name = "Windows 11 Desktop"
family = "windows"
backend = "qemu"

[image]
kind = "qcow2"
base = "windows-desktop.qcow2"
recommended_size_gb = 40
arch = "x86_64"
firmware = "uefi"

[boot]
memory_mb = 4096
cpus = 2
display = "headless"

[mounts]
workspace = false

[capabilities]
