id = "linux/mint-cinnamon"
name = "Linux Mint Cinnamon"
family = "linux"
backend = "qemu"

[image]
kind = "qcow2"
base = "linux-mint-cinnamon.qcow2"
recommended_size_gb = 40
arch = "x86_64"
firmware = "uefi"

[boot]
memory_mb = 3072
cpus = 2
display = "headless"

[mounts]
workspace = false

[capabilities]
acceleration = "hardware"
kernel = "full"
reboot = "true"
desktop = "cinnamon"
display_protocol = "x11"
virtual_input = "qmp"
flow_adapter = "mint-cinnamon"
default_workflow = "qol-shot-capture"
image_revision = "mint-22.3-cinnamon-6.6.7-qol-1"
mint_release = "22.3"
mint_edition = "Cinnamon"
cinnamon_version = "6.6.7"
run_id_path = "/sys/firmware/qemu_fw_cfg/by_name/opt/qol/run-id/raw"
