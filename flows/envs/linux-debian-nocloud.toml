id = "linux/debian-nocloud"
name = "Debian Nocloud"
family = "linux"
backend = "qemu"

[image]
kind = "qcow2"
base = "debian-13-nocloud-amd64.qcow2"
recommended_size_gb = 3
arch = "x86_64"
firmware = "bios"

[boot]
memory_mb = 1024
cpus = 1
display = "headless"

[mounts]
workspace = false

[capabilities]
acceleration = "hardware"
kernel = "full"
reboot = "true"
serial = "qemu"
desktop = "false"
flow_adapter = "debian-nocloud"
