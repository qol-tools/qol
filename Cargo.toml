[workspace]
resolver = "2"
members = ["apps/*", "libs/*", "plugins/*", "tools/*"]
exclude = ["tools/__pycache__", "vendor"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
# internal crates - the single source of truth for every cross-crate path
qol-color = { path = "libs/qol-color" }
qol-config = { path = "libs/qol-config" }
qol-conventions = { path = "libs/qol-conventions" }
qol-dev-build = { path = "libs/qol-dev-build" }
qol-dev-env = { path = "libs/qol-dev-env" }
qol-dev-guest = { path = "libs/qol-dev-guest" }
qol-dev-orchestrator = { path = "libs/qol-dev-orchestrator" }
qol-frecency = { path = "libs/qol-frecency" }
qol-fs = { path = "libs/qol-fs" }
qol-platform = { path = "libs/qol-platform" }
qol-process = { path = "libs/qol-process" }
qol-runtime = { path = "libs/qol-runtime" }
qol-search = { path = "libs/qol-search" }
qol-migrations = { path = "libs/qol-migrations" }
qol-wasm = { path = "libs/qol-wasm" }
qol-apps = { path = "libs/qol-apps" }
qol-app-icon = { path = "libs/qol-app-icon" }
qol-gpui = { path = "libs/qol-gpui" }
qol-theme = { path = "libs/qol-theme" }
qol-headless = { path = "libs/qol-headless" }
qol-hotkeys = { path = "libs/qol-hotkeys" }
qol-plugin-api = { path = "libs/qol-plugin-api" }
qol-plugin-daemon = { path = "libs/qol-plugin-daemon" }
qol-workspace = { path = "libs/qol-workspace" }
qol-tray = { path = "apps/qol-tray" }

# shared external deps (hoisted from the ex-qol-libs workspace)
getrandom = "0.3"
gpui = "0.2"
open = "5"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.9"
toml_edit = "0.25"
x11rb = "0.13"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGDataProvider"] }

# macOS only: align zed-font-kit core-graphics versions
[patch.crates-io]
# gpui forces image's "avif" feature (an encoder nothing can call); the stub
# drops the rav1e stack until zed#60897 ships in a gpui release
ravif = { path = "vendor/ravif" }
core-text = { git = "https://github.com/servo/core-foundation-rs", tag = "core-text-v21.0.0" }
core-graphics = { git = "https://github.com/servo/core-foundation-rs", tag = "core-text-v21.0.0" }
core-foundation = { git = "https://github.com/servo/core-foundation-rs", tag = "core-text-v21.0.0" }
core-foundation-sys = { git = "https://github.com/servo/core-foundation-rs", tag = "core-text-v21.0.0" }

[profile.release]
strip = true
lto = "thin"

[profile.sandbox]
inherits = "release"
debug-assertions = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
