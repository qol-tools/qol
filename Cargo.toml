[workspace]
resolver = "2"
members = ["apps/*", "libs/*", "plugins/*", "tools/*"]
exclude = ["tools/__pycache__", "tools/qol-memory", "vendor"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
# internal crates - the single source of truth for every cross-crate path
qol-agent-homes = { path = "libs/qol-agent-homes" }
qol-artifact = { path = "libs/qol-artifact" }
qol-build-identity = { path = "libs/qol-build-identity" }
qol-cinnamon = { path = "libs/qol-cinnamon" }
qol-color = { path = "libs/qol-color" }
qol-config = { path = "libs/qol-config" }
qol-conventions = { path = "libs/qol-conventions" }
qol-dev-build = { path = "libs/qol-dev-build" }
qol-dev-env = { path = "libs/qol-dev-env" }
qol-dev-guest = { path = "libs/qol-dev-guest" }
qol-dev-orchestrator = { path = "libs/qol-dev-orchestrator" }
qol-frecency = { path = "libs/qol-frecency" }
qol-fs = { path = "libs/qol-fs" }
qol-log = { path = "libs/qol-log" }
qol-platform = { path = "libs/qol-platform" }
qol-watch = { path = "libs/qol-watch" }
qol-process = { path = "libs/qol-process" }
qol-runtime = { path = "libs/qol-runtime" }
qol-search = { path = "libs/qol-search" }
qol-migrations = { path = "libs/qol-migrations" }
qol-apps = { path = "libs/qol-apps" }
qol-app-icon = { path = "libs/qol-app-icon" }
qol-gpui = { path = "libs/qol-gpui" }
qol-theme = { path = "libs/qol-theme" }
qol-headless = { path = "libs/qol-headless" }
qol-host-fixes = { path = "libs/qol-host-fixes" }
qol-host-session = { path = "libs/qol-host-session" }
qol-hotkeys = { path = "libs/qol-hotkeys" }
qol-mcp = { path = "libs/qol-mcp" }
qol-terminal-sessions = { path = "libs/qol-terminal-sessions" }
qol-plugin-api = { path = "libs/qol-plugin-api" }
qol-plugin-daemon = { path = "libs/qol-plugin-daemon" }
qol-profile-sync = { path = "libs/qol-profile-sync" }
qol-workspace = { path = "libs/qol-workspace" }
qol-windowing = { path = "libs/qol-windowing" }
qol-zigbee = { path = "libs/qol-zigbee" }

# shared external deps (hoisted from the ex-qol-libs workspace)
base64 = "0.22"
getrandom = "0.3"
gpui = "0.2"
hmac = "0.12"
open = "5"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.9"
toml_edit = "0.25"
x11rb = "0.13"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGDataProvider"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop", "CFDate"] }
objc2-io-bluetooth = { version = "0.3", default-features = false, features = [
  "std",
  "objc2",
  "objc2-foundation",
  "objc2-core-foundation",
  "Bluetooth",
  "IOBluetoothTypes",
  "IOBluetoothUserLib",
  "IOBluetoothObject",
  "IOBluetoothDevice",
  "IOBluetoothDeviceInquiry",
  "IOBluetoothDevicePair",
  "IOBluetoothHostController",
  "IOBluetoothSDPServiceRecord",
  "IOBluetoothSDPUUID",
] }
object = { version = "0.39.1", default-features = false, features = ["elf", "macho", "pe", "read_core", "std"] }
target-lexicon = "0.12.16"

[patch.crates-io]
# QoL needs the owning X11 client to hand active continuous-hotkey grabs to Muffin.
global-hotkey = { path = "vendor/global-hotkey" }
# macOS only: align zed-font-kit core-graphics versions
# gpui forces image's "avif" feature (an encoder nothing can call); the stub
# drops the rav1e stack until zed#60897 ships in a gpui release
ravif = { path = "vendor/ravif" }
core-text = { git = "https://github.com/servo/core-foundation-rs", tag = "core-text-v21.0.0" }
core-graphics = { git = "https://github.com/servo/core-foundation-rs", tag = "core-text-v21.0.0" }
core-foundation = { git = "https://github.com/servo/core-foundation-rs", tag = "core-text-v21.0.0" }
core-foundation-sys = { git = "https://github.com/servo/core-foundation-rs", tag = "core-text-v21.0.0" }

[profile.release]
strip = true
lto = "thin"

[profile.sandbox]
inherits = "release"
debug-assertions = true
lto = false
codegen-units = 256
incremental = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.gpui]
opt-level = 2

[profile.dev.package.gpui_util]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 2

[profile.dev.package.blade-graphics]
opt-level = 2

[profile.dev.package.cosmic-text]
opt-level = 2

[profile.dev.package.rustybuzz]
opt-level = 2

[profile.dev.package.swash]
opt-level = 2

[profile.dev.package.zeno]
opt-level = 2

[profile.dev.package.candle-core]
opt-level = 2

[profile.dev.package.candle-nn]
opt-level = 2

[profile.dev.package.candle-transformers]
opt-level = 2

[profile.dev.package.gemm]
opt-level = 2

[profile.dev.package.gemm-c32]
opt-level = 2

[profile.dev.package.gemm-c64]
opt-level = 2

[profile.dev.package.gemm-common]
opt-level = 2

[profile.dev.package.gemm-f16]
opt-level = 2

[profile.dev.package.gemm-f32]
opt-level = 2

[profile.dev.package.gemm-f64]
opt-level = 2

[profile.dev.package.pulp]
opt-level = 2

[profile.dev.package.qol-shot]
opt-level = 2
