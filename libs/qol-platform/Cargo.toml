[package]
name = "qol-platform"
version = "0.2.0"
edition = "2021"
description = "Platform detection and capabilities for qol-tools"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
dirs = "6.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.16.0", features = ["blocking-api"] }
