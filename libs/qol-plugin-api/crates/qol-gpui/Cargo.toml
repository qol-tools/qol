[package]
name = "qol-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPUI windowing helpers for resident qol-tray plugins: ghost popups, monitor tracking, runtime event bridge"

[dependencies]
gpui.workspace = true
qol-runtime.workspace = true
qol-platform.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-app-kit = { workspace = true, features = [
  "NSApplication",
  "NSColor",
  "NSResponder",
  "NSScreen",
  "NSWindow",
] }
