[package]
name = "qol-runtime"
version = "0.1.0"
edition = "2021"
description = "Runtime protocol and client for QoL Tray platform state"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
log.workspace = true
zeroize = "1"
qol-peers.workspace = true
qol-config.workspace = true
qol-conventions.workspace = true
qol-windowing.workspace = true
serde.workspace = true
serde_json.workspace = true
workspace-hack.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
qol-process.workspace = true
uds_windows = "1.2.1"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.8"

[lints]
workspace = true
