[package]
name = "qol-pr-try"
version = "0.1.0"
edition = "2021"
description = "Runs a qol pull request's CI build in place of the installed one and puts the installed one back"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
anyhow = "1.0"
flate2 = "1"
qol-apps.workspace = true
qol-artifact.workspace = true
qol-config.workspace = true
qol-conventions.workspace = true
qol-fs.workspace = true
qol-platform.workspace = true
qol-process.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3.8"
workspace-hack.workspace = true
zip = { version = "9.8", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
