[package]
name = "qol-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPUI windowing helpers for resident qol-tray plugins: ghost popups, monitor tracking, runtime event bridge"

[dependencies]
anyhow = "1"
futures = "0.3"
gpui.workspace = true
image = { version = "0.25", default-features = false }
qrcode = { version = "0.14", default-features = false }
smallvec = "1.13"
tungstenite = "0.26"
qol-apps.workspace = true
qol-config.workspace = true
qol-color.workspace = true
qol-conventions.workspace = true
qol-runtime.workspace = true
qol-theme.workspace = true
serde = { workspace = true }
serde_json.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
proptest = "1.6"
taffy = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { workspace = true, features = ["shape"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
raw-window-handle = { workspace = true }
objc2-foundation = { workspace = true }
objc2-app-kit = { workspace = true, features = [
  "NSApplication",
  "NSColor",
  "NSEvent",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSView",
  "NSWindow",
] }
