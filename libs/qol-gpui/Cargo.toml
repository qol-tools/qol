[package]
name = "qol-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPUI windowing helpers for resident qol-tray plugins: ghost popups, monitor tracking, runtime event bridge"

[dependencies]
anyhow = "1"
gpui.workspace = true
qol-config.workspace = true
qol-conventions.workspace = true
qol-runtime.workspace = true
qol-theme.workspace = true
serde = { workspace = true }
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { workspace = true, features = ["shape"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
raw-window-handle = { workspace = true }
objc2-foundation = { workspace = true }
objc2-app-kit = { workspace = true, features = [
  "NSApplication",
  "NSColor",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSView",
  "NSWindow",
] }
