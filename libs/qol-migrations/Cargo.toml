[package]
name = "qol-migrations"
version = "0.1.0"
edition = "2021"
description = "On-disk format migrations between qol-tray releases"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["KMRH47"]

[lib]
name = "qol_migrations"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"

[dev-dependencies]
tempfile = "3.8"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
