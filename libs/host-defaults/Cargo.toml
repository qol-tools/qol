[package]
name = "qol-host-defaults"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host defaults a qol plugin can take over: handler roles, key slots and the claim ledger"

[dependencies]
anyhow = "1"
log.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
qol-desktop-settings.workspace = true
qol-fs.workspace = true
qol-platform.workspace = true
workspace-hack.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.16.0", features = ["blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[dev-dependencies]
qol-hotkeys.workspace = true
tempfile = "3"

[lints]
workspace = true
