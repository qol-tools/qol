[package]
name = "qol-terminal-sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Backend-neutral live terminal session discovery and interaction"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
qol-agent-homes.workspace = true
qol-config.workspace = true
qol-headless.workspace = true
qol-runtime.workspace = true
qol-watch.workspace = true
serde.workspace = true
serde_json.workspace = true
workspace-hack.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
qol-app-icon.workspace = true
qol-process.workspace = true
qol-windowing.workspace = true
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
] }
windows-sys = { version = "0.59", features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
dirs = "6.0"
tempfile = "3.8"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
