[package]
name = "qol-input"
version = "0.19.2"
edition = "2021"

[dependencies]
log.workspace = true
qol-log.workspace = true
anyhow = "1"
qol-apps.workspace = true
qol-config.workspace = true
qol-conventions.workspace = true
qol-headless.workspace = true
qol-host-fixes.workspace = true
qol-host-session.workspace = true
qol-platform.workspace = true
qol-plugin-daemon.workspace = true
serde.workspace = true
serde_json.workspace = true
workspace-hack.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
qol-desktop-settings.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-core-foundation = { workspace = true, features = ["CFNumber", "CFString"] }

[target.'cfg(target_os = "windows")'.dependencies]
qol-process.workspace = true
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
qol-conventions.workspace = true

[dev-dependencies]
qol-plugin-api.workspace = true

[lints]
workspace = true
