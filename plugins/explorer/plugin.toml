[plugin]
id = "qol-explorer"
uid = "2f4c2ef3-2e20-4be6-8c5f-183d28fbc59d"
name = "Explorer"
icon = "qol"
description = "Browse and pick files from the keyboard"
version = "0.8.0"
author = "KMRH47"
platforms = ["linux"]

[config.scope]
view_size = "core"
show_hidden = "core"

[runtime]
command = "qol-explorer"

[action.open]
label = "Open Explorer"
args = ["open"]

[action.settings]
label = "Settings"
kind = "settings"
picture = "gear"
args = ["settings"]

[capabilities]
doctor = true

[menu]
label = "Explorer"
items = []

[[shortcuts]]
id = "open"
name = "Explorer"
action = "open"
export_to_launcher = true

[[dependencies.binaries]]
name = "qol-explorer"
repo = "qol-tools/qol-explorer"
pattern = "qol-explorer-{os}-{arch}"
