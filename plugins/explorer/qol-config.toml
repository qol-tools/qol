schema_version = 1
title = "Explorer"
description = "Browse and pick files from the keyboard."

[section.sidebar]
label = "Sidebar"
description = "The folders Explorer lists on its left."

[section.view]
label = "View"
description = "How Explorer shows a folder when it opens."
actions = ["open"]

[field.view_size]
type = "select"
config_key = "view_size"
label = "Size"
description = "Row or icon size. Ctrl+1 to Ctrl+5, Ctrl+wheel and the slider change it too."
section = "view"
card_description = "Row or icon size, by Ctrl number."
default = "list"
options = ["compact", "list", "roomy", "icons", "big_icons"]

[field.view_size.option_labels]
compact = "Compact"
list = "List"
roomy = "Roomy"
icons = "Icons"
big_icons = "Big icons"

[field.view_size.option_pictures]
compact = "letters:1"
list = "letters:2"
roomy = "letters:3"
icons = "letters:4"
big_icons = "letters:5"

[field.show_hidden]
type = "boolean"
config_key = "show_hidden"
label = "Show hidden files"
description = "Show entries whose names start with a dot. Ctrl+H changes it too."
section = "view"
default = false

[field.pins]
type = "object_array"
config_key = "pins"
label = "Pinned folders"
description = "The folders Explorer lists first. Right-click one in Explorer to change it there."
section = "sidebar"
card_description = "The folders Explorer lists first."
item_label = "folder"
row_label = "{name}"
reorder = true
add_label = "Pin a folder…"
default = [
  { name = "Home", path = "~" },
  { name = "Desktop", path = "~/Desktop" },
  { name = "Documents", path = "~/Documents" },
  { name = "Downloads", path = "~/Downloads" },
  { name = "Music", path = "~/Music" },
  { name = "Pictures", path = "~/Pictures" },
  { name = "Videos", path = "~/Videos" },
]

[field.pins.item.fields]
name = "string"
path = "string"
