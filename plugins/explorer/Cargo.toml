[package]
name = "qol-explorer"
version = "0.11.0"
edition = "2021"
description = "Keyboard-first file explorer for QoL Tray"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "qol_explorer"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
dirs = "6"
futures = "0.3"
gpui.workspace = true
log.workspace = true
qol-apps.workspace = true
qol-config.workspace = true
qol-gpui.workspace = true
qol-headless.workspace = true
qol-log.workspace = true
qol-plugin-api.workspace = true
qol-platform.workspace = true
qol-watch.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-normalization = "0.1"
workspace-hack.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Storage_FileSystem",
  "Win32_System_WindowsProgramming",
] }

[build-dependencies]
qol-conventions.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
