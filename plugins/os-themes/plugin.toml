[plugin]
id = "qol-os-themes"
uid = "c0b6aa8d-2b51-4b03-a478-6ce3db8883eb"
name = "OS Themes"
icon = "os-themes"
description = "Cursor effects and light or dark theme switching."
version = "0.82.3"
author = "KMRH47"
platforms = ["linux", "windows"]

[config.scope]
enabled = "core"
pause_in_games = "core"
pause_in_fullscreen = "core"
shake_strictness = "core"
regrow_strictness = "core"
regrow_min_extent_px = "core"
shake_min_extent_px = "core"
shake_window_ms = "core"
scale_factor = "core"
calm_duration_ms = "core"
grow_ms = "core"
shrink_ms = "core"

[runtime]
command = "qol-os-themes"

[action.run]
label = "Cursor Grow"
args = ["run"]

[action.toggle_theme]
label = "Toggle Light/Dark"
args = ["toggle_theme"]

[action.settings]
label = "Settings"
kind = "settings"
picture = "gear"
args = ["settings"]

[capabilities]
gpui = true
doctor = true

[daemon]
enabled = true
inherit_listener = true
command = "qol-os-themes"
socket = "/tmp/qol-os-themes.sock"

[menu]
label = "OS Themes"
items = []

[[dependencies.binaries]]
name = "qol-os-themes"
repo = "qol-tools/qol-os-themes"
pattern = "qol-os-themes-{os}-{arch}"
