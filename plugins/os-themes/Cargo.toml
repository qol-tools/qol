[package]
name = "qol-os-themes"
version = "0.60.1"
edition = "2021"

[dependencies]
log.workspace = true
qol-log.workspace = true
anyhow = "1"
serde_json.workspace = true
qol-plugin-daemon.workspace = true
qol-runtime.workspace = true
qol-config.workspace = true
qol-fs.workspace = true
qol-apps.workspace = true
qol-headless.workspace = true
qol-host-fixes.workspace = true
qol-host-session.workspace = true
serde.workspace = true
workspace-hack.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2", features = ["xlib", "xcursor", "xfixes"] }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
qol-process.workspace = true
qol-windowing.workspace = true
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
qol-conventions.workspace = true

[dev-dependencies]
qol-plugin-api.workspace = true

[lints]
workspace = true
