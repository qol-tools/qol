schema_version = 1
title = "OS Themes"
description = "Desktop theming and cursor effects."

[section.shake_to_grow]
label = "Shake to grow"
description = "Shake the mouse back and forth to make the cursor big and easy to find."
actions = ["run"]

[field.enabled]
type = "boolean"
label = "Enable shake to grow"
section = "shake_to_grow"
default = true

[field.pause_in_games]
type = "boolean"
label = "Pause in games"
description = "Disable shake to grow while a game is in front."
section = "shake_to_grow"
default = true

[field.pause_in_games.show_when]
field = "enabled"
equals = true

[field.pause_in_fullscreen]
type = "boolean"
label = "Pause in fullscreen"
description = "Disable shake to grow while the focused window is fullscreen."
section = "shake_to_grow"
default = true

[field.pause_in_fullscreen.show_when]
field = "enabled"
equals = true

[field.shake_strictness]
type = "number"
label = "Shake strictness"
description = "How hard you must shake. Higher needs faster, wilder shaking."
section = "shake_to_grow"
default = 5.0
min = 1
step = 0.5

[field.shake_strictness.show_when]
field = "enabled"
equals = true

[field.regrow_strictness]
type = "number"
label = "Regrow strictness"
description = "How hard you must shake while the cursor is big. Lower regrows it sooner."
section = "shake_to_grow"
default = 2.5
min = 1
step = 0.5

[field.regrow_strictness.show_when]
field = "enabled"
equals = true

[field.regrow_min_extent_px]
type = "number"
label = "Regrow minimum size"
description = "Smallest shake, in pixels, that regrows a cursor that is still big."
section = "shake_to_grow"
default = 60
min = 10
step = 10

[field.regrow_min_extent_px.show_when]
field = "enabled"
equals = true

[field.shake_min_extent_px]
type = "number"
label = "Minimum shake size"
description = "Smallest shake, in pixels, that grows the cursor. Smaller wiggles are ignored."
section = "shake_to_grow"
default = 150
min = 20
step = 10

[field.shake_min_extent_px.show_when]
field = "enabled"
equals = true

[field.shake_window_ms]
type = "number"
label = "Shake time"
description = "How long you must keep shaking. Shorter needs faster shaking."
section = "shake_to_grow"
default = 600
min = 100
step = 50

[field.shake_window_ms.show_when]
field = "enabled"
equals = true

[field.scale_factor]
type = "number"
label = "Scale factor"
description = "How many times larger the cursor grows. 4 makes it four times its normal size."
section = "shake_to_grow"
default = 4
min = 1
step = 1

[field.scale_factor.show_when]
field = "enabled"
equals = true

[field.calm_duration_ms]
type = "number"
label = "Calm duration"
description = "How long after the last shake the cursor starts shrinking back."
section = "shake_to_grow"
default = 100
min = 50
step = 25

[field.calm_duration_ms.show_when]
field = "enabled"
equals = true

[field.grow_ms]
type = "number"
label = "Grow duration"
description = "Time for the cursor to reach full size."
section = "shake_to_grow"
default = 120
min = 20
step = 10

[field.grow_ms.show_when]
field = "enabled"
equals = true

[field.shrink_ms]
type = "number"
label = "Shrink duration"
description = "Time for the cursor to return to normal size."
section = "shake_to_grow"
default = 100
min = 20
step = 5

[field.shrink_ms.show_when]
field = "enabled"
equals = true

[section.theme]
label = "Light/dark theme"
description = "Switch the desktop between the light and dark variant of the current theme."
actions = ["toggle_theme"]

[field.toggle_theme]
type = "action"
label = "Dark theme"
section = "theme"
action = "toggle_theme"
active_action = "toggle_theme"
active_query = "theme_status"
active_value_from = "dark"
label_map = { false = "Light", true = "Dark" }
variant = "toggle"
