schema_version = 1
title = "OS Themes"
description = "Desktop theming and cursor effects."

[section.shake_to_grow]
label = "Shake to Grow"
description = "Shake the cursor fast back and forth to enlarge it, macOS style. Inside the detection window the cursor path must be Shake Strictness times longer than the area it covers and at least Min Shake Size wide, so the slowest shake that counts is strictness divided by twice the window in seconds (about 4.2 shakes per second with the defaults). Slow or brief wiggles never grow the cursor. The cursor shrinks back after the calm duration."
actions = ["run"]

[field.enabled]
type = "boolean"
label = "Enabled"
section = "shake_to_grow"
default = true

[field.pause_in_games]
type = "boolean"
label = "Pause in Games"
description = "Disable Shake to Grow while a Steam, Lutris, or GameMode game window is focused."
section = "shake_to_grow"
default = true

[field.pause_in_games.show_when]
field = "enabled"
equals = true

[field.pause_in_fullscreen]
type = "boolean"
label = "Pause in Fullscreen"
description = "Disable Shake to Grow while the focused window is fullscreen."
section = "shake_to_grow"
default = true

[field.pause_in_fullscreen.show_when]
field = "enabled"
equals = true

[field.shake_strictness]
type = "number"
label = "Shake Strictness"
description = "Path length divided by covered area needed inside the window. Higher means faster shaking."
section = "shake_to_grow"
default = 5.0
min = 1
step = 0.5

[field.shake_strictness.show_when]
field = "enabled"
equals = true

[field.regrow_strictness]
type = "number"
label = "Regrow Strictness"
section = "shake_to_grow"
default = 2.5
min = 1
step = 0.5

[field.regrow_strictness.show_when]
field = "enabled"
equals = true

[field.regrow_min_extent_px]
type = "number"
label = "Regrow Min Size"
section = "shake_to_grow"
default = 60
min = 10
step = 10

[field.regrow_min_extent_px.show_when]
field = "enabled"
equals = true

[field.shake_min_extent_px]
type = "number"
label = "Min Shake Size"
section = "shake_to_grow"
default = 150
min = 20
step = 10

[field.shake_min_extent_px.show_when]
field = "enabled"
equals = true

[field.shake_window_ms]
type = "number"
label = "Detection Window"
description = "How long a shake has to be sustained. A shorter window demands a faster shake."
section = "shake_to_grow"
default = 600
min = 100
step = 50

[field.shake_window_ms.show_when]
field = "enabled"
equals = true

[field.scale_factor]
type = "number"
label = "Scale Factor"
section = "shake_to_grow"
default = 4
min = 1
step = 1

[field.scale_factor.show_when]
field = "enabled"
equals = true

[field.calm_duration_ms]
type = "number"
label = "Calm Duration"
section = "shake_to_grow"
default = 100
min = 50
step = 25

[field.calm_duration_ms.show_when]
field = "enabled"
equals = true

[field.grow_ms]
type = "number"
label = "Grow Duration (ms)"
description = "Time for the cursor to reach full size."
section = "shake_to_grow"
default = 120
min = 20
step = 10

[field.grow_ms.show_when]
field = "enabled"
equals = true

[field.shrink_ms]
type = "number"
label = "Shrink Duration (ms)"
section = "shake_to_grow"
default = 225
min = 20
step = 5

[field.shrink_ms.show_when]
field = "enabled"
equals = true

[section.theme]
label = "Light/Dark Theme"
description = "Switch the desktop between the light and dark variant of the current theme."
actions = ["toggle_theme"]

[field.toggle_theme]
type = "action"
label = "Switch to Dark"
active_label = "Switch to Light"
section = "theme"
action = "toggle_theme"
active_action = "toggle_theme"
active_query = "theme_status"
active_value_from = "dark"
label_map = { false = "Light", true = "Dark" }
variant = "toggle"
