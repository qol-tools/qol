schema_version = 1
title = "Memory"
description = "Recall recorded answers across different question wordings."

[section.answers]
label = "Answers"
description = "How Memory decides what a question is asking for."

[field.verify_answers]
type = "boolean"
label = "Understand question variations (experimental)"
description = "Match reworded questions using a model on this computer. Restart Memory to apply."
section = "answers"
default = false

[field.verifier_endpoint]
type = "string"
label = "Model server address"
description = "Leave empty to let qol run one for you. Restart Memory to apply."
section = "answers"
placeholder = "http://127.0.0.1:11434"
default = ""

[field.verifier_endpoint.show_when]
field = "verify_answers"
equals = true

[section.storage]
label = "Storage"
description = "How much disk the memory history keeps."

[field.notes_runs_kept]
type = "number"
variant = "slider"
label = "Saved note history"
description = "How many past note updates to keep. 0 keeps all of them."
section = "storage"
default = 0
min = 0
max = 60
step = 1
