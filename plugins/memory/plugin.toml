[plugin]
id = "qol-memory"
uid = "a2d9cb99-1d62-4f73-ab8e-51de1fa7ac63"
name = "Memory"
icon = "memory"
description = "Look up facts from your past AI coding sessions"
version = "0.36.0"
author = "KMRH47"
platforms = ["linux", "macos", "windows"]

[runtime]
command = "qol-memory"

[daemon]
enabled = true
command = "qol-memory"
socket = "/tmp/qol-memory.sock"

[action.status]
label = "Status"
args = ["status"]

[action.capture]
label = "Capture"
args = ["capture"]

[capabilities]
doctor = true

[launcher]
kind = "flow"
title = "qol memory"
prompt = "Ask memory"
query = "rows"

[menu]
label = "Memory"
items = []

[[dependencies.binaries]]
name = "qol-memory"
repo = "qol-tools/qol-memory"
pattern = "qol-memory-{os}-{arch}"
