[plugin]
id = "plugin-monitor"
uid = "d3d4cda9-f9cf-44dc-aacd-07419b5b5ea0"
name = "Monitor"
description = "Display brightness, gamma, and mode control"
version = "0.7.0"
author = "KMRH47"
platforms = ["linux", "macos"]

[runtime]
command = "plugin-monitor"

[action.brightness-up]
label = "Brightness Up"
args = ["up"]
continuous = true

[action.brightness-down]
label = "Brightness Down"
args = ["down"]
continuous = true

[action.set_brightness]
label = "Set Brightness"
args = ["set_brightness"]

[action.apply]
label = "Apply Preferred Brightness"
args = ["apply"]

[action.reload]
label = "Reload Monitor Config"
args = ["reload"]

[action.night_toggle]
label = "Toggle Night Mode"
args = ["night_toggle"]

[action.night_on]
label = "Night Mode On"
args = ["night_on"]

[action.night_off]
label = "Night Mode Off"
args = ["night_off"]

[action.settings]
label = "Settings"
kind = "settings"
args = ["settings"]

[capabilities]
gpui = true
doctor = true

[daemon]
enabled = true
command = "plugin-monitor"
socket = "/tmp/qol-plugin-monitor.sock"

[menu]
label = "Monitor"
items = []

[[dependencies.binaries]]
name = "plugin-monitor"
repo = "qol-tools/plugin-monitor"
pattern = "plugin-monitor-{os}-{arch}"
