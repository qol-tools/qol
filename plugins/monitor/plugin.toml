[plugin]
id = "qol-monitor"
uid = "d3d4cda9-f9cf-44dc-aacd-07419b5b5ea0"
name = "Display"
icon = "display"
description = "Control display brightness, night mode and resolution"
version = "0.51.0"
author = "KMRH47"
platforms = ["linux", "macos", "windows"]

[config.scope]
night_temperature = "core"
night_schedule = "core"
night_from = "core"
night_to = "core"
night_coordination = "core"
policy = "core"
sync_brightness_levels = "core"
notify_on_change = "core"

[runtime]
command = "qol-monitor"

[action.brightness-up]
label = "Brightness Up"
args = ["up"]
continuous = true

[action.brightness-down]
label = "Brightness Down"
args = ["down"]
continuous = true

[action.set_brightness]
label = "Set Brightness"
args = ["set_brightness"]

[action.set_mode]
label = "Set Display Mode"
args = ["set-mode"]

[action.set_primary]
label = "Set Primary Display"
args = ["primary"]

[action.arrange]
label = "Arrange Displays"
args = ["arrange"]

[action.apply_layout]
label = "Apply Display Positions"
args = ["apply-layout"]

[action.apply]
label = "Apply Preferred Brightness"
args = ["apply"]

[action.reload]
label = "Reload Display Settings"
args = ["reload"]

[action.night_toggle]
label = "Toggle Night Mode"
args = ["night_toggle"]

[action.night_on]
label = "Turn Night Mode On"
args = ["night_on"]

[action.night_off]
label = "Turn Night Mode Off"
args = ["night_off"]

[action.settings]
label = "Settings"
kind = "settings"
picture = "gear"
args = ["settings"]

[capabilities]
gpui = true
doctor = true

[daemon]
enabled = true
command = "qol-monitor"
socket = "/tmp/qol-plugin-monitor.sock"

[menu]
label = "Display"
items = []

[[dependencies.binaries]]
name = "qol-monitor"
repo = "qol-tools/qol-monitor"
pattern = "qol-monitor-{os}-{arch}"
