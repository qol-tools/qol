schema_version = 1
title = "Monitor"
description = "Display brightness, gamma, and mode control."

[section.displays]
label = "Displays"
description = "Live brightness state for every connected display, read from the monitor daemon."

[section.night]
label = "Night mode"
description = "Warm display colours manually or on a daily schedule."

[section.preferences]
label = "Preferences"
description = "Per-display preferred brightness and control policy, applied at daemon start and when changed."

[field.status]
type = "status"
label = "Status"
section = "displays"
query = "status"
value_from = "state"
label_map = { ok = "Brightness ready", no_displays = "No displays detected", unavailable = "Brightness unavailable" }
tone_map = { ok = "success", no_displays = "warning", unavailable = "danger" }

[field.displays]
type = "list"
label = "Displays"
section = "displays"
query = "displays"
row_label = "{connector}"
row_subtitle = "{detail}"
empty_message = "No displays connected."
row_slider = { value_from = "brightness", min = 0, max = 100, step = 5, action = "set_brightness", input = { id = "{id}", value = "{value}" } }

[field.apply_preferred]
type = "action"
label = "Apply Preferred Now"
section = "displays"
action = "apply"
variant = "primary"
description = "Set every connected display to its preferred brightness immediately."

[field.night_status]
type = "status"
label = "Night mode status"
section = "night"
query = "night_mode"
value_from = "state"
label_map = { active = "Night mode on", inactive = "Night mode off", unsupported = "Night mode is not available on this platform yet", conflict = "Cinnamon night light could not be taken over; it will fight qol night mode", invalid_schedule = "Schedule times are invalid" }
tone_map = { active = "success", inactive = "neutral", unsupported = "warning", conflict = "danger", invalid_schedule = "danger" }

[field.night_toggle]
type = "action"
label = "Night mode"
active_label = "Night mode"
description = "Switch the warm colour filter on or off."
section = "night"
action = "night_on"
active_action = "night_off"
active_query = "night_mode"
active_value_from = "active"
variant = "toggle"

[field.night_temperature]
type = "number"
variant = "slider"
config_key = "night_temperature"
label = "Colour temperature"
description = "Colour temperature in kelvin while night mode is on; lower is warmer."
section = "night"
default = 3500
min = 1500
max = 6500
step = 100

[field.night_schedule]
type = "select"
config_key = "night_schedule"
label = "Schedule"
description = "Run night mode between the daily start and end times."
section = "night"
default = "off"
options = ["off", "daily"]

[field.night_schedule.option_labels]
off = "Off"
daily = "Daily"

[field.night_from]
type = "string"
config_key = "night_from"
label = "From"
description = "Daily start time in 24-hour HH:MM format."
section = "night"
default = "20:00"

[field.night_to]
type = "string"
config_key = "night_to"
label = "To"
description = "Daily end time in 24-hour HH:MM format."
section = "night"
default = "06:00"

[field.policy]
type = "object_map"
config_key = "policy"
label = "Control Policy"
section = "preferences"
key_label = "Display ID"
description = "How each display is controlled. Labels: auto (prefer DDC, fall back to gamma), ddc, gamma, or off. Unknown labels are ignored."
entry_fields = { policy = "string" }
default = {}

[field.notify_on_change]
type = "boolean"
config_key = "notify_on_change"
label = "Brightness notifications"
section = "preferences"
default = true
description = "Show a notification with the new brightness level whenever brightness changes. Turn this off to silence the brightness toasts."
