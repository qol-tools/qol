schema_version = 1
title = "Monitor"
description = "Display brightness, gamma, and mode control."

[section.displays]
label = "Displays"
description = "Live brightness state for every connected display, read from the monitor daemon."

[section.controls]
label = "Controls"
description = "Pick a display and set its brightness now."

[section.preferences]
label = "Preferences"
description = "Per-display preferred brightness and control policy, applied at daemon start and when changed."

[field.status]
type = "status"
label = "Status"
section = "displays"
query = "status"
value_from = "state"
label_map = { ok = "Brightness ready", no_displays = "No displays detected", unavailable = "Brightness unavailable" }
tone_map = { ok = "success", no_displays = "warning", unavailable = "danger" }

[field.displays]
type = "list"
label = "Displays"
section = "displays"
query = "displays"
row_label = "{connector}"
row_subtitle = "{detail}"
empty_message = "No displays connected."

[field.apply_preferred]
type = "action"
label = "Apply Preferred Now"
section = "displays"
action = "apply"
variant = "primary"
description = "Set every connected display to its preferred brightness immediately."

[field.active_display]
type = "select"
config_key = "active_display"
label = "Display"
section = "controls"
query = "display_options"
default = "all"
option_labels = { all = "All displays" }
description = "Which display the brightness control below writes to."

[field.active_brightness]
type = "number"
config_key = "active_brightness"
label = "Brightness"
section = "controls"
default = 50
min = 0
max = 100
step = 5
variant = "slider"
action = "set_brightness"
description = "Press Enter, adjust with the left and right arrow keys, then press Enter to apply."

[field.preferred_brightness]
type = "object_map"
config_key = "preferred_brightness"
label = "Preferred Brightness"
section = "preferences"
key_label = "Display ID"
description = "Brightness target per display, applied at daemon start and when this value changes. Entries outside 0-100 are ignored."
entry_fields = { brightness = "number" }
default = {}

[field.policy]
type = "object_map"
config_key = "policy"
label = "Control Policy"
section = "preferences"
key_label = "Display ID"
description = "How each display is controlled. Labels: auto (prefer DDC, fall back to gamma), ddc, gamma, or off. Unknown labels are ignored."
entry_fields = { policy = "string" }
default = {}
