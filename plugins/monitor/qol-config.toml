schema_version = 1
title = "Display"
description = "Control display brightness, night mode and resolution."

[section.display]
label = "Display"
description = "Brightness and layout for connected displays."

[section.night]
label = "Night mode"
description = "Warm your display colors manually or on a daily schedule."

[section.preferences]
label = "Preferences"
description = "How qol controls each display."

[field.status]
type = "status"
label = "Status"
section = "display"
query = "status"
value_from = "state"
label_map = { ok = "Brightness ready", no_displays = "No displays detected", unavailable = "Brightness unavailable" }
tone_map = { ok = "success", no_displays = "warning", unavailable = "danger" }

[field.night_status]
type = "status"
label = "Night mode status"
section = "night"
query = "night_mode"
value_from = "state"
label_map = { active = "Night mode on", capped = "Night mode on, as warm as the system allows", inactive = "Night mode off", unsupported = "Night mode is not available on this computer", conflict = "Another night light is in the way", failed = "Night mode could not be applied", invalid_schedule = "Schedule times are invalid", controlled = "Night mode is working", limited = "Another program keeps changing the tint", uncontrolled = "This display's color profile blocks night mode" }
tone_map = { active = "success", capped = "warning", inactive = "neutral", unsupported = "warning", conflict = "danger", failed = "danger", invalid_schedule = "danger" }

[field.night_toggle]
type = "action"
label = "Night mode"
active_label = "Night mode"
description = "Switch the warm color filter on or off."
section = "night"
action = "night_on"
active_action = "night_off"
active_query = "night_mode"
active_value_from = "active"
variant = "toggle"

[field.night_temperature]
type = "number"
variant = "slider"
config_key = "night_temperature"
label = "Warmth"
description = "How warm the screen looks while night mode is on. Lower is warmer."
section = "night"
default = 3500
min = 1500
max = 6500
step = 100

[field.night_schedule]
type = "select"
config_key = "night_schedule"
label = "Schedule"
description = "Run night mode between the daily start and end times."
section = "night"
default = "off"
card_description = "When night mode turns on."
options = ["off", "daily"]

[field.night_schedule.option_labels]
off = "Off"
daily = "Daily"

[field.night_schedule.option_pictures]
off = "schedule-off"
daily = "schedule-daily"

[field.night_from]
type = "string"
config_key = "night_from"
label = "From"
description = "When night mode turns on each day, like 20:00."
section = "night"
default = "20:00"

[field.night_from.show_when]
field = "night_schedule"
equals = "daily"

[field.night_to]
type = "string"
config_key = "night_to"
label = "To"
description = "When night mode turns off each day, like 06:00."
section = "night"
default = "06:00"

[field.night_to.show_when]
field = "night_schedule"
equals = "daily"

[field.night_coordination]
type = "select"
config_key = "night_coordination"
label = "Other night mode apps"
description = "When another app already tints a display: take over its tint, or leave it alone."
section = "night"
default = "own"
card_description = "When another app tints a display."
options = ["own", "detect"]

[field.night_coordination.option_labels]
own = "Take over"
detect = "Leave alone"

[field.night_coordination.option_pictures]
own = "letters:T"
detect = "letters:Y"

[field.policy]
type = "object_map"
config_key = "policy"
label = "Brightness method"
section = "preferences"
key_label = "Display"
description = "How brightness is changed on each display. Leave on Automatic unless a display misbehaves."
card_description = "How each display is controlled."
item_label = "display setting"
entry_fields = { policy = "string" }
default = {}

[field.arrangement]
type = "display_layout"
label = "Displays"
section = "display"
query = "layout"
active_query = "modes"
action = "arrange"
active_action = "set_mode"
description = "Arrange displays and set each one's brightness, resolution and role."
card_description = "Arrange and tune each display."
row_slider = { value_from = "brightness", min = 0, max = 100, step = 5, action = "set_brightness", input = { id = "{id}", value = "{value}" } }

[field.sync_brightness_levels]
type = "boolean"
config_key = "sync_brightness_levels"
label = "Sync brightness levels"
section = "display"
default = true
description = "Changing one display's brightness sets all connected displays to the same level."

[field.notify_on_change]
type = "boolean"
config_key = "notify_on_change"
label = "Brightness notifications"
section = "display"
default = true
description = "Show the new brightness level whenever it changes."
