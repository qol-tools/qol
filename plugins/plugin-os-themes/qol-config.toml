schema_version = 1
title = "OS Themes"
description = "Cursor growth behavior for the shake-to-grow effect."

[section.thresholds]
label = "Shake Detection"
description = "A shake is counted in direction reversals: quick swings past the minimum travel and speed, all inside the detection window."
actions = ["run"]

[field.shake_reversals]
type = "number"
label = "Reversals To Grow"
section = "thresholds"
default = 5
min = 2
step = 1

[field.regrow_reversals]
type = "number"
label = "Reversals To Regrow"
section = "thresholds"
default = 3
min = 1
step = 1

[field.shake_window_ms]
type = "number"
label = "Detection Window"
section = "thresholds"
default = 600
min = 100
step = 50

[field.swing_min_px]
type = "number"
label = "Min Swing Travel"
section = "thresholds"
default = 40
min = 1
step = 1

[field.swing_min_speed]
type = "number"
label = "Min Swing Speed"
section = "thresholds"
default = 1400
min = 100
step = 100

[section.animation]
label = "Animation"
description = "Size and recovery behavior after the cursor grows."
actions = ["run"]

[field.scale_factor]
type = "number"
label = "Scale Factor"
section = "animation"
default = 4
min = 1
step = 1

[field.calm_duration_ms]
type = "number"
label = "Calm Duration"
section = "animation"
default = 650
min = 50
step = 25

[field.restore_steps]
type = "number"
label = "Restore Steps"
section = "animation"
default = 18
min = 1
step = 1
