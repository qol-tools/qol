schema_version = 1
title = "OS Themes"
description = "Cursor growth behavior for the shake-to-grow effect."

[section.thresholds]
label = "Shake Detection"
description = "A shake must retrace its own ground: inside the detection window the cursor path must be several times longer than the area it covers, and that area must be at least the minimum shake size."
actions = ["run"]

[field.shake_strictness]
type = "number"
label = "Shake Strictness"
section = "thresholds"
default = 6.5
min = 1
step = 0.5

[field.shake_min_extent_px]
type = "number"
label = "Min Shake Size"
section = "thresholds"
default = 150
min = 20
step = 10

[field.shake_window_ms]
type = "number"
label = "Detection Window"
section = "thresholds"
default = 1000
min = 100
step = 50

[section.animation]
label = "Animation"
description = "Size and recovery behavior after the cursor grows."
actions = ["run"]

[field.scale_factor]
type = "number"
label = "Scale Factor"
section = "animation"
default = 4
min = 1
step = 1

[field.calm_duration_ms]
type = "number"
label = "Calm Duration"
section = "animation"
default = 650
min = 50
step = 25

[field.restore_steps]
type = "number"
label = "Restore Steps"
section = "animation"
default = 18
min = 1
step = 1
