[plugin]
id = "plugin-os-themes"
name = "OS Themes"
description = "Cursor effects and OS-wide theming"
version = "0.6.1"
author = "KMRH47"
platforms = ["linux"]

[runtime]
command = "plugin-os-themes"

[action.run]
label = "Cursor Grow"
args = ["run"]

[action.settings]
label = "Settings"
kind = "settings"
args = ["settings"]

[daemon]
enabled = true
command = "plugin-os-themes"
socket = "/tmp/qol-os-themes.sock"

[menu]
label = "OS Themes"
items = []

[[dependencies.binaries]]
name = "plugin-os-themes"
repo = "qol-tools/plugin-os-themes"
pattern = "plugin-os-themes-{os}-{arch}"
