schema_version = 1
title = "Controllers"
description = "Connected game controllers and known driver defects."

[section.controllers]
label = "Controllers"

[field.fixes_status]
type = "status"
label = "Status"
section = "controllers"
query = "controllers_status"
value_from = "state"
label_map = { none = "No Controllers Detected", ok = "All controllers healthy", pending = "Fix available", driver_missing = "Driver missing" }
tone_map = { ok = "success", pending = "danger", driver_missing = "danger" }

[field.detected_pads]
type = "list"
label = "Connected Controllers"
section = "controllers"
query = "list_controllers"
row_label = "{name}"
row_subtitle = "{transport} - {verdict}"
empty_message = "No controllers detected."

[field.detected_pads.row_action]
action = "apply_fixes"
label = "Fix"
when = "fixable"
