<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lights Settings</title>
    <script>
        fetch('/api/theme/accent')
            .then((res) => (res.ok ? res.json() : null))
            .then((body) => {
                if (body?.key) document.documentElement.dataset.qolAccent = body.key;
            })
            .catch(() => {});
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app"></div>
    <script type="module" src="app.js"></script>
</body>
</html>
