[plugin]
id = "plugin-lights"
uid = "368871df-de60-4a7a-ab7c-8d33fcd22511"
name = "Lights"
description = "Control lights through backend adapters"
version = "1.21.2"
author = "KMRH47"
platforms = ["linux", "macos"]

[runtime]
command = "plugin-lights"

[action.toggle_main]
label = "Toggle Main Light"
args = ["toggle_main"]

[action.on_main]
label = "Turn Main Light On"
args = ["on_main"]

[action.off_main]
label = "Turn Main Light Off"
args = ["off_main"]

[action.brighter_main]
label = "Brighten Main Light"
args = ["brighter_main"]

[action.dimmer_main]
label = "Dim Main Light"
args = ["dimmer_main"]

[action.warmer_main]
label = "Warm Main Light"
args = ["warmer_main"]

[action.cooler_main]
label = "Cool Main Light"
args = ["cooler_main"]

[action.preset_1]
label = "Preset 1"
args = ["preset_1"]

[action.preset_2]
label = "Preset 2"
args = ["preset_2"]

[action.preset_3]
label = "Preset 3"
args = ["preset_3"]

[action.preset_4]
label = "Preset 4"
args = ["preset_4"]

[action.preset_5]
label = "Preset 5"
args = ["preset_5"]

[action.preset_6]
label = "Preset 6"
args = ["preset_6"]

[action.preset_7]
label = "Preset 7"
args = ["preset_7"]

[action.preset_8]
label = "Preset 8"
args = ["preset_8"]

[action.settings]
label = "Settings"
kind = "settings"
args = ["settings"]

[action.pair]
label = "Pair Device"
args = ["pair"]

[action.stop_pair]
label = "Stop Pairing"
args = ["stop_pair"]

[action.set_color_main]
label = "Set Main Light Color"
args = ["set_color_main"]

[action.set_brightness_main]
label = "Set Main Light Brightness"
args = ["set_brightness_main"]

[action.set_colortemp_main]
label = "Set Main Light Color Temperature"
args = ["set_colortemp_main"]

[action.reload]
label = "Reconnect"
args = ["reload"]

[capabilities]
serial = true

[daemon]
enabled = true
command = "plugin-lights"
socket = "/tmp/plugin-lights.sock"
port = 42710

[menu]
label = "Lights"
items = []

[[dependencies.binaries]]
name = "plugin-lights"
repo = "qol-tools/plugin-lights"
pattern = "plugin-lights-{os}-{arch}"
