schema_version = 1
title = "Alt Tab"
description = "Window switching behavior, layout, and labels."

[section.behavior]
label = "Behavior"
description = "How Alt Tab opens and advances selection."
actions = ["open", "open-reverse"]

[field.action_mode]
type = "select"
label = "Action Mode"
section = "behavior"
default = "hold_to_switch"
options = ["hold_to_switch", "sticky"]

[field.action_mode.option_labels]
hold_to_switch = "Hold To Switch"
sticky = "Sticky"

[field.open_behavior]
type = "select"
label = "Open Behavior"
section = "behavior"
default = "cycle_once"
options = ["cycle_once", "show_only"]

[field.open_behavior.option_labels]
cycle_once = "Cycle Once"
show_only = "Show Only"

[field.reset_selection_on_open]
type = "boolean"
label = "Reset Selection On Open"
section = "behavior"
default = true

[section.windows]
label = "Windows"
description = "Which windows the picker is allowed to list."
actions = ["open", "open-reverse"]

[field.switchable_panels]
type = "object_array"
label = "Switchable Panels"
description = "Overrides for always-on-top panels, which the picker hides by default. Add an app with the toggle on to make it switchable, or add one qol already includes with the toggle off to hide it again."
section = "windows"
default = []

[field.switchable_panels.item.fields]
app = "string"
switchable = "boolean"

[section.layout]
label = "Layout"
description = "Display tuning for the window picker."
actions = ["open", "open-reverse"]

[field.display_card_scale]
type = "number"
config_key = "display.card_scale"
label = "Card Size"
description = "Scale multiplier for window cards and previews. 1.0 is the compact legacy size."
section = "layout"
default = 1.5
min = 0.5
max = 2.5
step = 0.1

[field.display_dynamic_card_scale]
type = "boolean"
config_key = "display.dynamic_card_scale"
label = "Dynamic card size"
description = "Grow window cards to fill free space when few windows are open; shrink to fit when many are."
section = "layout"
default = true

[field.display_card_padding]
type = "number"
config_key = "display.card_padding"
label = "Card Padding"
description = "Inner padding around each card preview and title."
section = "layout"
default = 4
min = 0
max = 24
step = 1

[field.display_icon_position]
type = "select"
config_key = "display.icon_position"
label = "Preview Icon Position"
description = "Where the app icon appears over each window preview."
section = "layout"
default = "top_right"
options = ["top_right", "top_left"]

[field.display_icon_position.option_labels]
top_right = "Top Right"
top_left = "Top Left"

[field.display_max_columns]
type = "number"
config_key = "display.max_columns"
label = "Max Columns"
section = "layout"
default = 6
min = 2
max = 10
step = 1

[field.display_show_hotkey_hints]
type = "boolean"
config_key = "display.show_hotkey_hints"
label = "Show Hotkey Hints"
section = "layout"
default = true

[field.display_show_minimized]
type = "boolean"
config_key = "display.show_minimized"
label = "Show Minimized Windows"
section = "layout"
default = true

[field.display_transparent_background]
type = "boolean"
config_key = "display.transparent_background"
label = "Transparent Background"
section = "layout"
default = false

[field.display_show_debug_overlay]
type = "boolean"
config_key = "display.show_debug_overlay"
label = "Show Debug Overlay"
section = "layout"
default = false

[field.display_ghost_opacity]
type = "number"
config_key = "display.ghost_opacity"
label = "Ghost Opacity (debug)"
description = "Opacity of the hidden picker window in debug builds. 0 = invisible."
section = "layout"
default = 0.0
min = 0.0
max = 1.0
step = 0.05

[field.display_ghost_debug_color]
type = "color"
config_key = "display.ghost_debug_color"
label = "Ghost Color (debug)"
description = "Background hex color of the hidden picker window in debug builds."
section = "layout"
placeholder = "ff0000"
default = "ff0000"

[field.display_card_background_color]
type = "color"
config_key = "display.card_background_color"
label = "Card Background Color"
description = "Base color for picker cards; the panel, hover, and selected colors derive from this."
section = "layout"
default = "#202322"

[field.display_card_background_brightness]
type = "number"
config_key = "display.card_background_brightness"
label = "Card Background Brightness"
description = "Brightness multiplier for the picker card color. Lower values keep saturated colors subdued."
section = "layout"
default = 1.0
min = 0.0
max = 1.0
step = 0.05

[field.display_card_background_opacity]
type = "number"
config_key = "display.card_background_opacity"
label = "Card Background Opacity"
section = "layout"
default = 0.85
min = 0.0
max = 1.0
step = 0.05

[section.labels]
label = "Labels"
description = "What text each window row should show."
actions = ["open", "open-reverse"]

[field.label_size]
type = "select"
config_key = "label.size"
label = "Label Size"
description = "Text size relative to the card size."
section = "labels"
default = "medium"
options = ["small", "medium", "large"]

[field.label_size.option_labels]
small = "Small"
medium = "Medium"
large = "Large"

[field.label_show_app_name]
type = "boolean"
config_key = "label.show_app_name"
label = "Show App Name"
description = "Prefix the window title with the app name and a separator when both labels are visible."
section = "labels"
default = false

[field.label_show_window_title]
type = "boolean"
config_key = "label.show_window_title"
label = "Show Window Title"
section = "labels"
default = true
