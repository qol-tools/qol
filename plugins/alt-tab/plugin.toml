[plugin]
id = "qol-alt-tab"
uid = "a7f48ac7-3cd5-4402-a1fe-d517fbce0fd6"
name = "Alt Tab"
description = "Better alt-tab experience with window previews"
version = "0.83.0"
author = "KMRH47"
platforms = ["linux", "macos"]

[config.scope]
switchable_panels = "os"

[runtime]
command = "qol-alt-tab"

[action.open]
label = "Alt Tab (Open/Next)"
picture = "next-window"
args = ["--show"]

[action.open-reverse]
label = "Alt Tab (Previous)"
picture = "previous-window"
args = ["--show-reverse"]

[action.settings]
label = "Settings"
kind = "settings"
picture = "gear"
args = ["--settings"]

[daemon]
enabled = true
command = "qol-alt-tab"
inherit_listener = true
socket = "/tmp/qol-alt-tab.sock"

[capabilities]
gpui = true
doctor = true
permissions = ["input-capture", "screen-capture"]

[menu]
label = "Alt Tab"
items = []

[traits.confined]

[traits.peripheral-preview]
neighbors = 1

[traits.atmosphere]
preset = "spacecraft"

[[dependencies.binaries]]
name = "qol-alt-tab"
repo = "qol-tools/qol-alt-tab"
pattern = "qol-alt-tab-{os}-{arch}"
