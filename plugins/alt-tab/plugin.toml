[plugin]
id = "plugin-alt-tab"
uid = "a7f48ac7-3cd5-4402-a1fe-d517fbce0fd6"
name = "Alt Tab"
description = "Better alt-tab experience with window previews"
version = "0.69.0"
author = "KMRH47"
platforms = ["linux", "macos"]

[config.scope]
switchable_panels = "os"

[runtime]
command = "alt-tab"

[action.open]
label = "Alt Tab (Open/Next)"
args = ["--show"]

[action.open-reverse]
label = "Alt Tab (Previous)"
args = ["--show-reverse"]

[action.settings]
label = "Settings"
kind = "settings"
args = ["--settings"]

[daemon]
enabled = true
command = "alt-tab"
socket = "/tmp/qol-alt-tab.sock"

[capabilities]
gpui = true
doctor = true

[menu]
label = "Alt Tab"
items = []

[[dependencies.binaries]]
name = "alt-tab"
repo = "qol-tools/plugin-alt-tab"
pattern = "alt-tab-{os}-{arch}"
