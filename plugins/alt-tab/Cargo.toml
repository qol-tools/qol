[package]
name = "alt-tab"
version = "0.60.0"
edition = "2021"
description = "Alt-Tab window switcher plugin for QoL Tray"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
futures = "0.3"
gpui.workspace = true
image = { version = "0.25", default-features = false }
qol-apps.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec = "1.13"
qol-config.workspace = true
qol-conventions.workspace = true
qol-plugin-daemon.workspace = true
qol-app-icon.workspace = true
qol-gpui.workspace = true
qol-headless.workspace = true
qol-runtime.workspace = true
qol-windowing.workspace = true

[build-dependencies]
qol-conventions.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
qol-fs.workspace = true
x11rb = { workspace = true, features = [
  "allow-unsafe-code",
  "xinput",
  "composite",
  "render",
] }
zbus = { version = "5.16.0", features = ["blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = "0.10"
core-video = { version = "0.4.3", features = ["metal"] }
objc2 = { workspace = true }
objc2-foundation = { version = "0.3", features = [
  "NSString",
  "NSArray",
  "NSEnumerator",
  "NSDictionary",
  "NSNotification",
  "NSOperation",
  "NSRunLoop",
  "NSError",
  "NSObject",
  "NSData",
  "block2",
] }
objc2-app-kit = { version = "0.3", features = [
  "NSApplication",
  "NSColor",
  "NSRunningApplication",
  "NSWindow",
  "NSScreen",
  "NSWorkspace",
  "NSImage",
  "NSImageRep",
  "NSGraphicsContext",
  "objc2-core-graphics",
] }

[dev-dependencies]
qol-plugin-api.workspace = true
tempfile = "3"
