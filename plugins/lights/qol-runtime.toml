schema_version = 1

[action.toggle_main]
description = "Toggle power on the main target device"

[action.on_main]
description = "Turn on the main target device"

[action.off_main]
description = "Turn off the main target device"

[action.brighter_main]
description = "Increase brightness by 10%"

[action.dimmer_main]
description = "Decrease brightness by 10%"

[action.warmer_main]
description = "Increase color temperature (warmer)"

[action.cooler_main]
description = "Decrease color temperature (cooler)"

[action.pair]
description = "Start Zigbee pairing mode"

[action.stop_pair]
description = "Stop Zigbee pairing mode"

[action.set_color_main]
description = "Apply the live color to the main target"

[action.set_brightness_main]
description = "Apply the live brightness to the main target"

[action.set_colortemp_main]
description = "Apply the live color temperature to the main target"

[action.reload]
description = "Reconnect to the Zigbee coordinator"

[action.light_on]
description = "Turn one light on"
input = { ieee = "string" }

[action.light_off]
description = "Turn one light off"
input = { ieee = "string" }

[action.set_light_color]
description = "Set one light's color"
input = { ieee = "string", value = "string" }

[action.set_light_brightness]
description = "Set one light's brightness, 1 to 100"
input = { ieee = "string", value = "number" }

[action.set_light_colortemp]
description = "Set one light's color temperature in mirek, 153 to 500"
input = { ieee = "string", value = "number" }

[action.remove_light]
description = "Make a light leave the network and forget it"
input = { ieee = "string" }

[action.add_preset]
description = "Save a light's current look as a preset"
input = { ieee = "string" }

[action.remove_preset]
description = "Delete a saved preset"
input = { id = "string" }

[action.set_preset_name]
description = "Rename a preset"
input = { id = "string", value = "string" }

[action.preset_power_on]
description = "Make a preset turn the light on"
input = { id = "string" }

[action.preset_power_off]
description = "Make a preset turn the light off"
input = { id = "string" }

[action.set_preset_color]
description = "Set a preset's color"
input = { id = "string", value = "string" }

[action.set_preset_brightness]
description = "Set a preset's brightness, 0 to 100"
input = { id = "string", value = "number" }

[action.set_preset_colortemp]
description = "Set a preset's color temperature in mirek, 153 to 500"
input = { id = "string", value = "number" }

[query.lights]
description = "Lights paired with the dongle, each with its power, color and brightness"
poll_interval_ms = 1000

[query.find_lights]
description = "Pairing state and the lights that joined during the current or last search"
poll_interval_ms = 500

[query.dongle]
description = "Whether the light dongle is connected, and on which port and channel"
poll_interval_ms = 3000

[query.presets]
description = "Saved presets, each with the look it applies"
poll_interval_ms = 1000

[query.light_options]
description = "Paired lights that can be the main light"
poll_interval_ms = 3000

[stream.live_color]
description = "Real-time color and brightness control"
throttle_ms = 100
