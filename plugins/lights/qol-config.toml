schema_version = 1
title = "Lights"
description = "Pair lights with your dongle and control the main light."

[section.lights]
label = "Lights"
description = "The lights paired with your dongle, and finding new ones."

[field.lights]
type = "list"
label = "Lights"
section = "lights"
query = "lights"
row_label = "{name}"
row_subtitle = "{detail}"
empty_message = "No lights paired. Find lights to pair one."
card_description = "Lights paired with your dongle."

[field.find_lights]
type = "list"
label = "Find lights"
description = "Search for new lights and pair them with your dongle."
section = "lights"
query = "find_lights"
row_label = "{name}"
row_subtitle = "{detail}"
items_label = "paired lights"
card_description = "lights that joined. reset a light to pair it."

[field.find_lights.lead]
label = "search"
description = "{description}"
row_label = "{label}"
row_subtitle = "{detail}"

[[field.find_lights.lead.actions]]
action = "reload"
label = "Find dongle"
when = "can_find"

[[field.find_lights.lead.actions]]
action = "stop_pair"
label = "Stop"
when = "can_stop"

[[field.find_lights.lead.actions]]
action = "pair"
label = "Search"
when = "can_start"

[[field.find_lights.lead.actions]]
action = "pair"
label = "Search again"
when = "can_search_again"

[[field.find_lights.row_actions]]
label = "Open"
description = "Shows the light in Lights."
when = "paired"
open = "lights"

[section.main_light]
label = "Main light"
description = "What the main light does now. The main light hotkeys drive the same light."

[field.main_target_id]
type = "select"
config_key = "main_target_id"
label = "Main light"
description = "The light these controls and the main light hotkeys drive. Needed once two or more lights are paired."
section = "main_light"
default = ""
query = "light_options"
lookup_label = "lights"
card_description = "The light these controls drive."

[field.toggle_power]
type = "action"
label = "Turn on or off"
description = "Switches the main light's power to the opposite of what it is now."
section = "main_light"
action = "toggle_main"
variant = "primary"

[field.live_color_hex]
type = "color"
config_key = "live_color_hex"
label = "Color"
description = "The color the main light glows."
section = "main_light"
default = "#FFFFFF"
stream = "live_color"

[field.live_brightness]
type = "number"
config_key = "live_brightness"
label = "Brightness"
description = "How bright the main light is."
section = "main_light"
default = 100
min = 1
max = 100
step = 1
variant = "slider"
stream = "live_color"
action = "set_brightness_main"

[field.live_mirek]
type = "number"
config_key = "live_mirek"
label = "Color temperature"
description = "How warm the main light's white is. 153 is coolest and 500 is warmest."
section = "main_light"
default = 300
min = 153
max = 500
step = 1
variant = "slider"
action = "set_colortemp_main"

[section.dongle]
label = "Dongle"
description = "The light dongle and the radio channel your lights use."

[field.dongle]
type = "list"
label = "Light dongle"
section = "dongle"
query = "dongle"
row_label = "{name}"
row_subtitle = "{detail}"
card_description = "The dongle your lights pair with."
items_label = "dongle"

[field.dongle.lead]
label = "dongle"
row_label = "{label}"
row_subtitle = "{detail}"

[[field.dongle.lead.actions]]
action = "reload"
label = "Find dongle"
when = "can_find"

[field.serial_port]
type = "string"
config_key = "backend.serial_port"
label = "Dongle port"
description = "The serial port your dongle is on. Leave it as auto to find the dongle by itself. Applies the next time the plugin connects to the dongle."
section = "dongle"
default = "auto"

[field.channel]
type = "number"
config_key = "backend.channel"
label = "Zigbee channel"
description = "The radio channel your lights use, from 11 to 26. Applies the next time the plugin connects to the dongle."
section = "dongle"
default = 11
min = 11
max = 26
step = 1

[section.preset_1]
label = "Preset 1"
description = "What the Preset 1 action does to the main light."

[field.preset_1_enabled]
type = "boolean"
config_key = "presets.preset_1.enabled"
label = "Enabled"
description = "A hotkey bound to a disabled preset shows an error instead of changing the light."
section = "preset_1"
default = false

[field.preset_1_name]
type = "string"
config_key = "presets.preset_1.name"
label = "Name"
description = "What this preset is called in error messages."
section = "preset_1"
default = "Preset 1"

[field.preset_1_power_on]
type = "boolean"
config_key = "presets.preset_1.power_on"
label = "Light on"
description = "Turn the main light on when the preset runs, or off when this is unchecked."
section = "preset_1"
default = true

[field.preset_1_brightness]
type = "number"
config_key = "presets.preset_1.brightness"
label = "Brightness"
description = "How bright the main light gets, from 0 to 100."
section = "preset_1"
default = 100
min = 0
max = 100
step = 1
variant = "slider"

[field.preset_1_color_hex]
type = "color"
config_key = "presets.preset_1.color_hex"
label = "Color"
description = "The color the main light glows."
section = "preset_1"
default = "#FFFFFF"

[field.preset_1_mirek]
type = "number"
config_key = "presets.preset_1.mirek"
label = "Color temperature"
description = "How warm the main light's white is. 153 is coolest and 500 is warmest."
section = "preset_1"
default = 300
min = 153
max = 500
step = 1
variant = "slider"

