schema_version = 1
title = "Lights"
description = "Turn lights on and off and change their color and brightness."

[section.connection]
label = "Connection"
description = "Your light dongle and the lights paired with it."

[section.controls]
label = "Controls"
description = "What every paired light does right now."

[field.coordinator_status]
type = "status"
label = "Dongle"
section = "connection"
query = "connection_status"
value_from = "state"
label_map = { ok = "Connected", offline = "Offline", no_target = "No dongle found" }
tone_map = { ok = "success", offline = "danger", no_target = "danger" }

[field.reconnect]
type = "action"
label = "Scan for dongle"
section = "connection"
action = "reload"
variant = "primary"
description = "Use after plugging in your light dongle."

[field.pair_device]
type = "action"
label = "Pair device"
section = "connection"
action = "pair"
variant = "primary"
description = "Needs a compatible light dongle plugged in."

[field.known_devices]
type = "list"
label = "Devices"
section = "connection"
query = "list_devices"
row_label = "{name}"
row_subtitle = "{address}"
empty_message = "No lights paired yet. Press Pair device to start."
card_description = "The lights paired with your dongle."

[field.toggle_power]
type = "action"
label = "Turn lights on or off"
description = "Switches the main light's power to the opposite of what it is now."
section = "controls"
action = "toggle_main"
variant = "primary"

[field.live_color_hex]
type = "color"
config_key = "live_color_hex"
label = "Color"
description = "Pick the color your lights glow."
section = "controls"
default = "#FFFFFF"
stream = "live_color"

[field.live_brightness]
type = "number"
config_key = "live_brightness"
label = "Brightness"
description = "Drag the knob to set how bright the lights are."
section = "controls"
default = 100
min = 1
max = 100
step = 1
variant = "slider"
stream = "live_color"
action = "set_brightness_main"
