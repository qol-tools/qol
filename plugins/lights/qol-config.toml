schema_version = 1
title = "Lights"
description = "Turn lights on and off and change their color and brightness."

[section.connection]
label = "Connection"
description = "Your light dongle and the lights paired with it."

[section.controls]
label = "Controls"
description = "What the main light does right now."

[section.advanced]
label = "Advanced"
description = "Only change these if Scan for dongle cannot find your dongle."

[field.coordinator_status]
type = "status"
label = "Dongle"
section = "connection"
query = "connection_status"
value_from = "state"
label_map = { ok = "Connected", offline = "Offline", no_target = "No dongle found" }
tone_map = { ok = "success", offline = "danger", no_target = "danger" }

[field.reconnect]
type = "action"
label = "Scan for dongle"
section = "connection"
action = "reload"
variant = "primary"
description = "Use after plugging in your light dongle."

[field.pair_device]
type = "action"
label = "Pair device"
section = "connection"
action = "pair"
variant = "primary"
description = "Needs a compatible light dongle plugged in."

[field.known_devices]
type = "list"
label = "Devices"
section = "connection"
query = "list_devices"
row_label = "{name}"
row_subtitle = "{address}"
empty_message = "No lights paired yet. Press Pair device to start."
card_description = "The lights paired with your dongle."

[field.main_target_id]
type = "select"
config_key = "main_target_id"
label = "Main light"
description = "The light that the controls below and the main light hotkeys drive. Needed once two or more lights are paired."
section = "controls"
default = ""
query = "light_options"
lookup_label = "lights"
card_description = "The light these controls drive."

[field.toggle_power]
type = "action"
label = "Turn main light on or off"
description = "Switches the main light's power to the opposite of what it is now."
section = "controls"
action = "toggle_main"
variant = "primary"

[field.live_color_hex]
type = "color"
config_key = "live_color_hex"
label = "Color"
description = "Pick the color the main light glows."
section = "controls"
default = "#FFFFFF"
stream = "live_color"

[field.live_brightness]
type = "number"
config_key = "live_brightness"
label = "Brightness"
description = "Drag the knob to set how bright the main light is."
section = "controls"
default = 100
min = 1
max = 100
step = 1
variant = "slider"
stream = "live_color"
action = "set_brightness_main"

[field.live_mirek]
type = "number"
config_key = "live_mirek"
label = "Color temperature"
description = "Drag the knob to set how warm the main light's white is. 153 is coolest and 500 is warmest."
section = "controls"
default = 300
min = 153
max = 500
step = 1
variant = "slider"
action = "set_colortemp_main"

[field.serial_port]
type = "string"
config_key = "backend.serial_port"
label = "Dongle port"
description = "The serial port your dongle is on. Leave it as auto to find the dongle by itself. Applies the next time the plugin connects to the dongle."
section = "advanced"
default = "auto"

[field.channel]
type = "number"
config_key = "backend.channel"
label = "Zigbee channel"
description = "The radio channel the lights use, from 11 to 26. Applies the next time the plugin connects to the dongle."
section = "advanced"
default = 11
min = 11
max = 26
step = 1

[section.preset_1]
label = "Preset 1"
description = "What the Preset 1 action does to the main light."

[field.preset_1_enabled]
type = "boolean"
config_key = "presets.preset_1.enabled"
label = "Enabled"
description = "A hotkey bound to a disabled preset shows an error instead of changing the light."
section = "preset_1"
default = false

[field.preset_1_name]
type = "string"
config_key = "presets.preset_1.name"
label = "Name"
description = "What this preset is called in error messages."
section = "preset_1"
default = "Preset 1"

[field.preset_1_power_on]
type = "boolean"
config_key = "presets.preset_1.power_on"
label = "Light on"
description = "Turn the main light on when the preset runs, or off when this is unchecked."
section = "preset_1"
default = true

[field.preset_1_brightness]
type = "number"
config_key = "presets.preset_1.brightness"
label = "Brightness"
description = "How bright the main light gets, from 0 to 100."
section = "preset_1"
default = 100
min = 0
max = 100
step = 1
variant = "slider"

[field.preset_1_color_hex]
type = "color"
config_key = "presets.preset_1.color_hex"
label = "Color"
description = "The color the main light glows."
section = "preset_1"
default = "#FFFFFF"

[field.preset_1_mirek]
type = "number"
config_key = "presets.preset_1.mirek"
label = "Color temperature"
description = "How warm the main light's white is. 153 is coolest and 500 is warmest."
section = "preset_1"
default = 300
min = 153
max = 500
step = 1
variant = "slider"

