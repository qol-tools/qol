schema_version = 1
title = "Lights"
description = "Pair lights with your dongle and control each one."

[section.lights]
label = "Lights"
description = "Zigbee lights this computer controls."

[field.find_lights]
type = "list"
label = "Find lights"
description = "Search for new lights and pair them with your dongle."
section = "lights"
query = "find_lights"
row_label = "{name}"
row_subtitle = "{detail}"
items_label = "paired lights"
card_description = "lights that joined this search."

[field.find_lights.lead]
label = "search"
description = "{description}"
row_label = "{label}"
row_subtitle = "{detail}"

[[field.find_lights.lead.actions]]
action = "reload"
label = "Find dongle"
when = "can_find"

[[field.find_lights.lead.actions]]
action = "stop_pair"
label = "Stop"
when = "can_stop"

[[field.find_lights.lead.actions]]
action = "pair"
label = "Search"
when = "can_start"

[[field.find_lights.lead.actions]]
action = "pair"
label = "Search again"
when = "can_search_again"

[field.dongle_page]
type = "page"
label = "Dongle"
description = "The USB stick that talks to your lights."
section = "lights"
query = "dongle"
value_from = "status"
tone_map = { "Not found" = "danger", "Offline" = "danger" }

[section.saved_lights]
label = "Saved lights"
description = "Lights paired with your dongle."

[field.lights]
type = "list"
label = "Saved lights"
section = "saved_lights"
inline = true
query = "lights"
row_label = "{name}"
row_subtitle = "{detail}"
row_swatch = "{color}"
empty_message = "No lights paired. Find lights to pair one."

[field.lights.row_toggle]
action = "light_on"
active_action = "light_off"
active_when = "on"
input = { ieee = "{ieee}" }

[[field.lights.row_controls]]
control = "switch"
label = "Power"
value_from = "on"
action = "light_on"
active_action = "light_off"
input = { ieee = "{ieee}" }

[[field.lights.row_controls]]
control = "color"
label = "Colour"
value_from = "color"
action = "set_light_color"
input = { ieee = "{ieee}", value = "{value}" }

[[field.lights.row_controls]]
control = "number"
label = "Brightness"
value_from = "brightness"
action = "set_light_brightness"
min = 1
max = 100
step = 1
unit = "%"
input = { ieee = "{ieee}", value = "{value}" }

[[field.lights.row_controls]]
control = "number"
label = "Colour temperature"
description = "153 is cool, 500 is warm."
value_from = "mirek"
action = "set_light_colortemp"
min = 153
max = 500
step = 1
input = { ieee = "{ieee}", value = "{value}" }

[[field.lights.row_actions]]
label = "Presets"
description = "Looks you switch to from the launcher or a hotkey."
when = "has_presets"
open = "presets"

[[field.lights.row_actions]]
action = "add_preset"
label = "Add a preset"
description = "Saves the light as it is now."
input = { ieee = "{ieee}" }

[[field.lights.row_actions]]
action = "remove_light"
label = "Remove this light"
description = "It has to pair again to come back."
tone = "danger"
input = { ieee = "{ieee}" }

[field.presets]
type = "list"
label = "Presets"
section = "saved_lights"
detached = true
query = "presets"
row_label = "{name}"
row_subtitle = "{detail}"
empty_message = "No presets saved."
card_description = "looks a hotkey switches to."

[[field.presets.row_controls]]
control = "text"
label = "Name"
value_from = "name"
action = "set_preset_name"
input = { id = "{id}", value = "{value}" }

[[field.presets.row_controls]]
control = "switch"
label = "Light on"
description = "Off makes this preset turn the light off."
value_from = "power_on"
action = "preset_power_on"
active_action = "preset_power_off"
input = { id = "{id}" }

[[field.presets.row_controls]]
control = "color"
label = "Colour"
value_from = "color"
action = "set_preset_color"
input = { id = "{id}", value = "{value}" }

[[field.presets.row_controls]]
control = "number"
label = "Brightness"
value_from = "brightness"
action = "set_preset_brightness"
min = 0
max = 100
step = 1
unit = "%"
input = { id = "{id}", value = "{value}" }

[[field.presets.row_controls]]
control = "number"
label = "Colour temperature"
description = "153 is cool, 500 is warm."
value_from = "mirek"
action = "set_preset_colortemp"
min = 153
max = 500
step = 1
input = { id = "{id}", value = "{value}" }

[[field.presets.row_actions]]
action = "remove_preset"
label = "Remove this preset"
description = "Deletes this saved look."
tone = "danger"
input = { id = "{id}" }

[field.main_target_id]
type = "select"
config_key = "main_target_id"
label = "Main light"
description = "The light the main light hotkeys and presets drive. Needed once two or more lights are paired."
section = "saved_lights"
hidden = true
default = ""
query = "light_options"
lookup_label = "lights"
card_description = "The light these controls drive."

[field.live_color_hex]
type = "color"
config_key = "live_color_hex"
label = "Color"
description = "The color a light with no stored look starts from."
section = "saved_lights"
hidden = true
default = "#FFFFFF"

[field.live_brightness]
type = "number"
config_key = "live_brightness"
label = "Brightness"
description = "The brightness a light with no stored look starts from."
section = "saved_lights"
hidden = true
default = 100
min = 1
max = 100
step = 1

[field.live_mirek]
type = "number"
config_key = "live_mirek"
label = "Color temperature"
description = "The color temperature a light with no stored look starts from."
section = "saved_lights"
hidden = true
default = 300
min = 153
max = 500
step = 1

[section.dongle]
label = "Dongle"
description = "The port and radio channel your lights use."
page = "dongle_page"

[field.serial_port]
type = "string"
config_key = "backend.serial_port"
label = "Port"
description = "Auto finds the dongle on any port. Applies the next time the plugin connects to the dongle."
section = "dongle"
default = "auto"

[field.channel]
type = "number"
config_key = "backend.channel"
label = "Zigbee channel"
description = "The radio channel your lights use, from 11 to 26. Applies the next time the plugin connects to the dongle."
section = "dongle"
default = 11
min = 11
max = 26
step = 1

[field.find_dongle]
type = "action"
label = "Find dongle"
description = "Looks for the dongle on every port again."
section = "dongle"
action = "reload"

[field.preset_1_enabled]
type = "boolean"
