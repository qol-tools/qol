[plugin]
id = "qol-lights"
uid = "368871df-de60-4a7a-ab7c-8d33fcd22511"
name = "Lights"
icon = "lights"
description = "Control your lights from your computer"
version = "1.86.0"
author = "KMRH47"
platforms = ["linux", "macos", "windows"]

[config.scope]
live_color_hex = "core"
live_brightness = "core"
live_mirek = "core"
main_target_id = "device"
"backend.serial_port" = "device"
"backend.channel" = "device"
presets = "core"

[runtime]
command = "qol-lights"

[action.toggle_main]
label = "Toggle Main Light"
args = ["toggle_main"]

[action.on_main]
label = "Turn Main Light On"
args = ["on_main"]

[action.off_main]
label = "Turn Main Light Off"
args = ["off_main"]

[action.brighter_main]
label = "Brighten Main Light"
args = ["brighter_main"]

[action.dimmer_main]
label = "Dim Main Light"
args = ["dimmer_main"]

[action.warmer_main]
label = "Warm Main Light"
args = ["warmer_main"]

[action.cooler_main]
label = "Cool Main Light"
args = ["cooler_main"]

[action.preset_1]
label = "Preset 1"
args = ["preset_1"]

[action.preset_2]
label = "Preset 2"
args = ["preset_2"]

[action.preset_3]
label = "Preset 3"
args = ["preset_3"]

[action.preset_4]
label = "Preset 4"
args = ["preset_4"]

[action.preset_5]
label = "Preset 5"
args = ["preset_5"]

[action.preset_6]
label = "Preset 6"
args = ["preset_6"]

[action.preset_7]
label = "Preset 7"
args = ["preset_7"]

[action.preset_8]
label = "Preset 8"
args = ["preset_8"]

[action.settings]
label = "Settings"
kind = "settings"
picture = "gear"
args = ["settings"]

[action.pair]
label = "Pair Device"
args = ["pair"]

[action.stop_pair]
label = "Stop Pairing"
args = ["stop_pair"]

[action.set_color_main]
label = "Set Main Light Color"
args = ["set_color_main"]

[action.set_brightness_main]
label = "Set Main Light Brightness"
args = ["set_brightness_main"]

[action.set_colortemp_main]
label = "Set Main Light Color Temperature"
args = ["set_colortemp_main"]

[action.reload]
label = "Reconnect"
args = ["reload"]

[action.light_on]
label = "Turn a Light On"
args = ["light_on"]

[action.light_off]
label = "Turn a Light Off"
args = ["light_off"]

[action.set_light_color]
label = "Set a Light's Color"
args = ["set_light_color"]

[action.set_light_brightness]
label = "Set a Light's Brightness"
args = ["set_light_brightness"]

[action.set_light_colortemp]
label = "Set a Light's Color Temperature"
args = ["set_light_colortemp"]

[action.remove_light]
label = "Remove a Light"
args = ["remove_light"]

[action.add_preset]
label = "Add a Preset"
args = ["add_preset"]

[action.remove_preset]
label = "Remove a Preset"
args = ["remove_preset"]

[action.set_preset_name]
label = "Rename a Preset"
args = ["set_preset_name"]

[action.preset_power_on]
label = "Make a Preset Turn the Light On"
args = ["preset_power_on"]

[action.preset_power_off]
label = "Make a Preset Turn the Light Off"
args = ["preset_power_off"]

[action.set_preset_color]
label = "Set a Preset's Color"
args = ["set_preset_color"]

[action.set_preset_brightness]
label = "Set a Preset's Brightness"
args = ["set_preset_brightness"]

[action.set_preset_colortemp]
label = "Set a Preset's Color Temperature"
args = ["set_preset_colortemp"]

[capabilities]
gpui = true
doctor = true
serial = true
headless = true

[daemon]
enabled = true
command = "qol-lights"
inherit_listener = true
socket = "/tmp/plugin-lights.sock"
port = 42710

[menu]
label = "Lights"
items = []

[traits.confined]

[traits.peripheral-preview]
neighbors = 1

[traits.atmosphere]
preset = "wood"

[[dependencies.binaries]]
name = "qol-lights"
repo = "qol-tools/qol-lights"
pattern = "qol-lights-{os}-{arch}"
