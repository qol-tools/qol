[package]
name = "plugin-claude-sessions"
version = "0.1.0"
edition = "2021"
description = "Resolve Claude Code PIDs to their active session jsonl for qol-tray workspace restore"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
anyhow = "1"
thiserror = "1"
serde_json = "1.0"
qol-plugin-api.workspace = true
qol-runtime.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
