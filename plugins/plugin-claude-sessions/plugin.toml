[plugin]
name = "Claude Sessions"
description = "Resume Claude Code sessions after a qol-tray workspace reboot"
version = "1.0.0"
author = "qol-tools"
platforms = ["linux", "macos"]

[runtime]
command = "plugin-claude-sessions"
actions = { run = ["run"] }

[menu]
label = "Claude Sessions"
items = [
    { type = "action", id = "run", label = "Run", action = "run" },
]

[[dependencies.binaries]]
name = "plugin-claude-sessions"
repo = "qol-tools/plugin-claude-sessions"
pattern = "plugin-claude-sessions-{os}-{arch}"

[capabilities.restore-rule]
templates = ["claude-session"]
pane-fields = ["foreground.exe", "foreground.pid", "foreground.cwd"]
