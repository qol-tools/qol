schema_version = 1
title = "Shot"
description = "Audio and video capture defaults for screen recordings."

[section.audio]
label = "Audio"
description = "Audio inputs and device sources used during recording."
actions = ["record"]

[field.audio_enabled]
type = "boolean"
config_key = "audio.enabled"
label = "Enable audio"
description = "Record sound along with the screen."
section = "audio"
default = true

[field.audio_inputs]
type = "string_array"
config_key = "audio.inputs"
label = "Audio inputs"
description = "Choose whether recordings include your microphone, system sound, or both."
section = "audio"
platforms = ["linux", "windows"]
placeholder = "mic"
default = ["mic"]
card_description = "What recordings capture."
options = ["mic", "system"]

[field.audio_inputs.option_labels]
mic = "Microphone"
system = "System audio"

[field.audio_inputs.option_pictures]
mic = "mic-default"
system = "speaker-default"

[field.audio_mic_device]
type = "select"
config_key = "audio.mic_device"
label = "Microphone"
description = "The microphone used for recordings."
section = "audio"
platforms = ["linux", "windows"]
default = "default"
query = "audio_sources"
lookup_label = "microphones"
card_description = "The microphone recordings use."

[field.audio_mic_device.option_labels]
default = "System default"

[field.audio_mic_device.option_pictures]
default = "mic-default"

[field.audio_system_device]
type = "select"
config_key = "audio.system_device"
label = "System audio output"
description = "The speakers or headphones whose sound is recorded."
section = "audio"
platforms = ["linux", "windows"]
default = "default"
query = "audio_sinks"
lookup_label = "outputs"
card_description = "The output that recordings capture."

[field.audio_system_device.option_labels]
default = "System default"

[field.audio_system_device.option_pictures]
default = "speaker-default"

[section.video]
label = "Video"
description = "Encoding defaults for the recording output."
actions = ["record"]

[field.video_crf]
type = "number"
variant = "slider"
config_key = "video.crf"
label = "Video quality"
description = "Lower looks better but makes bigger files. 0 is lossless."
section = "video"
default = 18
min = 0
max = 51
step = 1

[field.video_preset]
type = "select"
config_key = "video.preset"
label = "Encoding speed"
description = "Slower settings make smaller files at the same quality. Not used for WebM."
section = "video"
default = "veryfast"
card_description = "Encoding speed against file size."
options = ["ultrafast", "superfast", "veryfast", "faster", "fast", "medium", "slow", "slower", "veryslow"]

[field.video_preset.option_pictures]
ultrafast = "preset:100,100"
superfast = "preset:88,92"
veryfast = "preset:76,84"
faster = "preset:64,78"
fast = "preset:54,72"
medium = "preset:44,66"
slow = "preset:33,60"
slower = "preset:22,56"
veryslow = "preset:12,52"

[field.video_framerate]
type = "number"
config_key = "video.framerate"
label = "Frame rate"
description = "How many frames per second recordings capture."
section = "video"
platforms = ["linux", "windows"]
default = 60
min = 1
max = 240
step = 1

[field.video_format]
type = "select"
config_key = "video.format"
label = "Format"
description = "MP4 and MOV play almost everywhere. WebM suits sharing on the web."
section = "video"
default = "mov"
card_description = "The file type recordings save as."
options = ["mkv", "mp4", "mov", "webm"]

[field.video_format.option_pictures]
mkv = "format:MKV"
mp4 = "format:MP4"
mov = "format:MOV"
webm = "format:WEBM"

[section.capture]
label = "Capture"
description = "How you pick an area to capture and how screenshots are shown afterwards."
actions = ["screenshot", "record"]

[field.capture_include_window_frame]
type = "boolean"
config_key = "capture.include_window_frame"
label = "Include window frame"
description = "Include the title bar and borders when capturing a window."
section = "capture"
platforms = ["linux", "windows"]
default = true

[field.capture_pin_border]
type = "boolean"
config_key = "capture.pin_border"
label = "Pinned preview border"
description = "Draw a thin border around pinned screenshots so they stand out from the screen."
section = "capture"
default = true

[field.capture_open_folder_after_save]
type = "boolean"
config_key = "capture.open_folder_after_save"
label = "Open folder after saving"
description = "Open the folder once you finish a saved capture preview."
section = "capture"
default = false

[section.shortcuts]
label = "Preview"
description = "Which buttons come first on screenshot previews."
actions = ["preview"]

[field.shortcuts_copy_command]
type = "select"
config_key = "shortcuts.copy_command"
label = "Default copy action"
description = "Choose whether Copy image or Copy path comes first and is selected on screenshot previews."
section = "shortcuts"
default = "copy_image"
card_description = "Which copy button comes first."
options = ["copy_image", "copy_path"]

[field.shortcuts_copy_command.option_labels]
copy_image = "Copy image"
copy_path = "Copy path"

[field.shortcuts_copy_command.option_pictures]
copy_image = "copy-image"
copy_path = "copy-path"

[window]
title_bar = true
