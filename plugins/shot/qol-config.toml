schema_version = 1
title = "QoL Shot"
description = "Audio and video capture defaults for screen recordings."

[section.audio]
label = "Audio"
description = "Audio inputs and device sources used during recording."
actions = ["record"]

[field.audio_enabled]
type = "boolean"
config_key = "audio.enabled"
label = "Enable Audio"
description = "macOS captures the default microphone only; explicit input choices are Linux-only."
section = "audio"
default = true

[field.audio_inputs]
type = "string_array"
config_key = "audio.inputs"
label = "Audio Inputs"
description = "Linux-only PulseAudio inputs."
section = "audio"
placeholder = "mic"
default = ["mic"]
options = ["mic", "system"]

[field.audio_inputs.option_labels]
mic = "Microphone"
system = "System Audio"

[field.audio_mic_device]
type = "select"
config_key = "audio.mic_device"
label = "Mic Device"
description = "Linux-only PulseAudio capture source."
section = "audio"
default = "default"
query = "audio_sources"
lookup_label = "microphones"
card_description = "The microphone recordings use."

[field.audio_mic_device.option_labels]
default = "System Default"

[field.audio_mic_device.option_pictures]
default = "mic-default"

[field.audio_system_device]
type = "select"
config_key = "audio.system_device"
label = "System Device"
description = "Linux-only PulseAudio output whose monitor is recorded."
section = "audio"
default = "default"
query = "audio_sinks"
lookup_label = "outputs"
card_description = "The output that recordings capture."

[field.audio_system_device.option_labels]
default = "System Default"

[field.audio_system_device.option_pictures]
default = "speaker-default"

[section.video]
label = "Video"
description = "Encoding defaults for the recording output."
actions = ["record"]

[field.video_crf]
type = "number"
variant = "slider"
config_key = "video.crf"
label = "CRF"
description = "Used by Linux capture and macOS ffmpeg conversion. Native MOV and avconvert ignore this."
section = "video"
default = 18
min = 0
max = 51
step = 1

[field.video_preset]
type = "select"
config_key = "video.preset"
label = "Preset"
description = "Used by Linux capture and macOS ffmpeg conversion for H.264 outputs."
section = "video"
default = "veryfast"
card_description = "Encoding speed against file size."
options = ["ultrafast", "superfast", "veryfast", "faster", "fast", "medium", "slow", "slower", "veryslow"]

[field.video_preset.option_pictures]
ultrafast = "preset:100,100"
superfast = "preset:88,92"
veryfast = "preset:76,84"
faster = "preset:64,78"
fast = "preset:54,72"
medium = "preset:44,66"
slow = "preset:33,60"
slower = "preset:22,56"
veryslow = "preset:12,52"

[field.video_framerate]
type = "number"
config_key = "video.framerate"
label = "Framerate"
description = "Linux-only. macOS screencapture does not expose a framerate setting."
section = "video"
default = 60
min = 1
max = 240
step = 1

[field.video_format]
type = "select"
config_key = "video.format"
label = "Format"
description = "macOS records natively as MOV, then converts after stop when needed."
section = "video"
default = "mov"
card_description = "The file type recordings save as."
options = ["mkv", "mp4", "mov", "webm"]

[field.video_format.option_pictures]
mkv = "format:MKV"
mp4 = "format:MP4"
mov = "format:MOV"
webm = "format:WEBM"

[section.capture]
label = "Capture"
description = "Region selector behavior and screenshot previews."
actions = ["screenshot", "record"]

[field.capture_include_window_frame]
type = "boolean"
config_key = "capture.include_window_frame"
label = "Include Window Frame"
description = "Linux-only. Include the title bar and borders when capturing a detected window. Disable to capture the client area only."
section = "capture"
default = true

[field.capture_pin_border]
type = "boolean"
config_key = "capture.pin_border"
label = "Pinned Preview Border"
description = "Draw a thin border around pinned screenshot previews to keep them distinct from the screen behind them."
section = "capture"
default = true

[field.capture_open_folder_after_save]
type = "boolean"
config_key = "capture.open_folder_after_save"
label = "Open Folder After Saving"
description = "Open the containing folder after you finish a saved capture preview. Completion notifications remain clickable when disabled."
section = "capture"
default = false

[section.shortcuts]
label = "Preview"
description = "Action ordering in screenshot thumbnail previews."
actions = ["preview"]

[field.shortcuts_copy_command]
type = "select"
config_key = "shortcuts.copy_command"
label = "Default Copy Action"
description = "Choose whether Copy Image or Copy Path appears first and starts selected in screenshot thumbnails."
section = "shortcuts"
default = "copy_image"
card_description = "Which copy button comes first."
options = ["copy_image", "copy_path"]

[field.shortcuts_copy_command.option_labels]
copy_image = "Copy Image"
copy_path = "Copy Path"

[field.shortcuts_copy_command.option_pictures]
copy_image = "copy-image"
copy_path = "copy-path"
