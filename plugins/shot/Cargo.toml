[package]
name = "qol-shot"
version = "1.83.1"
edition = "2021"

[dependencies]
log.workspace = true
qol-log.workspace = true
anyhow = "1"
qol-apps.workspace = true
qol-color.workspace = true
qol-config.workspace = true
qol-conventions.workspace = true
qol-fs.workspace = true
qol-plugin-daemon.workspace = true
qol-headless.workspace = true
qol-process.workspace = true
qol-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs = "6.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
gpui.workspace = true
qol-cinnamon.workspace = true
qol-gpui.workspace = true
qol-hotkeys.workspace = true
qol-platform.workspace = true
qol-plugin-api.workspace = true
smallvec = "1.13"
workspace-hack.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
qol-audio.workspace = true
x11rb = { workspace = true, features = ["shm", "xfixes"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
qol-audio.workspace = true
qol-windowing.workspace = true
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
qol-conventions.workspace = true

[dev-dependencies]
toml.workspace = true

[lints]
workspace = true
