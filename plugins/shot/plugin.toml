[plugin]
id = "qol-shot"
uid = "e8208e3e-58b3-4f8c-ad4b-ddbecafa3375"
name = "Shot"
icon = "shot"
description = "Capture screenshots and record screen regions"
version = "1.102.3"
author = "KMRH47"
platforms = ["linux", "macos", "windows"]

[config]
default_scope = "os"

[config.scope]
audio = "os"
"audio.mic_device" = "device"
"audio.system_device" = "device"
video = "os"
capture = "os"
shortcuts = "os"

[runtime]
command = "qol-shot"

[action.record]
label = "Start/Stop Recording"
args = ["record"]

[action.screenshot]
label = "Take Screenshot"
args = ["screenshot"]

[action.preview]
label = "Preview Last Screenshot"
args = ["preview"]

[action.copy]
label = "Copy Screenshot"
args = ["copy"]

[action.copy-path]
label = "Copy Screenshot Path"
args = ["copy-path"]

[action.settings]
label = "Settings"
kind = "settings"
picture = "gear"
args = ["settings"]

[capabilities]
gpui = true
doctor = true
permissions = ["screen-capture"]

[menu]
label = "Shot"
items = []

[daemon]
enabled = true
inherit_listener = true
command = "qol-shot"
socket = "/tmp/qol-shot.sock"

[[dependencies.binaries]]
name = "qol-shot"
repo = "qol-tools/qol-shot"
pattern = "qol-shot-{os}-{arch}"
