[package]
name = "qol-voice"
version = "0.4.2"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
futures-util = { version = "0.3", features = ["sink"] }
qol-apps.workspace = true
qol-config.workspace = true
qol-conventions.workspace = true
qol-headless.workspace = true
qol-plugin-daemon.workspace = true
qol-runtime.workspace = true
qol-terminal-sessions.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.35", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = "0.30.0"

[target.'cfg(target_os = "linux")'.dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }

[build-dependencies]
qol-conventions.workspace = true

[dev-dependencies]
qol-plugin-api.workspace = true
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
