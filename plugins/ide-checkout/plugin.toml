[plugin]
id = "qol-ide-checkout"
uid = "b61195c4-a0a8-4be5-a507-9aeb45edb060"
name = "IDE Checkout"
description = "Local HTTP API for a browser extension to check out a git branch and open it in a configured app"
version = "1.42.0"
author = "KMRH47"
platforms = ["macos", "linux"]

[runtime]
command = "qol-ide-checkout"

[capabilities]
doctor = true
gpui = true

[action.status]
label = "Status"
args = ["status"]

[action.settings]
label = "Settings"
kind = "settings"
picture = "gear"
args = ["settings"]

[menu]
label = "IDE Checkout"
items = []

[daemon]
enabled = true
command = "qol-ide-checkout"
inherit_listener = true
port = 42720

[[dependencies.binaries]]
name = "qol-ide-checkout"
repo = "qol-tools/qol-ide-checkout"
pattern = "qol-ide-checkout-{os}-{arch}"
