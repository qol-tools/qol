[plugin]
id = "plugin-ide-checkout"
uid = "b61195c4-a0a8-4be5-a507-9aeb45edb060"
name = "IDE Checkout"
description = "Local HTTP API for a browser extension to check out a git branch and open it in a configured app"
version = "1.27.0"
author = "KMRH47"
platforms = ["macos", "linux"]

[runtime]
command = "task-runner"

[capabilities]
doctor = true
gpui = true

[action.status]
label = "Status"
args = ["status"]

[action.settings]
label = "Settings"
kind = "settings"
args = ["settings"]

[menu]
label = "IDE Checkout"
items = []

[daemon]
enabled = true
command = "task-runner"
port = 42720

[[dependencies.binaries]]
name = "task-runner"
repo = "qol-tools/plugin-ide-checkout"
pattern = "task-runner-{os}-{arch}"
