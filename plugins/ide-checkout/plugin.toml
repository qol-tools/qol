[plugin]
id = "qol-ide-checkout"
uid = "b61195c4-a0a8-4be5-a507-9aeb45edb060"
name = "IDE Checkout"
icon = "ide-checkout"
description = "Check out a git branch from your browser and open it in your editor."
version = "1.69.0"
author = "KMRH47"
platforms = ["macos", "linux", "windows"]

[config.scope]
tempDir = "device"
apps = "core"

[runtime]
command = "qol-ide-checkout"

[capabilities]
doctor = true
gpui = true

[action.status]
label = "Status"
args = ["status"]

[action.settings]
label = "Settings"
kind = "settings"
picture = "gear"
args = ["settings"]

[menu]
label = "IDE Checkout"
items = []

[daemon]
enabled = true
command = "qol-ide-checkout"
inherit_listener = true
port = 42720

[[dependencies.binaries]]
name = "qol-ide-checkout"
repo = "qol-tools/qol-ide-checkout"
pattern = "qol-ide-checkout-{os}-{arch}"
