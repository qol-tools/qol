[plugin]
name = "Launcher"
description = "Universal search with action modifiers"
version = "0.1.2"
author = "KMRH47"

[runtime]
command = "run.sh"
actions = { open = ["open"] }

[daemon]
enabled = true
command = "launcher"
socket = "/tmp/qol-launcher.sock"

[menu]
label = "Launcher"
items = [
    { type = "action", id = "open", label = "Open Launcher", action = "run" },
]

[[dependencies.binaries]]
name = "launcher"
repo = "qol-tools/plugin-launcher"
pattern = "launcher-{os}-{arch}"
