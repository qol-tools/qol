[plugin]
id = "plugin-launcher"
uid = "5cc75f62-2e3b-463c-ac7b-ae269cff1ef1"
name = "Launcher"
description = "Universal search with action modifiers"
version = "1.24.1"
author = "KMRH47"
platforms = ["linux", "macos"]

[runtime]
command = "launcher"

[action.open]
label = "Open Launcher"
args = ["--show"]

[daemon]
enabled = true
command = "launcher"
socket = "/tmp/qol-launcher.sock"

[capabilities]
gpui = true

[menu]
label = "Launcher"
items = []

[[dependencies.binaries]]
name = "launcher"
repo = "qol-tools/plugin-launcher"
pattern = "launcher-{os}-{arch}"
