schema_version = 1
title = "Launcher"
description = "Universal search with action modifiers."

[section.launcher]
label = "Launcher"
description = "Universal search with action modifiers."
actions = ["open"]

[section.monitor]
label = "Monitor Tracking"
description = "Cursor polling behavior for launcher popup positioning."

[field.poll_min_ms]
type = "number"
section = "monitor"
config_key = "monitor.poll_min_ms"
label = "Poll Min (ms)"
description = "Lower values react faster but use more CPU."
default = 16
min = 8
max = 100
step = 1

[field.poll_max_ms]
type = "number"
section = "monitor"
config_key = "monitor.poll_max_ms"
label = "Poll Max (ms)"
description = "Upper bound for idle polling backoff."
default = 500
min = 200
max = 2000
step = 1

[field.commit_threshold_ms]
type = "number"
section = "monitor"
config_key = "monitor.commit_threshold_ms"
label = "Commit Threshold (ms)"
description = "Cursor movement updates become committed once polling reaches this interval."
default = 128
min = 50
max = 500
step = 1

[field.strategy]
type = "select"
section = "monitor"
config_key = "monitor.strategy"
label = "Strategy"
description = "Basic uses fixed half/double steps. Momentum adapts ramp speed based on streaks."
default = "basic"
options = ["basic", "momentum"]

[field.strategy.option_labels]
basic = "Basic"
momentum = "Momentum"

[section.appearance]
label = "Appearance"
description = "Debug visualisation for the hidden launcher ghost window."
actions = ["open"]

[field.display_ghost_opacity]
type = "number"
config_key = "display.ghost_opacity"
label = "Ghost Opacity (debug)"
description = "Opacity of the hidden launcher window in debug builds. 0 = invisible."
section = "appearance"
default = 0.0
min = 0.0
max = 1.0
step = 0.05

[field.display_ghost_debug_color]
type = "string"
config_key = "display.ghost_debug_color"
label = "Ghost Color (debug)"
description = "Background hex color of the hidden launcher window in debug builds."
section = "appearance"
placeholder = "00ff00"
default = "00ff00"
