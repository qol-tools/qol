[package]
name = "launcher"
version = "1.27.1"
edition = "2021"
description = "Application and file launcher plugin for QoL Tray"
license = "PolyForm-Noncommercial-1.0.0"
autoexamples = false

[features]
examples = []

[dependencies]
gpui.workspace = true
serde.workspace = true
notify = { version = "8", default-features = false, features = [
  "macos_fsevent",
] }
qol-plugin-daemon.workspace = true
qol-gpui.workspace = true
qol-runtime.workspace = true
qol-search.workspace = true
qol-frecency.workspace = true
qol-apps.workspace = true
qol-platform.workspace = true
qol-process.workspace = true
qol-config.workspace = true
qol-conventions.workspace = true
toml.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-app-kit = { workspace = true, features = [
  "NSApplication",
  "NSEvent",
  "NSWindow",
  "block2",
] }

[build-dependencies]
qol-conventions.workspace = true

[dev-dependencies]
proptest = "1.0"
qol-plugin-api.workspace = true

[[example]]
name = "01_minimal_window"
required-features = ["examples"]

[[example]]
name = "02_borderless_popup"
required-features = ["examples"]

[[example]]
name = "03_dynamic_resize"
required-features = ["examples"]

[[example]]
name = "04_text_input"
required-features = ["examples"]

[[example]]
name = "05_list_selection"
required-features = ["examples"]

[[example]]
name = "06_blur_detection"
required-features = ["examples"]

[[example]]
name = "07_hide_show"
required-features = ["examples"]

[[example]]
name = "08_scrollable_list"
required-features = ["examples"]

[[example]]
name = "09_filtered_list"
required-features = ["examples"]

[[example]]
name = "10_icons"
required-features = ["examples"]

[[example]]
name = "11_sections"
required-features = ["examples"]

[[example]]
name = "12_async_loading"
required-features = ["examples"]

[[example]]
name = "13_frecency_ranking"
required-features = ["examples"]

[[example]]
name = "14_fuzzy_match"
required-features = ["examples"]

[[example]]
name = "15_action_modifiers"
required-features = ["examples"]
