[package]
name = "launcher"
version = "1.4.2"
edition = "2021"
description = "Application and file launcher plugin for QoL Tray"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
gpui = { version = "0.2", features = ["test-support"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = { version = "8", default-features = false, features = [
  "macos_fsevent",
] }
qol-plugin-api = { git = "https://github.com/qol-tools/qol-plugin-api" }
qol-search = { git = "https://github.com/qol-tools/qol-search" }
qol-frecency = { git = "https://github.com/qol-tools/qol-frecency" }
qol-platform = { git = "https://github.com/qol-tools/qol-platform" }

[target.'cfg(target_os = "linux")'.dependencies]
shell-words = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSObject"] }
objc2-app-kit = { version = "0.3", features = [
  "NSApplication",
  "NSRunningApplication",
] }

[dev-dependencies]
proptest = "1.0"
qol-tray = { git = "https://github.com/qol-tools/qol-tray" }
toml = "0.9.8"

# macOS only: fix zed-font-kit core-graphics version mismatch (harmless on Linux)
# https://github.com/zed-industries/zed/issues/47168
[patch.crates-io]
core-text = { git = "https://github.com/servo/core-foundation-rs", tag = "core-text-v21.0.0" }
core-graphics = { git = "https://github.com/servo/core-foundation-rs", tag = "core-text-v21.0.0" }
core-foundation = { git = "https://github.com/servo/core-foundation-rs", tag = "core-text-v21.0.0" }
core-foundation-sys = { git = "https://github.com/servo/core-foundation-rs", tag = "core-text-v21.0.0" }
