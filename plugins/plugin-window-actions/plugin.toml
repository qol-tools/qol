[plugin]
id = "plugin-window-actions"
uid = "9fb4b550-714a-4723-b342-7a62c766cf56"
name = "Window Actions"
description = "Window snapping, centering, and multi-monitor management"
version = "2.17.0"
author = "KMRH47"
platforms = ["linux", "macos"]

[runtime]
command = "window-actions"

[action.snap-left]
label = "Snap Left"
args = ["snap-left"]

[action.snap-right]
label = "Snap Right"
args = ["snap-right"]

[action.snap-bottom]
label = "Snap Bottom"
args = ["snap-bottom"]

[action.maximize]
label = "Maximize"
args = ["maximize"]

[action.minimize]
label = "Minimize"
args = ["minimize"]

[action.restore]
label = "Restore"
args = ["restore"]

[action.center]
label = "Center"
args = ["center"]

[action.move-monitor-left]
label = "Move to Left Monitor"
args = ["move-monitor-left"]

[action.move-monitor-right]
label = "Move to Right Monitor"
args = ["move-monitor-right"]

[action.glide-left]
label = "Glide Left"
args = ["glide-left"]
continuous = true

[action.glide-right]
label = "Glide Right"
args = ["glide-right"]
continuous = true

[action.glide-up]
label = "Glide Up"
args = ["glide-up"]
continuous = true

[action.glide-down]
label = "Glide Down"
args = ["glide-down"]
continuous = true

[daemon]
enabled = true
command = "window-actions"
socket = "/tmp/qol-window-actions.sock"

[menu]
label = "Window Actions"
items = []

[[dependencies.binaries]]
name = "window-actions"
repo = "qol-tools/plugin-window-actions"
pattern = "window-actions-{os}-{arch}"
