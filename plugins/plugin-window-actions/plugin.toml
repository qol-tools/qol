[plugin]
id = "plugin-window-actions"
name = "Window Actions"
description = "Window snapping, centering, and multi-monitor management"
version = "2.0.7"
author = "KMRH47"
platforms = ["linux", "macos"]

[runtime]
command = "window-actions"

[runtime.actions]
snap-left = ["snap-left"]
snap-right = ["snap-right"]
snap-bottom = ["snap-bottom"]
maximize = ["maximize"]
minimize = ["minimize"]
restore = ["restore"]
center = ["center"]
move-monitor-left = ["move-monitor-left"]
move-monitor-right = ["move-monitor-right"]

[menu]
label = "Window Actions"
items = [
    { type = "action", id = "snap-left", label = "Snap Left", action = "run" },
    { type = "action", id = "snap-right", label = "Snap Right", action = "run" },
    { type = "action", id = "snap-bottom", label = "Snap Bottom", action = "run" },
    { type = "action", id = "maximize", label = "Maximize", action = "run" },
    { type = "action", id = "minimize", label = "Minimize", action = "run" },
    { type = "action", id = "restore", label = "Restore", action = "run" },
    { type = "action", id = "center", label = "Center", action = "run" },
    { type = "action", id = "move-monitor-left", label = "Move to Left Monitor", action = "run" },
    { type = "action", id = "move-monitor-right", label = "Move to Right Monitor", action = "run" },
]

[[dependencies.binaries]]
name = "window-actions"
repo = "qol-tools/plugin-window-actions"
pattern = "window-actions-{os}-{arch}"
