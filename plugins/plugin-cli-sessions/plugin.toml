[plugin]
id = "plugin-cli-sessions"
name = "CLI Sessions"
description = "Always-on-top overview of live CLI sessions (Claude Code, Codex, any command)"
version = "0.1.0"
author = "KMRH47"
platforms = ["linux", "macos"]

[runtime]
command = "cli-sessions"
actions = { open = ["open"], next = ["next"], snapshot = ["snapshot"] }

[capabilities]
gpui = true

[menu]
label = "CLI Sessions"
items = [
    { type = "action", id = "open", label = "Open Overview", action = "run" },
    { type = "action", id = "next", label = "Jump to Next Alert", action = "run" },
    { type = "action", id = "snapshot", label = "Snapshot All Sessions", action = "run" },
]

[[shortcuts]]
id = "open"
name = "CLI Sessions"
action = "open"
export_to_launcher = true

[[shortcuts]]
id = "next"
name = "CLI Sessions: Next Alert"
action = "next"
export_to_launcher = true

[[shortcuts]]
id = "snapshot"
name = "CLI Sessions: Snapshot All"
action = "snapshot"
export_to_launcher = true

[[dependencies.binaries]]
name = "cli-sessions"
repo = "qol-tools/plugin-cli-sessions"
pattern = "cli-sessions-{os}-{arch}"
