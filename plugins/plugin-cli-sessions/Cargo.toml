[package]
name = "plugin-cli-sessions"
version = "0.3.1"
edition = "2021"
description = "Always-on-top overview of live CLI sessions (Claude Code, Codex, any command) for QoL Tray"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "cli-sessions"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
gpui.workspace = true
qol-gpui.workspace = true
qol-plugin-daemon.workspace = true
qol-runtime.workspace = true
qol-config.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
qol-conventions.workspace = true

[dev-dependencies]
proptest = "1"
qol-plugin-api.workspace = true
toml = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
