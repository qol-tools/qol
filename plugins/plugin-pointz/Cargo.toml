[package]
name = "pointzerver"
version = "1.17.0"
edition = "2021"
description = "PointZerver - Headless server for remote PC control from mobile devices"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
tokio = { version = "1.35", features = ["rt-multi-thread", "net", "macros"] }
serde.workspace = true
serde_json.workspace = true
anyhow = "1.0"
qol-plugin-daemon.workspace = true
qol-conventions.workspace = true
log = "0.4"
env_logger = { version = "0.11", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
if-addrs = "0.10"
gethostname = "1.1"
qol-apps.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
rdev = "0.5"
x11 = "2.21"

[target.'cfg(target_os = "macos")'.dependencies]
rdev = "0.5"

[build-dependencies]
qol-conventions.workspace = true

[dev-dependencies]
qol-plugin-api.workspace = true

[package.metadata.deb]
maintainer = "KMRH47"
copyright = "2025, KMRH47"
extended-description = """\
PointZerver - Headless server for remote PC control from mobile devices.
Designed to run as a qol-tray plugin daemon."""
depends = "$auto, libx11-6, libxdo3"
section = "utils"
priority = "optional"
assets = [
    ["target/release/pointzerver", "usr/bin/", "755"],
]
