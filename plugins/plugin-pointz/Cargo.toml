[package]
name = "pointzerver"
version = "0.4.0"
edition = "2021"
description = "PointZerver - Headless server for remote PC control from mobile devices"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
tokio = { version = "1.35", features = ["rt-multi-thread", "net", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
qol-plugin-daemon = { git = "https://github.com/qol-tools/qol-libs" }
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
if-addrs = "0.10"
hostname = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
rdev = "0.5"
x11 = "2.21"

[target.'cfg(target_os = "macos")'.dependencies]
rdev = "0.5"

[dev-dependencies]
qol-tray = { git = "https://github.com/qol-tools/qol-tray" }
toml = "0.9.8"

[package.metadata.deb]
maintainer = "KMRH47"
copyright = "2025, KMRH47"
extended-description = """\
PointZerver - Headless server for remote PC control from mobile devices.
Designed to run as a qol-tray plugin daemon."""
depends = "$auto, libx11-6, libxdo3"
section = "utils"
priority = "optional"
assets = [
    ["target/release/pointzerver", "usr/bin/", "755"],
]
