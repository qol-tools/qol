[plugin]
id = "plugin-pointz"
uid = "9cb88d65-1d43-4fde-95b6-105761f0a14b"
name = "PointZerver"
description = "Control your PC from mobile devices"
version = "1.8.0"
author = "KMRH47"
platforms = ["linux", "macos"]

[runtime]
command = "pointzerver"

[action.settings]
label = "Settings"
kind = "settings"
args = ["--action", "settings"]

[menu]
label = "PointZ"
items = []

[daemon]
enabled = true
command = "pointzerver"
socket = "/tmp/qol-pointz.sock"

[[dependencies.binaries]]
name = "pointzerver"
repo = "qol-tools/pointzerver"
pattern = "pointzerver-{os}-{arch}"
