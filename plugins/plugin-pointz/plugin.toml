[plugin]
name = "PointZerver"
description = "Control your PC from mobile devices"
version = "1.1.0"
author = "KMRH47"

[runtime]
command = "run.sh"
actions = { settings = ["settings"] }

[menu]
label = "PointZ"
items = [
    { type = "action", id = "settings", label = "Settings", action = "settings" },
]

[daemon]
enabled = true
command = "run.sh"
socket = "/tmp/qol-pointz.sock"
restart_on_crash = true
