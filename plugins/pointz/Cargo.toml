[package]
name = "qol-pointz"
version = "1.56.0"
edition = "2021"
description = "PointZerver - Headless server for remote PC control from mobile devices"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow = "1.0"
qol-config.workspace = true
qol-headless.workspace = true
qol-platform.workspace = true
qol-peers.workspace = true
qol-plugin-daemon.workspace = true
qol-runtime.workspace = true
qol-conventions.workspace = true
log.workspace = true
qol-log.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
if-addrs = "0.10"
gethostname = "1.1"
qol-apps.workspace = true
workspace-hack.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
rdev = "0.5"
x11 = "2.21"

[target.'cfg(target_os = "macos")'.dependencies]
rdev = "0.5"

[build-dependencies]
qol-conventions.workspace = true

[dev-dependencies]
qol-plugin-api.workspace = true
tempfile = "3"

[package.metadata.deb]
maintainer = "KMRH47"
copyright = "2025, KMRH47"
extended-description = """\
PointZerver - Headless server for remote PC control from mobile devices.
Designed to run as a qol-tray plugin daemon."""
depends = "$auto, libx11-6, libxdo3"
section = "utils"
priority = "optional"
assets = [
    ["target/release/qol-pointz", "usr/bin/", "755"],
]

[lints]
workspace = true
