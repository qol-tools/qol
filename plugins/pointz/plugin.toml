[plugin]
id = "qol-pointz"
uid = "9cb88d65-1d43-4fde-95b6-105761f0a14b"
name = "PointZerver"
icon = "pointz"
description = "Control your computer from your phone"
version = "1.67.0"
author = "KMRH47"
platforms = ["linux", "macos", "windows"]

[runtime]
command = "qol-pointz"

[action.settings]
label = "Settings"
kind = "settings"
picture = "gear"
args = ["--action", "settings"]

[capabilities]
gpui = true
doctor = true
release_host = true
permissions = ["input-capture"]
peer_trust = "pointz-v1"

[menu]
label = "PointZerver"
items = []

[daemon]
enabled = true
inherit_listener = true
command = "qol-pointz"
socket = "/tmp/qol-pointz.sock"

[traits.confined]

[traits.peripheral-preview]
neighbors = 1

[traits.atmosphere]
preset = "terminal"

[[dependencies.binaries]]
name = "qol-pointz"
repo = "qol-tools/qol-pointz"
pattern = "qol-pointz-{os}-{arch}"
