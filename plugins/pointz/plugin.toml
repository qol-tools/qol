[plugin]
id = "qol-pointz"
uid = "9cb88d65-1d43-4fde-95b6-105761f0a14b"
name = "PointZerver"
description = "Control your PC from mobile devices"
version = "1.44.0"
author = "KMRH47"
platforms = ["linux", "macos"]

[runtime]
command = "qol-pointz"

[action.settings]
label = "Settings"
kind = "settings"
picture = "gear"
args = ["--action", "settings"]

[capabilities]
gpui = true
doctor = true
permissions = ["input-capture"]

[menu]
label = "PointZ"
items = []

[daemon]
enabled = true
inherit_listener = true
command = "qol-pointz"
socket = "/tmp/qol-pointz.sock"

[[daemon.extra_ports]]
name = "discovery"
port = 45454
protocol = "udp"

[[daemon.extra_ports]]
name = "command"
port = 45455
protocol = "udp"

[traits.confined]

[traits.peripheral-preview]
neighbors = 1

[traits.atmosphere]
preset = "terminal"

[[dependencies.binaries]]
name = "qol-pointz"
repo = "qol-tools/qol-pointz"
pattern = "qol-pointz-{os}-{arch}"
