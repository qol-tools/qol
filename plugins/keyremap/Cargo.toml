[package]
name = "qol-keyremap"
version = "1.48.0"
edition = "2021"
description = "Keyboard and mouse remapping plugin for QoL Tray"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
log.workspace = true
qol-log.workspace = true
anyhow = "1"
qol-apps.workspace = true
serde.workspace = true
serde_json.workspace = true
qol-config.workspace = true
qol-headless.workspace = true
qol-platform.workspace = true
qol-hotkeys.workspace = true
qol-plugin-daemon.workspace = true
qol-runtime.workspace = true
qol-plugin-api.workspace = true
workspace-hack.workspace = true
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
foreign-types-shared = "0.3"
objc2 = { workspace = true }
objc2-app-kit = { version = "0.3", features = [
  "NSWorkspace",
  "NSRunningApplication",
] }

[dev-dependencies]
proptest = "1.10.0"

[build-dependencies]
qol-conventions.workspace = true

[lints]
workspace = true
