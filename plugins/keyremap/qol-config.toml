schema_version = 1
title = "Key Remap"
description = "Remap keyboard, mouse, and scroll inputs without relying on per-plugin settings UIs."

[section.general]
label = "General"
description = "Global enablement and app-level exclusions."

[field.enabled]
type = "boolean"
label = "Enabled"
section = "general"
default = true

[field.excluded_apps]
type = "string_array"
label = "Excluded Apps"
description = "Bundle IDs where non-global remaps should be ignored."
section = "general"
card_description = "Apps where remaps stay off."
item_label = "app"
placeholder = "com.example.app"
default = [
  "net.kovidgoyal.kitty",
  "com.apple.Terminal",
  "com.googlecode.iterm2",
  "com.jetbrains.intellij",
  "com.jetbrains.goland",
  "com.jetbrains.pycharm",
  "com.jetbrains.rider",
  "com.jetbrains.WebStorm",
  "com.jetbrains.datagrip",
  "com.jetbrains.clion",
  "com.jetbrains.rustrover",
  "com.microsoft.VSCode",
  "com.todesktop.230313mzl4w4u92",
]

[section.char_rules]
label = "Character Rules"
description = "Translate modifier combinations directly into emitted characters."

[field.char_rules]
type = "object_array"
label = "Character Rules"
section = "char_rules"
card_description = "Shortcuts that type a character."
item_label = "character rule"
default = []

[field.char_rules.item.fields]
from_mods = "string_array"
from_key = "string"
to_char = "string"
global = "boolean"

[section.key_rules]
label = "Key Rules"
description = "Translate keys or key groups into other modifier or key combinations."

[field.key_rules]
type = "object_array"
label = "Key Rules"
section = "key_rules"
card_description = "Keys that become other keys."
item_label = "key rule"
default = [
  { from_mods = ["ctrl"], to_mods = ["cmd"], keys = ["c", "v", "x", "a", "z", "s", "p", "f", "t", "w", "n", "d", "r", "return"] },
  { from_mods = ["ctrl"], to_mods = ["alt"], keys = ["left", "right", "delete", "backspace"] },
  { from_mods = ["ctrl", "shift"], to_mods = ["cmd", "shift"], keys = ["r", "t", "b"] },
  { from_mods = ["ctrl", "shift"], to_mods = ["cmd", "alt"], keys = ["e", "c", "k"] },
  { from_mods = ["ctrl"], from_key = "y", to_mods = ["cmd", "shift"], to_key = "z" },
]

[field.key_rules.item.fields]
from_mods = "string_array"
to_mods = "string_array"
keys = "string_array"
from_key = "string"
to_key = "string"
global = "boolean"

[field.key_rules.lists.keys]
item_label = "key"
card_description = "Keys this rule translates."

[section.mouse_rules]
label = "Mouse Rules"
description = "Apply modifier remaps to mouse button clicks."

[field.mouse_rules]
type = "object_array"
label = "Mouse Rules"
section = "mouse_rules"
card_description = "Modifier remaps for mouse clicks."
item_label = "mouse rule"
default = [
  { from_mods = ["ctrl"], button = "left", to_mods = ["cmd"] },
]

[field.mouse_rules.item.fields]
from_mods = "string_array"
button = "string"
to_mods = "string_array"
global = "boolean"

[section.scroll_rules]
label = "Scroll Rules"
description = "Apply modifier remaps to scroll gestures."

[field.scroll_rules]
type = "object_array"
label = "Scroll Rules"
section = "scroll_rules"
card_description = "Modifier remaps for scrolling."
item_label = "scroll rule"
default = [
  { from_mods = ["ctrl"], to_mods = ["cmd"] },
]

[field.scroll_rules.item.fields]
from_mods = "string_array"
to_mods = "string_array"
global = "boolean"
