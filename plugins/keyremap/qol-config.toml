schema_version = 1
title = "Key Remap"
description = "Change what keys, mouse clicks and scrolling do."

[section.general]
label = "General"
description = "Turn remapping on or off, and skip chosen apps."

[field.enabled]
type = "boolean"
label = "Enable remapping"
description = "Nothing is remapped until you turn it back on."
section = "general"
default = true

[field.excluded_apps]
type = "string_array"
label = "Excluded apps"
description = "Remaps are skipped in these apps, except rules marked global."
section = "general"
card_description = "Apps where remaps stay off."
item_label = "app"
placeholder = "App ID"
default = [
  "net.kovidgoyal.kitty",
  "com.apple.Terminal",
  "com.googlecode.iterm2",
  "com.jetbrains.intellij",
  "com.jetbrains.goland",
  "com.jetbrains.pycharm",
  "com.jetbrains.rider",
  "com.jetbrains.WebStorm",
  "com.jetbrains.datagrip",
  "com.jetbrains.clion",
  "com.jetbrains.rustrover",
  "com.microsoft.VSCode",
  "com.todesktop.230313mzl4w4u92",
]

[section.rules]
label = "Rules"
description = "What keys, clicks and scrolling turn into."

[field.char_rules]
type = "object_array"
label = "Character rules"
description = "Press a key combination to type a chosen character."
section = "rules"
card_description = "Key combinations that type a character."
item_label = "character rule"
default = []

[field.char_rules.item.fields]
from_mods = "string_array"
from_key = "string"
to_char = "string"
global = "boolean"

[field.key_rules]
type = "object_array"
label = "Key rules"
description = "Press one key or key combination and get another."
section = "rules"
card_description = "Keys that become other keys."
item_label = "key rule"
default = [
  { from_mods = ["ctrl"], to_mods = ["cmd"], keys = ["c", "v", "x", "a", "z", "s", "p", "f", "t", "w", "n", "d", "r", "return"] },
  { from_mods = ["ctrl"], to_mods = ["alt"], keys = ["left", "right", "delete", "backspace"] },
  { from_mods = ["ctrl", "shift"], to_mods = ["cmd", "shift"], keys = ["r", "t", "b"] },
  { from_mods = ["ctrl", "shift"], to_mods = ["cmd", "alt"], keys = ["e", "c", "k"] },
  { from_mods = ["ctrl"], from_key = "y", to_mods = ["cmd", "shift"], to_key = "z" },
]

[field.key_rules.item.fields]
from_mods = "string_array"
to_mods = "string_array"
keys = "string_array"
from_key = "string"
to_key = "string"
global = "boolean"

[field.key_rules.lists.keys]
item_label = "key"
card_description = "Keys this rule translates."

[field.mouse_rules]
type = "object_array"
label = "Mouse rules"
description = "Swap the keys you hold while clicking."
section = "rules"
card_description = "Modifier remaps for mouse clicks."
item_label = "mouse rule"
default = [
  { from_mods = ["ctrl"], button = "left", to_mods = ["cmd"] },
]

[field.mouse_rules.item.fields]
from_mods = "string_array"
button = "string"
to_mods = "string_array"
global = "boolean"

[field.scroll_rules]
type = "object_array"
label = "Scroll rules"
description = "Swap the keys you hold while scrolling."
section = "rules"
card_description = "Modifier remaps for scrolling."
item_label = "scroll rule"
default = [
  { from_mods = ["ctrl"], to_mods = ["cmd"] },
]

[field.scroll_rules.item.fields]
from_mods = "string_array"
to_mods = "string_array"
global = "boolean"

[section.modifier_keys]
label = "Modifier keys"
description = "Choose what each modifier key does."

[field.modifier_caps_lock]
type = "select"
config_key = "modifier_keys.caps_lock"
label = "Caps Lock key"
description = "Choose what pressing Caps Lock does."
section = "modifier_keys"
default = "caps_lock"
card_description = "What Caps Lock acts as."
options = ["caps_lock", "control", "option", "command", "fn", "escape", "none"]

[field.modifier_caps_lock.option_labels]
caps_lock = "Caps Lock"
control = "Control"
option = "Option"
command = "Command"
fn = "Globe / fn"
escape = "Escape"
none = "No action"

[field.modifier_caps_lock.option_pictures]
caps_lock = "letters:⇪"
control = "letters:⌃"
option = "letters:⌥"
command = "letters:⌘"
fn = "letters:fn"
escape = "letters:esc"
none = "letters:—"

