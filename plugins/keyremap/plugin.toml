[plugin]
id = "plugin-keyremap"
uid = "e1bc6f9b-95e0-46c5-951b-6cc5de5c6d87"
name = "Key Remap"
description = "Remap keyboard and mouse shortcuts (Ctrl->Cmd, etc.)"
version = "1.31.0"
author = "KMRH47"
platforms = ["macos"]

[runtime]
command = "keyremap"

[action.reload]
label = "Reload Config"
args = ["--reload"]

[action.toggle]
label = "Toggle Remapping"
args = ["toggle"]

[action.settings]
label = "Settings"
kind = "settings"
args = ["--settings"]

[daemon]
enabled = true
command = "keyremap"
socket = "/tmp/qol-keyremap.sock"

[capabilities]
gpui = true
doctor = true

[menu]
label = "Key Remap"
items = []

[[dependencies.binaries]]
name = "keyremap"
repo = "qol-tools/plugin-keyremap"
pattern = "keyremap-{os}-{arch}"
