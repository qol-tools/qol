[plugin]
id = "qol-keyremap"
uid = "e1bc6f9b-95e0-46c5-951b-6cc5de5c6d87"
name = "Key Remap"
description = "Remap keyboard and mouse shortcuts (Ctrl->Cmd, etc.)"
version = "1.45.0"
author = "KMRH47"
platforms = ["macos"]

[runtime]
command = "qol-keyremap"

[action.reload]
label = "Reload Config"
args = ["--reload"]

[action.toggle]
label = "Toggle Remapping"
args = ["toggle"]

[action.settings]
label = "Settings"
kind = "settings"
picture = "gear"
args = ["--settings"]

[daemon]
enabled = true
command = "qol-keyremap"
inherit_listener = true
socket = "/tmp/qol-keyremap.sock"

[capabilities]
gpui = true
doctor = true
permissions = ["input-capture"]

[menu]
label = "Key Remap"
items = []

[[dependencies.binaries]]
name = "qol-keyremap"
repo = "qol-tools/qol-keyremap"
pattern = "qol-keyremap-{os}-{arch}"
