[plugin]
id = "qol-launcher"
uid = "5cc75f62-2e3b-463c-ac7b-ae269cff1ef1"
name = "Launcher"
icon = "launcher"
description = "Search apps and files, then open them from the keyboard."
version = "1.103.2"
author = "KMRH47"
platforms = ["linux", "macos", "windows"]

[config.scope]
extra_file_scan_roots = "device"
most_used_apps = "core"
recent_files = "core"
escape_clears_text = "core"
display = "core"

[runtime]
command = "qol-launcher"

[action.open]
label = "Open Launcher"
args = ["--show"]

[action.flow]
label = "Open a Flow"
args = ["--flow"]
hotkey = false

[action.settings]
label = "Settings"
kind = "settings"
picture = "gear"
args = ["--settings"]

[daemon]
enabled = true
command = "qol-launcher"
inherit_listener = true
socket = "/tmp/qol-launcher.sock"

[capabilities]
gpui = true
doctor = true

[menu]
label = "Launcher"
items = []

[[dependencies.binaries]]
name = "qol-launcher"
repo = "qol-tools/qol-launcher"
pattern = "qol-launcher-{os}-{arch}"
