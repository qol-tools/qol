[plugin]
id = "qol-launcher"
uid = "5cc75f62-2e3b-463c-ac7b-ae269cff1ef1"
name = "Launcher"
description = "Universal search with action modifiers"
version = "1.72.0"
author = "KMRH47"
platforms = ["linux", "macos"]

[runtime]
command = "qol-launcher"

[action.open]
label = "Open Launcher"
args = ["--show"]

[action.settings]
label = "Settings"
kind = "settings"
picture = "gear"
args = ["--settings"]

[daemon]
enabled = true
command = "qol-launcher"
inherit_listener = true
socket = "/tmp/qol-launcher.sock"

[capabilities]
gpui = true
doctor = true

[menu]
label = "Launcher"
items = []

[[dependencies.binaries]]
name = "qol-launcher"
repo = "qol-tools/qol-launcher"
pattern = "qol-launcher-{os}-{arch}"
