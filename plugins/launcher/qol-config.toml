schema_version = 1
title = "Launcher"
description = "Universal search with action modifiers."

[section.launcher]
label = "Launcher"
description = "Universal search with action modifiers."
actions = ["open"]

[field.extra_file_scan_roots]
type = "string_array"
config_key = "extra_file_scan_roots"
label = "Extra file scan roots"
description = "Additional folders whose files should appear in launcher search."
section = "launcher"
card_description = "Folders the launcher also searches."
item_label = "folder"
default = []
placeholder = "/path/to/files"

[field.most_used_apps]
type = "boolean"
config_key = "most_used_apps"
label = "Most used apps before you type"
description = "Show the apps you open most while the search is empty."
section = "launcher"
default = true

[field.recent_files]
type = "boolean"
config_key = "recent_files"
label = "Recent files before you type"
description = "Show recently opened files while a Files search is empty."
section = "launcher"
default = true

[field.escape_clears_text]
type = "boolean"
config_key = "escape_clears_text"
label = "Esc clears text before closing"
description = "With text typed, the first Esc clears it and the second closes. Off: Esc always closes."
section = "launcher"
default = true

[section.appearance]
label = "Debug"
description = "Only for tracking down launcher problems."
actions = ["open"]
dev_only = true

[field.display_ghost_opacity]
type = "number"
config_key = "display.ghost_opacity"
label = "Ghost opacity"
description = "Opacity of the hidden launcher window in debug builds. 0 = invisible."
section = "appearance"
default = 0.0
min = 0.0
max = 1.0
step = 0.05

[field.display_ghost_debug_color]
type = "color"
config_key = "display.ghost_debug_color"
label = "Ghost color"
description = "Background hex color of the hidden launcher window in debug builds."
section = "appearance"
placeholder = "00ff00"
default = "00ff00"
