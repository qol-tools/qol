schema_version = 1
title = "Window Actions"
description = "Default window sizing and monitor-move behavior."

[section.center]
label = "Center"
description = "Default centered size used by the center action."
actions = ["center"]

[field.center_mode]
type = "select"
label = "Center size mode"
section = "center"
default = "pixels"
card_description = "How big a centered window gets."
options = ["pixels", "percent"]

[field.center_mode.option_labels]
pixels = "Fixed size"
percent = "Relative size"

[field.center_mode.option_pictures]
pixels = "fixed-size"
percent = "relative-size"

[field.center_width_px]
type = "number"
label = "Centered width"
section = "center"
default = 1152
min = 320
step = 1

[field.center_width_px.show_when]
field = "center_mode"
equals = "pixels"

[field.center_height_px]
type = "number"
label = "Centered height"
section = "center"
default = 892
min = 240
step = 1

[field.center_height_px.show_when]
field = "center_mode"
equals = "pixels"

[field.center_width_share]
type = "number"
config_key = "center_width_percent"
label = "Centered width"
description = "Share of the screen width, from 0.1 to 1. 1 fills the screen."
section = "center"
default = 0.64
min = 0.1
max = 1.0
step = 0.01
variant = "slider"

[field.center_width_share.show_when]
field = "center_mode"
equals = "percent"

[field.center_height_share]
type = "number"
config_key = "center_height_percent"
label = "Centered height"
description = "Share of the screen height, from 0.1 to 1. 1 fills the screen."
section = "center"
default = 0.79
min = 0.1
max = 1.0
step = 0.01
variant = "slider"

[field.center_height_share.show_when]
field = "center_mode"
equals = "percent"

[section.snap]
label = "Snap"
description = "Default fraction used by snap actions."
actions = ["snap-left", "snap-right", "snap-bottom"]

[field.snap_fraction]
type = "number"
label = "Snap fraction"
section = "snap"
default = 0.5
min = 0.1
max = 1.0
step = 0.05
variant = "slider"

[section.monitor_move]
label = "Monitor move"
description = "Behavior applied after moving a window between monitors."
actions = ["move-monitor-left", "move-monitor-right"]

[field.reveal_taskbar_after_move]
type = "boolean"
label = "Reveal taskbar after move"
section = "monitor_move"
default = true

[section.glide]
label = "Glide"
description = "Continuous window movement speed while a glide shortcut is held."
actions = ["glide-left", "glide-right", "glide-up", "glide-down"]

[field.glide_speed_px_per_second]
type = "number"
label = "Glide speed"
section = "glide"
default = 1200
min = 100
max = 4000
step = 100
variant = "slider"

[section.window_state]
label = "Window state"
description = "Direct window state actions without additional configuration."
actions = ["maximize", "minimize", "restore"]
