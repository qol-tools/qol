[plugin]
id = "qol-sound"
uid = "46f6cce7-a812-4ddb-b965-0c9b82472fbc"
name = "Audio"
icon = "sound"
description = "Choose where sound plays, which microphone every app hears, and how loud each is"
version = "0.15.0"
author = "KMRH47"
platforms = ["linux", "windows"]

[runtime]
command = "qol-sound"

[action.outputs]
label = "List Sound Outputs"
args = ["outputs"]
hotkey = false

[action.switch]
label = "Switch Sound Output"
args = ["switch"]
hotkey = false

[action.set_volume]
label = "Set Sound Volume"
args = ["volume"]
hotkey = false

[action.next_output]
label = "Next Sound Output"
args = ["next"]

[action.volume_up]
label = "Volume Up"
args = ["up"]
continuous = true

[action.volume_down]
label = "Volume Down"
args = ["down"]
continuous = true

[action.inputs]
label = "List Microphones"
args = ["inputs"]
hotkey = false

[action.input_status]
label = "Microphone Status"
args = ["input-status"]
hotkey = false

[action.switch_input]
label = "Switch Microphone"
args = ["switch-input"]
hotkey = false

[action.input_volume]
label = "Microphone Volume"
args = ["input-volume"]
hotkey = false

[action.set_input_volume]
label = "Set Microphone Volume"
args = ["input-volume"]
hotkey = false

[action.mute_status]
label = "Mute Status"
args = ["mute-status"]
hotkey = false

[action.mute_output]
label = "Mute Output"
args = ["mute", "output"]

[action.unmute_output]
label = "Unmute Output"
args = ["unmute", "output"]

[action.mute_input]
label = "Mute Microphone"
args = ["mute", "input"]

[action.unmute_input]
label = "Unmute Microphone"
args = ["unmute", "input"]

[action.levels]
label = "Audio Levels"
args = ["levels"]
hotkey = false

[action.settings]
label = "Settings"
kind = "settings"
picture = "gear"
args = ["settings"]
hotkey = false

[daemon]
enabled = true
command = "qol-sound"
socket = "/tmp/plugin-sound.sock"
port = 42750

[capabilities]
gpui = true
doctor = true

[config.scope]
output = "device"
input = "device"

[menu]
label = "Audio"
items = []

[[dependencies.binaries]]
name = "qol-sound"
repo = "qol-tools/qol-sound"
pattern = "qol-sound-{os}-{arch}"
