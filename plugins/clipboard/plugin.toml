[plugin]
id = "qol-clipboard"
uid = "b61db996-7053-4934-b056-66b6e9e4eb3b"
name = "Clipboard"
icon = "clipboard"
description = "Search everything you copied from the launcher"
version = "0.9.0"
author = "KMRH47"
platforms = ["linux", "macos", "windows"]

[runtime]
command = "qol-clipboard"

[daemon]
enabled = true
command = "qol-clipboard"
socket = "/tmp/qol-clipboard.sock"

[action.open]
label = "Open Clipboard"
args = ["open"]

[action.copy]
label = "Copy"
args = ["copy"]

[action.pin]
label = "Pin"
args = ["pin"]

[action.forget]
label = "Forget"
args = ["forget"]

[action.clear]
label = "Clear"
args = ["clear"]

[action.settings]
label = "Settings"
kind = "settings"
picture = "gear"
args = ["settings"]

[capabilities]
gpui = true
doctor = true

[launcher]
kind = "flow"
title = "Clipboard"
prompt = "Search clipboard"
query = "rows"
enter = "copy"
panel = "preview"
detail = "detail"

[[launcher.row_actions]]
action = "pin"
key = "ctrl+p"
label = "Pin"
input = { id = "{id}" }

[[launcher.row_actions]]
action = "forget"
key = "delete"
label = "Forget"
input = { id = "{id}" }

[[launcher.row_actions]]
action = "copy"
label = "Copy"
input = { id = "{id}" }

[menu]
label = "Clipboard"
items = []

[[dependencies.binaries]]
name = "qol-clipboard"
repo = "qol-tools/qol-clipboard"
pattern = "qol-clipboard-{os}-{arch}"
