[package]
name = "qol-clipboard"
version = "0.13.0"
edition = "2021"

[dependencies]
log.workspace = true
qol-log.workspace = true
anyhow = "1"
getrandom.workspace = true
qol-apps.workspace = true
qol-config.workspace = true
qol-conventions.workspace = true
qol-fs.workspace = true
qol-headless.workspace = true
qol-platform.workspace = true
qol-plugin-api.workspace = true
qol-plugin-daemon.workspace = true
qol-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
workspace-hack.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { workspace = true, features = ["xfixes"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSData", "NSDictionary", "NSString"] }
objc2-app-kit = { workspace = true, features = [
  "std",
  "NSBitmapImageRep",
  "NSImageRep",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSRunningApplication",
  "NSWorkspace",
] }

[build-dependencies]
qol-conventions.workspace = true

[dev-dependencies]
toml.workspace = true

[lints]
workspace = true
