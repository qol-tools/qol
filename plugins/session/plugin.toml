[plugin]
id = "qol-session"
uid = "d34dabdb-bb86-455d-823a-e5fba384d138"
name = "Session"
icon = "session"
description = "Lock the screen from a hotkey on every platform"
version = "0.3.1"
author = "KMRH47"
platforms = ["linux", "macos", "windows"]

[runtime]
command = "qol-session"

[action.lock]
label = "Lock Screen"
args = ["lock"]

[capabilities]
doctor = true

[menu]
label = "Session"
items = []

[[shortcuts]]
id = "lock"
name = "Lock Screen"
action = "lock"
export_to_launcher = true

[[dependencies.binaries]]
name = "qol-session"
repo = "qol-tools/qol-session"
pattern = "qol-session-{os}-{arch}"
