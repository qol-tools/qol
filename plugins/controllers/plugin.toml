[plugin]
id = "qol-controllers"
uid = "eb274823-d360-47bb-a668-6bf047ba8baf"
name = "Controllers"
description = "Inspect connected game controllers and apply relevant driver-specific fixes"
version = "0.36.0"
author = "KMRH47"
platforms = ["linux"]

[runtime]
command = "qol-controllers"

[action.apply_fixes]
label = "Apply Relevant Controller Fixes"
args = ["apply_fixes"]

[action.reclaim_controller]
label = "Fix Stuck Controller"
args = ["reclaim"]

[action.settings]
label = "Settings"
kind = "settings"
picture = "gear"
args = ["settings"]

[daemon]
enabled = true
command = "qol-controllers"
socket = "/tmp/plugin-controllers.sock"
port = 42730

[capabilities]
doctor = true
gpui = true

[menu]
label = "Controllers"
items = []

[[dependencies.binaries]]
name = "qol-controllers"
repo = "qol-tools/qol-controllers"
pattern = "qol-controllers-{os}-{arch}"
