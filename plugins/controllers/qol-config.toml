schema_version = 1
title = "Controllers"
description = "Connected game controllers, active drivers, and available capabilities."

[section.controllers]
label = "Controllers"
description = "Which pads this computer can see and whether they need a fix."

[field.fixes_status]
type = "status"
label = "Status"
section = "controllers"
query = "controllers_snapshot"
value_from = "state"
label_map = { none = "No Controllers Detected", ok = "Controllers ready", optional_fix = "Optional fix available", not_responding = "Controller not responding", fixing = "Fixing controller" }
tone_map = { ok = "success", optional_fix = "warning", not_responding = "danger", fixing = "warning" }

[field.detected_pads]
type = "list"
label = "Connected Controllers"
section = "controllers"
query = "controllers_snapshot"
row_label = "{name}"
row_subtitle = "{transport} · {driver} · {verdict}"
empty_message = "No controllers detected."
card_description = "Pads this computer can see."
item_card_field = "input_test"

[[field.detected_pads.row_actions]]
action = "apply_fixes"
label = "Fix"
when = "fixable"

[[field.detected_pads.row_actions]]
action = "reclaim_controller"
label = "Fix"
description = "Keeps apps like Steam from grabbing the controller, then reconnects it. Press Home on the controller afterwards."
when = "reclaimable"

[field.input_test]
type = "gamepad"
label = "Controller Input"
description = "Press a controller button, then move every stick, trigger, D-pad direction, and face button."
section = "controllers"
query = "controller_input"
card_description = "Live input from the pad under test."
