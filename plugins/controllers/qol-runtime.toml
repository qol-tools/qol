schema_version = 1

[action.apply_fixes]
description = "Apply fixes only when they match a controller's active driver"

[action.reclaim_controller]
description = "Reset the Bluetooth link of a controller whose driver stopped responding"

[action.stop_holder_and_reclaim]
description = "Stop the process holding a stuck controller's raw HID device, then reset its Bluetooth link"

[query.controllers_snapshot]
description = "One coherent controller inventory and health snapshot"
poll_interval_ms = 3000

[query.controller_input]
description = "Native button overrides and connection metadata omitted by the browser gamepad mapping"
poll_interval_ms = 8
