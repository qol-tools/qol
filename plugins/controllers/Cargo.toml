[package]
name = "qol-controllers"
version = "0.47.0"
edition = "2021"

[dependencies]
log.workspace = true
qol-log.workspace = true
anyhow = "1"
serde_json = "1"
qol-conventions.workspace = true
qol-plugin-daemon.workspace = true
qol-headless.workspace = true
qol-host-fixes.workspace = true
qol-apps.workspace = true
workspace-hack.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
qol-bluetooth-control.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_UI_Input_XboxController",
] }

[build-dependencies]
qol-conventions.workspace = true

[dev-dependencies]
qol-plugin-api.workspace = true
tempfile = "3"

[lints]
workspace = true
