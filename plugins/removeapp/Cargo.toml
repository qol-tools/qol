[package]
name = "plugin-removeapp"
version = "0.28.0"
edition = "2021"
description = "Uninstall an app and its leftovers for QoL Tray"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "plugin_removeapp"
path = "src/lib.rs"

[[bin]]
name = "removeapp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde.workspace = true
serde_json.workspace = true
qol-headless.workspace = true
qol-plugin-daemon.workspace = true
qol-apps.workspace = true
gpui.workspace = true
qol-gpui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
dirs = "6"
libc = "0.2"
trash = "5"
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSWorkspace", "NSRunningApplication"] }
wait-timeout = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
qol-process.workspace = true
trash = "5"
wait-timeout = "0.2"

[build-dependencies]
qol-conventions.workspace = true

[dev-dependencies]
qol-plugin-api.workspace = true
tempfile = "3"
