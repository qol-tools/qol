[package]
name = "qol-removeapp"
version = "0.71.2"
edition = "2021"
description = "Uninstall an app and its leftovers for QoL Tray"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "qol_removeapp"
path = "src/lib.rs"

[dependencies]
log.workspace = true
qol-log.workspace = true
anyhow = "1"
serde.workspace = true
serde_json.workspace = true
qol-headless.workspace = true
qol-plugin-daemon.workspace = true
qol-apps.workspace = true
qol-platform.workspace = true
gpui.workspace = true
qol-gpui.workspace = true
workspace-hack.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
dirs = "6"
libc = "0.2"
trash = "5"
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSWorkspace", "NSRunningApplication"] }
wait-timeout = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
qol-process.workspace = true
trash = "5"
wait-timeout = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
qol-app-icon.workspace = true
qol-process.workspace = true
qol-windowing.workspace = true
trash = "5"
windows = { version = "0.61", features = [
  "ApplicationModel",
  "Management_Deployment",
] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
qol-conventions.workspace = true

[dev-dependencies]
qol-plugin-api.workspace = true
tempfile = "3"

[lints]
workspace = true
