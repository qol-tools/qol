[plugin]
id = "qol-removeapp"
uid = "37aae6d0-ae74-4487-946a-32a635a9ef03"
name = "Remove App"
icon = "remove-app"
description = "Uninstall an app and its leftovers"
version = "0.97.10"
author = "KMRH47"
platforms = ["linux", "macos", "windows"]

[config.scope]
title_bar = "os"

[runtime]
command = "qol-removeapp"

[action.open]
label = "Open Remove App"
args = ["open"]

[action.settings]
label = "Settings"
kind = "settings"
picture = "gear"
args = ["settings"]

[capabilities]
gpui = true
doctor = true

[menu]
label = "Remove App"
items = []

[[shortcuts]]
id = "open"
name = "Remove App"
action = "open"
export_to_launcher = true
app_window = true

[[dependencies.binaries]]
name = "qol-removeapp"
repo = "qol-tools/qol-removeapp"
pattern = "qol-removeapp-{os}-{arch}"
