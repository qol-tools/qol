[plugin]
id = "plugin-removeapp"
uid = "37aae6d0-ae74-4487-946a-32a635a9ef03"
name = "Remove App"
description = "Uninstall an app and its leftovers"
version = "0.41.0"
author = "KMRH47"
platforms = ["linux", "macos"]

[runtime]
command = "removeapp"

[action.open]
label = "Open"
args = ["open"]

[capabilities]
gpui = true
doctor = true

[menu]
label = "Remove App"
items = []

[[shortcuts]]
id = "open"
name = "Remove App"
action = "open"
export_to_launcher = true

[[dependencies.binaries]]
name = "removeapp"
repo = "qol-tools/plugin-removeapp"
pattern = "removeapp-{os}-{arch}"
