[plugin]
id = "qol-cli-sessions"
uid = "98f8b9fe-2115-4890-a8cc-89b6d4483d75"
name = "CLI Sessions"
description = "Always-on-top overview of live CLI sessions (Claude Code, Codex, any command)"
version = "0.64.2"
author = "KMRH47"
platforms = ["linux", "macos"]

[runtime]
command = "qol-cli-sessions"

[action.open]
label = "Open Overview"
args = ["open"]

[action.next]
label = "Jump to Next Alert"
args = ["next"]

[action.snapshot]
label = "Snapshot All Sessions"
args = ["snapshot"]

[action.settings]
label = "Settings"
kind = "settings"
picture = "gear"
args = ["settings"]

[daemon]
enabled = true
command = "qol-cli-sessions"
inherit_listener = true
socket = "/tmp/qol-cli-sessions.sock"

[capabilities]
gpui = true
doctor = true

[menu]
label = "CLI Sessions"
items = []

[[shortcuts]]
id = "open"
name = "CLI Sessions"
action = "open"
export_to_launcher = true

[[shortcuts]]
id = "next"
name = "CLI Sessions: Next Alert"
action = "next"
export_to_launcher = true

[[shortcuts]]
id = "snapshot"
name = "CLI Sessions: Snapshot All"
action = "snapshot"
export_to_launcher = true

[[dependencies.binaries]]
name = "qol-cli-sessions"
repo = "qol-tools/qol-cli-sessions"
pattern = "qol-cli-sessions-{os}-{arch}"
