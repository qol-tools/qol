[package]
name = "plugin-cli-sessions"
version = "0.37.5"
edition = "2021"
description = "Always-on-top overview of live CLI sessions (Claude Code, Codex, any command) for QoL Tray"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "cli-sessions"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde.workspace = true
serde_json.workspace = true
gpui.workspace = true
qol-gpui.workspace = true
qol-headless.workspace = true
qol-plugin-daemon.workspace = true
qol-process.workspace = true
qol-runtime.workspace = true
qol-terminal-sessions.workspace = true
qol-config.workspace = true
qol-fs.workspace = true

[build-dependencies]
qol-conventions.workspace = true

[dev-dependencies]
proptest = "1"
qol-plugin-api.workspace = true
tempfile = "3"
toml.workspace = true
