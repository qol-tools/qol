schema_version = 1
title = "CLI Sessions"
description = "Always-on-top overview of live Claude Code sessions."

[section.panel]
label = "Panel"
description = "Where the always-on-top panel sits and how it refreshes."

[section.detection]
label = "Service detection"
description = "Which commands count as long-running services."

[field.corner]
type = "select"
section = "panel"
config_key = "corner"
label = "Screen corner"
description = "Which screen corner holds the panel."
default = "top-right"
card_description = "Which screen corner holds the panel."
options = ["top-left", "top-right", "bottom-left", "bottom-right"]

[field.corner.option_labels]
top-left = "Top left"
top-right = "Top right"
bottom-left = "Bottom left"
bottom-right = "Bottom right"

[field.corner.option_pictures]
top-left = "letters:TL"
top-right = "letters:TR"
bottom-left = "letters:BL"
bottom-right = "letters:BR"

[field.service_commands]
type = "string_array"
section = "detection"
config_key = "service_commands"
label = "Service commands"
description = "Command names treated as long-running services even when they hold no listening socket. One command per row."
card_description = "Commands that count as services."
item_label = "command"
default = []
placeholder = "e.g. cargo watch"

[section.switchboard]
label = "Switchboard"
description = "The one control chat that starts, lists and closes your sessions."

[field.switchboard_model]
type = "string"
section = "switchboard"
config_key = "switchboard_model"
label = "Switchboard model"
description = "The model the switchboard chat runs on."
card_description = "The model the switchboard runs on."
default = "claude-sonnet-5-5"
placeholder = "claude-sonnet-5-5"

[field.switchboard_effort]
type = "select"
section = "switchboard"
config_key = "switchboard_effort"
label = "Switchboard effort"
description = "How hard the switchboard thinks before each short reply."
card_description = "How hard the switchboard thinks."
default = "low"
options = ["low", "medium", "high", "xhigh", "max"]

[field.switchboard_effort.option_labels]
low = "Low"
medium = "Medium"
high = "High"
xhigh = "Extra high"
max = "Max"

[field.switchboard_effort.option_pictures]
low = "letters:lo"
medium = "letters:med"
high = "letters:hi"
xhigh = "letters:xhi"
max = "letters:max"
