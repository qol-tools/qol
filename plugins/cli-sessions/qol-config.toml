schema_version = 1
title = "CLI Sessions"
description = "Always-on-top overview of live Claude Code sessions."

[section.panel]
label = "Panel"
description = "Where the always-on-top panel sits and how it refreshes."

[section.detection]
label = "Service detection"
description = "Which commands count as long-running services."

[field.corner]
type = "select"
section = "panel"
config_key = "corner"
label = "Screen corner"
default = "top-right"
card_description = "Which screen corner holds the panel."
options = ["top-left", "top-right", "bottom-left", "bottom-right"]

[field.corner.option_labels]
top-left = "Top left"
top-right = "Top right"
bottom-left = "Bottom left"
bottom-right = "Bottom right"

[field.corner.option_pictures]
top-left = "letters:TL"
top-right = "letters:TR"
bottom-left = "letters:BL"
bottom-right = "letters:BR"

[field.service_commands]
type = "string_array"
section = "detection"
config_key = "service_commands"
label = "Service commands"
description = "Command names treated as long-running services even when they hold no listening socket. One command per row."
card_description = "Commands that count as services."
item_label = "command"
default = []
placeholder = "e.g. cargo watch"
