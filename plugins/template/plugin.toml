[plugin]
id = "qol-template"
# uid = "run: uuidgen | tr A-F a-f"   # frozen, mint once and never change
name = "My Plugin"
description = "A qol-tray plugin"


version = "0.2.0"

author = "KMRH47"
platforms = ["linux", "macos"]

[runtime]
command = "qol-template"

[action.run]
label = "Run"
args = ["run"]

[action.settings]
label = "Settings"
kind = "settings"
picture = "gear"
args = ["settings"]

[capabilities]
gpui = true
doctor = true

[menu]
label = "My Plugin"
items = []

[[dependencies.binaries]]
name = "qol-template"
repo = "qol-tools/qol-template"
pattern = "qol-template-{os}-{arch}"
