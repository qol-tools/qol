[plugin]
id = "plugin-template"
# uid = "run: uuidgen | tr A-F a-f"   # frozen, mint once and never change
name = "My Plugin"
description = "A qol-tray plugin"


version = "0.1.0"

author = "KMRH47"
platforms = ["linux", "macos"]

[runtime]
command = "plugin-template"

[action.run]
label = "Run"
args = ["run"]

[action.settings]
label = "Settings"
kind = "settings"
args = ["settings"]

[capabilities]
doctor = true

[menu]
label = "My Plugin"
items = []

[[dependencies.binaries]]
name = "plugin-template"
repo = "qol-tools/plugin-template"
pattern = "plugin-template-{os}-{arch}"
