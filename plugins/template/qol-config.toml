schema_version = 1
title = "My Plugin"
description = "Settings for a qol-tray plugin scaffolded from the template."

# The native hosted settings panel engages when this file exists alongside
# plugin.toml. Replace these placeholder fields with your plugin's real
# settings contract; see plugins/lights/qol-config.toml and
# plugins/pointz/qol-config.toml for the full field vocabulary.

[field.enabled]
type = "boolean"
config_key = "general.enabled"
label = "Enabled"
default = true

[field.display_name]
type = "string"
config_key = "general.display_name"
label = "Display Name"
default = "My Plugin"
