schema_version = 1
title = "Bluetooth"
description = "Choose the Bluetooth devices qol should keep connected."

[section.devices]
label = "Devices"
description = "Search for nearby devices and inspect the devices this computer is already paired with."

[field.adapter_power]
type = "action"
label = "Bluetooth"
active_label = "Bluetooth"
description = "Power the default Bluetooth adapter on or off."
section = "devices"
action = "enable_adapter"
active_action = "disable_adapter"
active_query = "adapter_status"
active_value_from = "powered"
variant = "toggle"

[field.adapter]
type = "select"
label = "Adapter"
description = "Which Bluetooth adapter qol uses. Automatic follows the system default."
section = "devices"
default = ""
query = "adapter_options"
lookup_label = "adapters"
card_description = "The Bluetooth adapter qol uses."

[field.search]
type = "action"
label = "Start search"
active_label = "Stop search"
description = "Discover Bluetooth devices for up to 60 seconds, or stop the search early."
section = "devices"
action = "start_search"
active_action = "stop_search"
active_query = "search_status"
active_value_from = "searching"
label_map = { false = "Scan", true = "Stop" }

[field.devices]
type = "list"
label = "Bluetooth devices"
section = "devices"
query = "devices"
active_query = "search_status"
active_value_from = "searching"
active_label = "Searching"
row_label = "{name}"
row_subtitle = "{detail}"
search = true
empty_message = "No paired devices. Start search to discover nearby devices."
card_description = "Devices nearby and already paired."

[[field.devices.row_actions]]
action = "connect_device"
label = "Connect"
description = "Connects the device to this computer."
when = "can_connect"
input = { address = "{address}" }

[[field.devices.row_actions]]
action = "reclaim_device"
label = "Take back"
description = "Moves the audio from the other device to this computer."
when = "can_reclaim"
input = { address = "{address}" }

[[field.devices.row_actions]]
action = "disconnect_device"
label = "Disconnect"
description = "Drops the connection on this computer only."
when = "can_disconnect"
input = { address = "{address}" }

[[field.devices.row_actions]]
action = "pair_device"
label = "Pair"
description = "Pairs the device with this computer."
when = "can_pair"
input = { address = "{address}" }

[[field.devices.row_actions]]
action = "trust_device"
label = "Trust"
description = "Lets the device connect on its own."
when = "can_trust"
input = { address = "{address}" }

[[field.devices.row_actions]]
action = "untrust_device"
label = "Untrust"
description = "Stops the device connecting on its own."
when = "can_untrust"
input = { address = "{address}" }

[[field.devices.row_actions]]
action = "remove_device"
label = "Remove"
description = "Forgets the pairing."
when = "can_remove"
input = { address = "{address}" }

[section.reconnection]
label = "Reconnection"
description = "Automatic retries run only while a managed device is disconnected."
actions = ["reconnect", "reconnect_trusted"]

[field.managed_devices]
type = "string_array"
label = "Managed device addresses"
description = "Paired Bluetooth MAC addresses to reconnect automatically."
section = "reconnection"
placeholder = "AA:BB:CC:DD:EE:FF"
default = []
card_description = "Devices qol reconnects on its own."
query = "managed_device_options"

[field.auto_reconnect]
type = "boolean"
label = "Reconnect automatically"
description = "Keep retrying managed devices while they are disconnected."
section = "reconnection"
default = true

[field.power_on_adapter]
type = "boolean"
label = "Allow automatic power-on"
description = "Allow startup, searches, and explicit connection actions to power on the default adapter when needed."
section = "reconnection"
default = true

[field.retry_initial_seconds]
type = "number"
label = "Initial retry delay"
description = "Seconds before the first retry after a failed connection."
section = "reconnection"
default = 1
min = 1
max = 60
step = 1

[field.retry_max_seconds]
type = "number"
label = "Maximum retry delay"
description = "Maximum seconds between retries while a managed device remains disconnected."
section = "reconnection"
default = 60
min = 5
max = 600
step = 5

[section.host]
label = "Host"
description = "How this computer's own Bluetooth stack is behaving."

[field.host_status]
type = "status"
label = "Host stack"
section = "host"
query = "host_fixes"
value_from = "state"
label_map = { none = "Nothing detected", ok = "Host stack healthy", attention = "Host stack needs attention" }
tone_map = { ok = "success", attention = "warning" }

[field.host_findings]
type = "list"
label = "Findings"
section = "host"
query = "host_fixes"
row_label = "{title}"
row_subtitle = "{detail}"
empty_message = "Nothing to report about this computer's Bluetooth stack."
card_description = "What the Bluetooth stack reports."

[field.host_findings.row_action]
action = "apply_host_fix"
label = "Fix"
description = "Applies the fix to this computer's Bluetooth stack."
when = "actionable"
input = { id = "{id}" }

[section.audio]
label = "Audio"
description = "Where system audio goes when a Bluetooth audio device connects."

[field.set_default_output]
type = "boolean"
label = "Set as default output on connect"
description = "Make a connected audio device the system output. If another output is already playing, qol leaves it alone and makes the device the output once that output stops, or on the device's next connect. The mic stays on your current input because qol pins the high-quality A2DP profile, which carries no microphone."
section = "audio"
default = true

[field.auto_reclaim_on_play]
type = "boolean"
label = "Take the speaker back when this computer plays"
description = "When a Bluetooth speaker is shared with another device, such as a phone, switch it back to this computer as soon as this computer starts playing."
section = "audio"
default = true
