schema_version = 1
title = "Bluetooth"
description = "Choose the Bluetooth devices qol should keep connected."

[section.devices]
label = "Devices"
description = "Turn Bluetooth on, choose the adapter, and manage paired devices or find new ones."

[field.adapter_power]
type = "action"
label = "Bluetooth"
active_label = "Bluetooth"
description = "Power the default Bluetooth adapter on or off."
section = "devices"
action = "enable_adapter"
active_action = "disable_adapter"
active_query = "adapter_status"
active_value_from = "powered"
variant = "toggle"

[field.adapter]
type = "select"
label = "Adapter"
description = "Which Bluetooth adapter qol uses. Automatic follows the system default."
section = "devices"
default = ""
query = "adapter_options"
lookup_label = "adapters"
card_description = "The Bluetooth adapter qol uses."

[field.devices]
type = "list"
label = "Bluetooth devices"
section = "devices"
query = "devices"
row_label = "{name}"
row_subtitle = "{detail}"
search = true
empty_message = "No paired devices. Find devices to pair one."
card_description = "Devices paired with this computer."

[[field.devices.row_actions]]
action = "connect_device"
label = "Connect"
description = "Connects the device to this computer, taking it from a linked device when one has it."
when = "can_connect"
input = { address = "{address}" }

[[field.devices.row_actions]]
action = "reclaim_device"
label = "Take back"
description = "Moves the audio from the other device to this computer."
when = "can_reclaim"
input = { address = "{address}" }

[[field.devices.row_actions]]
action = "disconnect_device"
label = "Disconnect"
description = "Drops the connection on this computer only."
when = "can_disconnect"
input = { address = "{address}" }

[[field.devices.row_actions]]
action = "trust_device"
label = "Trust"
description = "Lets the device connect on its own."
when = "can_trust"
input = { address = "{address}" }

[[field.devices.row_actions]]
action = "untrust_device"
label = "Untrust"
description = "Stops the device connecting on its own."
when = "can_untrust"
input = { address = "{address}" }

[[field.devices.row_actions]]
action = "remove_device"
label = "Remove"
description = "Forgets the pairing."
when = "can_remove"
input = { address = "{address}" }

[field.find_devices]
type = "list"
label = "Find devices"
description = "Search for devices nearby and pair a new one."
section = "devices"
query = "nearby_devices"
row_label = "{name}"
row_subtitle = "{detail}"
search = true
items_label = "found devices"
card_description = "closest first. pick one to pair."

[field.find_devices.lead]
label = "search"
description = "{description}"
row_label = "{label}"
row_subtitle = "{detail}"

[[field.find_devices.lead.actions]]
action = "enable_adapter"
label = "Turn on"
when = "can_enable"

[[field.find_devices.lead.actions]]
action = "stop_search"
label = "Stop"
when = "can_stop"

[[field.find_devices.lead.actions]]
action = "start_search"
label = "Search"
when = "can_start"

[[field.find_devices.lead.actions]]
action = "start_search"
label = "Search again"
when = "can_search_again"

[[field.find_devices.row_actions]]
action = "pair_device"
label = "Pair"
description = "Pairs the device with this computer."
when = "can_pair"
input = { address = "{address}" }

[[field.find_devices.row_actions]]
action = "pair_device"
label = "Try again"
description = "Tries pairing the device again."
when = "can_retry"
input = { address = "{address}" }

[[field.find_devices.row_actions]]
action = "open_system_settings"
label = "Pair in System Settings"
description = "Opens the system Bluetooth settings, where this device pairs."
when = "can_open_settings"

[[field.find_devices.row_actions]]
label = "Open"
description = "Shows the device in Bluetooth devices."
when = "paired"
open = "devices"

[section.reconnection]
label = "Reconnection"
description = "Automatic retries run only while a managed device is disconnected."
actions = ["reconnect", "reconnect_trusted"]

[field.managed_devices]
type = "string_array"
label = "Managed devices"
description = "Paired devices qol reconnects automatically when they drop."
section = "reconnection"
placeholder = "No devices"
default = []
card_description = "Devices qol reconnects on its own."
query = "managed_device_options"

[field.auto_reconnect]
type = "boolean"
label = "Reconnect automatically"
description = "Keep retrying managed devices while they are disconnected."
section = "reconnection"
default = true

[field.power_on_adapter]
type = "boolean"
label = "Allow automatic power-on"
description = "Turn Bluetooth on by itself when a search or connection needs it."
section = "reconnection"
default = true

[field.retry_initial_seconds]
type = "number"
label = "Initial retry delay"
description = "Seconds before the first retry after a failed connection."
section = "reconnection"
default = 1
min = 1
max = 60
step = 1

[field.retry_max_seconds]
type = "number"
label = "Maximum retry delay"
description = "Maximum seconds between retries while a managed device remains disconnected."
section = "reconnection"
default = 60
min = 5
max = 600
step = 5

[section.host]
label = "System"
description = "Whether Bluetooth is working properly on this computer."
platforms = ["linux"]

[field.host_findings]
type = "list"
label = "Bluetooth health"
section = "host"
query = "host_fixes"
row_label = "{title}"
row_subtitle = "{detail}"
card_description = "Problems found with Bluetooth."
items_label = "findings"

[field.host_findings.lead]
label = "health"
row_label = "{label}"
row_subtitle = "{detail}"

[field.host_findings.row_action]
action = "apply_host_fix"
label = "Fix"
description = "Fixes this Bluetooth problem on this computer."
when = "actionable"
input = { id = "{id}" }

[section.audio]
label = "Audio"
description = "Where system audio goes when a Bluetooth audio device connects."

[field.set_default_output]
type = "boolean"
label = "Set as default output on connect"
description = "Make a connected audio device the system output, unless another output is playing."
section = "audio"
default = true
