[package]
name = "qol-bluetooth"
version = "0.45.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde.workspace = true
serde_json.workspace = true
qol-apps.workspace = true
qol-config.workspace = true
qol-conventions.workspace = true
qol-fs.workspace = true
qol-headless.workspace = true
qol-host-fixes.workspace = true
qol-runtime.workspace = true
workspace-hack.workspace = true

[target.'cfg(unix)'.dependencies]
qol-plugin-daemon.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation.workspace = true
objc2-io-bluetooth.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd"] }
dbus = "0.9"
dbus-tokio = "0.7"
futures = "0.3"
qol-audio.workspace = true
qol-process.workspace = true
tokio = { version = "1.35", features = ["macros", "process", "rt", "signal", "sync", "time"] }

[build-dependencies]
qol-conventions.workspace = true

[dev-dependencies]
tempfile = "3"
qol-plugin-api.workspace = true
