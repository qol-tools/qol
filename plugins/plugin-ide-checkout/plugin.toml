[plugin]
id = "plugin-ide-checkout"
name = "Task Runner"
description = "Generic HTTP API for browser extensions to execute local tasks (git checkout, open apps, run scripts)"
version = "1.3.3"
author = "KMRH47"
platforms = ["macos", "linux"]

[runtime]
command = "task-runner"

[action.status]
label = "Status"
args = ["status"]

[menu]
label = "Task Runner"
items = []

[daemon]
enabled = true
command = "task-runner"

[[dependencies.binaries]]
name = "task-runner"
repo = "qol-tools/plugin-ide-checkout"
pattern = "task-runner-{os}-{arch}"
