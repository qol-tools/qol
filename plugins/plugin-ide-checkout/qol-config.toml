schema_version = 1
title = "Task Runner"
description = "Application launchers and checkout temp storage."

[section.general]
label = "General"
description = "Shared runtime defaults for checkout and execution."

[field.temp_dir]
type = "string"
config_key = "tempDir"
label = "Temp Directory"
section = "general"
default = "/tmp/task-runner"

[section.apps]
label = "Applications"
description = "Named applications that can open checked-out paths."

[field.apps]
type = "object_map"
config_key = "apps"
key_label = "App ID"
label = "Applications"
section = "apps"
default = {}

[field.apps.entry_fields]
name = "string"
paths = "string_array"
