[plugin]
id = "qol-shot"
name = "QoL Shot"
description = "Capture screenshots and record screen regions"
version = "1.8.0"
author = "KMRH47"
platforms = ["linux", "macos"]

[runtime]
command = "qol-shot"

[action.record]
label = "Start/Stop Recording"
args = ["record"]

[action.screenshot]
label = "Screenshot"
args = ["screenshot"]

[action.settings]
label = "Settings..."
kind = "settings"
args = ["settings"]

[menu]
label = "QoL Shot"
items = [
    { type = "checkbox", id = "audio-enable", label = "Enable Audio", checked = true, action = "toggle-config", config_key = "audio.enabled" },
    { type = "checkbox", id = "screenshot-auto-copy", label = "Copy Screenshot to Clipboard", checked = true, action = "toggle-config", config_key = "screenshot.auto_copy" },
]

# No background daemon needed for this plugin

[[dependencies.binaries]]
name = "qol-shot"
repo = "qol-tools/qol-shot"
pattern = "qol-shot-{os}-{arch}"
