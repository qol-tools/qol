[package]
name = "qol-shot"
version = "1.21.3"
edition = "2021"

[dependencies]
anyhow = "1"
qol-apps.workspace = true
qol-config.workspace = true
qol-conventions.workspace = true
qol-headless.workspace = true
qol-process.workspace = true
qol-runtime.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
gpui.workspace = true
qol-gpui.workspace = true
qol-platform.workspace = true
qol-plugin-daemon.workspace = true
smallvec = "1.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shm"] }

[build-dependencies]
qol-conventions.workspace = true

[dev-dependencies]
qol-plugin-api.workspace = true
